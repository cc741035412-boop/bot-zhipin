slug: guizang-photo-diary
title: 日常照片拼贴手账日记
category: 出图
purpose: 给它当天拍的几张照片，它把照片拼贴到米黄色纹理纸面上，配上手写日记、红笔标注和涂鸦小画。
scenarios:
- 周末探店或郊游后把随手拍的几张照片做成一页手账发圈
- 学生记录校园活动日常，做成带手写批注和涂鸦的纪念页
- 生活博主把日常拍的几张照片排成一页图文手账
summary: 这条提示词让模型根据你上传的多张日常照片，模拟出一页手写个人日记：底纸指定为略带纹理的米黄色或浅棕色纸张，所有照片按拼贴画风格排在同一页上；页面里除了用手写字体记叙当天做了什么、写一两句标语或简介和各张照片的介绍，还会用红笔或其他亮色圈出重点、画箭头指向推荐的地点或活动，并在空白处穿插与照片相关的简单涂鸦小画、日期天气标题和人物手绘形象。
usage: 需先上传多张当天拍的照片（如 3 张日常照加 1 张人物照）。提示词里有三处写死的固定字句没有括号，发送前要手动替换：把“2025 0909 ”改成当天日期，把“北京 晴 28°”改成实际地点、天气和气温，把“图 4 角色”按人物照所在的上传顺序改成对应图号（若不放人物照，可删掉“，并添加一个图 4 角色的手绘形象”）。推荐选用约 3:4 的竖版比例，在豆包的出图功能（Seedream 4.0）中使用。出图后检查各张照片是否拼贴完整，并核对手写汉字、日期和地点名称有无错字或乱码。
tags:
- 手账日记
- 照片拼贴
- 日常记录
- 手写涂鸦
- 豆包
models:
- 豆包
- Seedream 4.0
lang: zh
body: |-
  帮我生成一张图片，根据图片内容帮我模拟在一张略带纹理的纸张上（米黄色或者浅棕色）手写的关于今天的日记。所有的图片以拼贴画风格放在一页日记上，包含以下元素：

  用手写字体描述今天做了什么，以及一两句吸引人的标语或简介，包含几张图片的介绍，用红色笔迹或其他亮色圈出或用箭头指向特别推荐的地点或活动。穿插一些与图片特色相关的简单涂鸦式小图画，写着标题“2025 0909 ”“北京 晴 28°”，并添加一个图 4 角色的手绘形象。

  整体感觉要像一份由热爱生活的作者精心制作的、生动有趣的个人日记。
