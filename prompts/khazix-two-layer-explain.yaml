slug: khazix-two-layer-explain
title: 用日常例子和专业术语讲同一个概念
category: 学习
purpose: 给它一个想学的概念，它先举例讲直觉，再用术语解释原理，最后出三道自测题。
scenarios:
- 听完概率课，还是分不清相关和因果
- 刚学编程，想弄懂缓存什么时候会失效
- 写科普稿前，检查自己的比喻是否准确
lang: zh
body: |-
  我想学习的是：【填写概念或问题】。

  请分两层解释：

  第一层，小白版。
  用生活化的语言和一个具体例子，让完全没有基础的人也能听懂。

  第二层，专业版。
  使用准确术语，讲清核心机制、适用边界和常见误解。

  最后请整理出：
  1. 列出小白说法与专业术语的对应关系；
  2. 我最容易理解错的地方；
  3. 3个用于检查我是否真正理解的问题。
summary: 听懂例子和理解原理是两回事。第一遍用生活中的例子讲，让没基础的人也跟得上；第二遍换成准确术语，说清它为什么这样运作、在什么条件下适用。两种说法最后会逐项对应，方便你找出自己在哪一步把意思想岔了。
usage: 把【填写概念或问题】换成一个具体概念或疑问，整段贴给普通对话 AI。读完后先不看解释，自己答那三道题；答不出的地方，回到术语对照里，看是词没记住，还是没弄清适用条件。
