slug: songguo-id-photo
title: 正装 2 寸证件照
category: 出图
purpose: 给它一张正脸生活照，它截取头部并换上指定底色与正装，生成 2 寸证件照。
scenarios:
- 毕业生投简历前用日常正脸照生成正装证件照
- 上班族办工牌或填报名表时临时准备蓝底照
- 学生换社团证或借书证照片时调整底色和着装
summary: 这段提示词由一句主指令加四项具体要求组成：先用「截取图片人像头部，帮我做成2寸证件照」定好取景范围与照片规格，再把底色、服装、朝向和表情分四项逐条列出（「1、蓝底」「2、职业正装」「3、正脸」「4、微笑」）。因为各项要求分行独立，使用时想换白底或红底、改便装或调整表情，只需替换对应那一项的文字。
usage: 先上传一张五官清楚、光线均匀的正脸人像参考图。提示词没有方括号占位符，按实际需求直接修改对应词句：可把「2寸证件照」改成所需规格，把「1、蓝底」改成白底或红底，把「2、职业正装」改成衬衫等服装，把「4、微笑」改成不露齿或自然平视。推荐采用 2 寸证件照竖版比例（约 5:7，对应约 35×49mm），发给 Gemini 或 Google AI Studio 里的 Nano Banana 出图。生成后检查五官神态是否与本人一致、衣领与肩线是否端正；用于正式报名或办证前，务必核对收件方是否允许使用 AI 处理的照片，以及尺寸、分辨率和底色是否符合具体规定。
tags:
- 证件照
- 2寸照片
- 换底色
- 职业正装
models:
- Nano Banana
lang: zh
body: |-
  截取图片人像头部，帮我做成2寸证件照，要求:
    1、蓝底
    2、职业正装
    3、正脸
    4、微笑
