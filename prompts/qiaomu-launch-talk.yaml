slug: qiaomu-launch-talk
title: 写一篇不浮夸的产品介绍演讲稿
category: 营销
purpose: 填入产品介绍、个人背景和说话风格，它避开自嗨黑话和空洞金句，写出一篇适合上台或录视频讲的口语化演讲稿
scenarios:
  - 独立开发者或创业者在路演、Demo Day 上台前写 5 分钟介绍稿
  - 大学生参加创新创业比赛或毕业作品答辩时准备不套路的发言稿
  - 小团队主理人录新品发布视频时写一篇像真人聊天一样的口播长稿
summary: 很多产品发布稿之所以让人听不下去，是因为塞满了「小步快跑」「改变世界」这类空话，或者拿没有统计口径的短期数据硬吹。这条提示词先立了七条负面清单：不准过度外推短期数据、不准踩同行抬自己、不准给旧概念换新词当创新、不准用套路化口号收尾；接着要求从具体痛点场景切入，讲清楚方案做过什么取舍、数据在什么样本和周期下测出来的、目前还有什么局限。最后不用小标题和列表，而是按你的性格写成 3 到 5 句一段、能直接开口念的演讲稿。
usage: 复制后先改四个地方：第一，把「格式要求」里的「当前是2025年11月。」改成你实际的演讲年月；第二，把末尾的「[产品URL或描述]」换成产品的具体功能、解决的痛点以及带统计周期和样本量的真实数据（尽量直接贴文字说明，不要只给网址，以免模型打不开网页瞎编）；第三，在「[背景信息]」填你的经历和为什么做这件事；第四，在「[如果有明显的个性特征,在此说明]」写你平时说话是偏直接讲逻辑、偏感性聊体验还是爱留白。发给任意主流对话模型后，大声读一遍成稿，重点核对里面的数据和测试条件有没有被模型夸大或凭空捏造。
tags:
  - 演讲稿
  - 产品路演
  - 新品发布
  - 创业分享
lang: zh
body: "你是一位创业者，要写一份产品介绍推广演讲稿。\n\n## 核心目标\n\n让听众听完后产生两种感受:\n- 普通用户: \"这个问题我确实遇到过,这个解决方案听起来靠谱,我想试试\"\n- 投资人: \"这个市场有空间,团队理解够深,产品有潜力,值得聊聊\"\n\n## 需要避免的表达模式\n\n**过度外推短期数据**: 展示数据时缺少测试条件、样本信息、边界说明。改进方式是给出具体条件,说明什么场景下有效,什么场景下会失效。\n\n**非黑即白的方案对比**: 强调自己独特正确,贬低其他方案。改进方式是说清楚选择这个方案的权衡,放弃了什么,得到了什么。\n\n**包装已有概念**: 给成熟概念换新名字当创新,堆砌流行词汇。改进方式是直接说明借鉴了什么,改进了什么具体问题。\n\n**刻意展示谦虚或困难**: 过度渲染困难或反复强调\"还在早期\"。改进方式是客观陈述当前状态和接下来要做什么。\n\n**空洞的方法论**: 用\"小步快跑\"\"用户第一\"这类正确但无信息量的话。改进方式是说出具体问题、尝试方案、判断指标、结果如何。\n\n**公式化的行动召唤**: \"如果没达到XX,加我微信\"\"完全没做推广,靠口碑传播\"这类套路化表达。改进方式是根据创始人性格和产品特点,自然地给出下一步。\n\n**空洞的金句收尾**: 用\"梦想\"\"改变世界\"煽情,或刻意的排比句。改进方式是用产品价值、具体计划或留白来结束。\n\n## 好的分享应该做到\n\n**用真实场景建立共鸣**: 开头用具体的、能感同身受的场景,让听众点头\"对,我也遇到过\"。场景要有细节、有情绪、有时间成本。\n\n**用反差制造冲击**: 展示问题的严重程度(量化的时间浪费、机会成本),展示解决后的效果(对比数据)。但所有对比都要有测试条件和边界。\n\n**用洞察展现深度**: 说明为什么这个问题之前没被解决好,你的方案为什么现在可行,展现对问题本质的理解。\n\n**用数据证明牵引力**: 如果有增长数据,说明增长曲线和获客渠道。如果有留存数据,说明真实使用频率。如果有用户反馈,引用具体的、有细节的评价。所有数据都要说明统计周期和样本量。\n\n**用具体性建立可信度**: 数字要有条件和对比基准,方案要有场景和效果验证,困难要有具体表现和解决过程。\n\n**坦诚但不自我设限**: 说明当前局限性,同时说明这些局限在路线图上的位置,是可以突破的。\n\n**融资信息要克制**: 不详细列出金额用途招聘计划。用产品数据、市场空间、技术壁垒让投资人自己判断。如果提融资,只点明时间窗口,留出让投资人主动询问的空间。\n\n**结尾要自然**: \n- 对用户: 给出体验理由和方式,但不要过度承诺\n- 对投资人: 给出联系方式,但不要推销\n- 根据创始人性格选择: 有的直接干脆,有的留有余地,有的用问题或场景收尾\n\n## 叙事的多样性\n\n**不要被固定结构束缚**: \n- 可以从一个意外的细节开始\n- 可以用对话推进叙事\n- 可以在中间插入个人思考\n- 可以用反问引发思考\n- 允许重复强调核心观点\n- 允许跳跃和留白\n\n**让创始人的个性渗透**: \n- 技术背景的创始人可以更直接、更注重逻辑\n- 产品背景的创始人可以更感性、更注重体验\n- 有哲学思考的创始人可以更抽象、更有深度\n- 不要让所有人说同样的话\n\n**数据呈现要有变化**:\n- 不要每次都是\"XX%的用户...平均XX次\"\n- 可以用绝对数字、可以用对比、可以用趋势\n- 可以用用户原话、可以用场景描述\n- 让数据服务叙事,而不是打断叙事\n\n**结尾要有辨识度**:\n- 不要每次都是\"承诺+联系方式\"\n- 可以用一个问题结束\n- 可以用一个场景结束  \n- 可以用下一步计划结束\n- 可以留白,让听众自己思考\n\n## 格式要求\n\n**短段落,多留白**: 每段3-5句话,段落之间空一行。\n\n**重点突出**: 核心数据、关键结论用 **加粗**,每段最多1-2个加粗点。\n\n**演讲稿形式**: 不使用Markdown标题、列表、分点,用口语化连接词串联,保持叙事流畅性和故事感。\n\n**时间信息准确**: 当前是2025年11月。\n\n---\n\n用以上原则,写一份产品介绍演讲稿。\n\n产品信息: [产品URL或描述]\n创始人背景: [背景信息]\n创始人性格特点: [如果有明显的个性特征,在此说明]"
