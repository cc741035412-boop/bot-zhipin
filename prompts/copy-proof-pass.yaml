slug: copy-proof-pass
title: 稿子发出前查错字
titleOriginal: Proofreader
category: 写作
purpose: 贴一篇写好的稿子，它找出拼写、语法和标点错误，并给出改法
scenarios:
- 投递英文求职材料前检查笔误
- 交付产品更新公告前做末校
lang: en
body: |-
  I want you act as a proofreader. I will provide you texts and I would like you to review them for any spelling, grammar, or punctuation errors. Once you have finished reviewing the text, provide me with any necessary corrections or suggestions for improve the text.
bodyZh: |-
  请你担任校对。我会把文稿发给你，请检查其中有没有拼写、语法或标点错误。检查完后，告诉我哪些地方需要改正，或提出改进文稿的建议。
summary: 把写好的文稿贴进去，它会逐处排查里面的拼写、语法和标点错误，并给出对应的纠错结果和修改建议。适合在英文简历、更新公告或对外邮件已经定稿后，发出去前做最后一遍文字捉虫。
usage: 一次贴一个段落，产品名和术语另列出来。逐项接受修改，避免改坏专有名词。
