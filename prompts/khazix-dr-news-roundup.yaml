slug: khazix-dr-news-roundup
title: 把近期行业新闻整理成简报
category: 分析
purpose: 给它关注的行业和子题，它分类汇总近期新闻，列出事实、数据和来源，再判断接下来的趋势。
scenarios:
- 编辑给周报挑出值得追的行业新闻
- 学生做课堂汇报前梳理近期 AI 动态
- 开发者集中了解最近发布的 AI 产品
lang: zh
body: |-
  帮我汇总“全球AI行业最新动态”
  - 涉及的子主题包括：主要厂商的近期新闻（新品发布、财报）、各大有热度的AI产品的发布、破圈的作品、跟AI相关的社会舆论等等。
  - 请按主题分类总结，并提供具体事实和数据（例如某公司营收增长X%，某国政策要点等），列出来源。
  - 最后给出对AI行业未来6个月趋势的分析判断。
summary: 同一周里，厂商发财报、产品更新、一件作品突然走红，值得问的问题各不相同。它先按主题把消息分开，写清发生了什么、数字出自哪里，最后才讨论未来半年的走向。读简报时，可以直接引用查实的消息，把趋势判断留给讨论。
usage: 开深度研究功能后贴入提示词，把“全球AI行业最新动态”换成要追的主题，写清近期指哪段时间。厂商、新品、作品和社会舆论可按需增删；营收增长和政策要点是事实类型的例子，X% 不必自己填。未来6个月也可改成你要观察的时段。打开来源核对新闻日期、数字与统计口径，别把末段预测写成已发生的事。
