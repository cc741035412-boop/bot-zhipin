slug: khazix-name-the-dislike
title: 把说不出的不喜欢变成修改标准
category: 效率
purpose: 给它一份你不满意的结果，它通过对比几个方向，逐步问出你的判断标准。
scenarios:
- 作者看着几个标题都觉得别扭
- 学生挑演示稿封面时说不清想改哪里
- 团队审首页草图时难以给出具体反馈
lang: zh
body: |-
  我现在讲不出来具体原因，但我就是不喜欢，请你对比几个方向，一次问我一个问题，帮我把判断标准找出来。
summary: 不必先学会点评，才能提出修改意见。它把几个可能的方向放在一起，每次只问你一个问题。你可以先说哪一个更接近心意，再从几次选择里找出自己真正在意的差别，让下一轮修改有个依据。
usage: 不用替换文字。若在原对话里，紧接着不满意的结果贴这句话；若另开对话，先贴稿子或上传截图，再贴提示词。文字用多轮对话 AI 即可，截图要用能看图的。逐问作答后，拿总结出的标准再挑一版，看它能不能解释你为什么选它。
