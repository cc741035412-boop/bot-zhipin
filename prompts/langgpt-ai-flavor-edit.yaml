slug: langgpt-ai-flavor-edit
title: 把文章里的 AI 腔删干净
category: 写作
purpose: 给它一篇现成的初稿，它按八条硬标准砍掉铺垫、套话、情绪标注和结尾升华，留下干脆的正文
scenarios:
  - 上班族用 AI 起草完方案或总结后，删掉满篇的「综上所述」「值得注意的是」
  - 学生改论文初稿或读书报告时，砍掉来回车轱辘的同义反复和防御性铺垫
  - 自媒体作者给评论文章收尾，删掉生硬拔高的升华段和对称排比句
summary: 用 AI 写出来的初稿，常带着一股「接下来我将从三个方面展开」「总而言之」的端着劲儿。这条提示词专门用来给现成稿动刀，一口气立了八条删改标准：砍掉开场说明和过渡声明等元评论、删掉防御性铺垫、两句同义只留更准的一句、每个论点只留最强的一个例子、把名词短语还原成动词、删掉情绪标注句、把对称结构改成明确判断，并且「删去结尾升华段，论述在哪里结束文章就在哪里结束」。
usage: 复制提示词后空一行，直接贴上你要修改的段落或全文。任何通用对话模型都能用，长文章建议按小节分段贴，免得模型省事把实质论据也一并略掉。改完后篇幅可能会变短（具体缩减幅度视初稿水分而定），请对照初稿检查两件事：一是把平衡对称的句式改成单向判断时，所选的方向合不合你的本意；二是每个论点只留一个例子时，有没有误删你必须保留的核心论据或数据。
tags:
  - 去AI味
  - 文章精简
  - 改稿润色
  - 删减套话
lang: zh
body: |-
  请以下列标准修改这段文字：

  删去所有元评论，包括开场说明、过渡声明、总结宣告。删去所有防御性铺垫，论点直接陈述。消除同义反复，两句话表达同一意思时，保留更准确的那句。每个论点保留最强的一个例子。将名词短语还原为动词。删去情绪标注句，让内容本身说话。删去结尾升华段，论述在哪里结束文章就在哪里结束。将对称结构改为判断，说出哪个方向更重要。

  修改后的文字会比原文短。如果感觉"太短了"，这是原文注水的证明，不是修改的问题。
