slug: khazix-market-history
title: 梳理一个行业或公司的来龙去脉
category: 分析
purpose: 纵向看它怎么一路走来，横向和同行比，最后推测接下来的走向
scenarios:
- 接手陌生赛道前做功课
- 写行业或技术调研长文前梳理发展拐点与竞争格局
- 立项前摸清头部产品的来路和包袱
lang: zh
summary: 研究对象可以是产品、公司、技术，也可以是一个行业。纵向看它从什么需求里冒出来、经过哪些转折，哪些早年的选择成了今天的本事或包袱；横向挑几个最值得比的同行，用同一套维度说清用户为什么选它、为什么离开；最后推出三条可能的走向，各写前提和预警信号。重要结论要就近标来源和日期，事实、推断、观点分开写，成稿要求一万到三万字。
usage: 从原文「学习」里复制「横纵分析法」，交给带深度研究功能的模型，把【】换成要研究的对象。报告很长，先读核心结论和时间线，再点开关键转折旁边的出处核对；标着「暂未核实」的地方别当结论用。
