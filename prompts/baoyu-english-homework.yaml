slug: baoyu-english-homework
title: 批改英语作文并讲清错因
category: 学习
purpose: 给它一篇英语作文或作业，它逐句揪出语法、拼写、标点和用词错误，讲清为什么错并给出正确写法
scenarios:
  - 学生交英语作文前自查时态、单复数和拼写错误
  - 家长辅导孩子英语作业时看懂错在哪里、该怎么讲
  - 上班族写完英文邮件或周报后检查语法和用词
summary: 让 AI 改英语作文，如果只拿回一篇润色后的成品，下次写还是会犯同样的错。这条提示词要求通读全文后，把语法、拼写、标点符号和用词选择上的问题逐条列成清单：每一条都按“错误类型”“原句”“错误解释”“修改建议”四项输出，同一种错出现多次也会逐一标出。提示词里自带了时态和拼写两条示例定好输出格式，解释尽量简单直白，方便一边改稿一边把薄弱的语法点补上。
usage: 提示词里的两段 <item>（如“She go to the store yesterday.”和“It is a beatiful day.”）只是定格式用的示例，不用删改。复制整段提示词后，在末尾换行贴上你的英语作文，任何主流对话 AI（ChatGPT、Claude、豆包、Kimi）都能直接用；想按特定考试标准改，可以在作文前补一句年级或考试类型（如初中、四六级、雅思）。拿到批改清单后，对照自己的句子逐条看修改建议是否符合你想表达的原意，再把改后的句子连起来读一遍，确认上下文时态一致。
tags:
  - 英语作文
  - 语法批改
  - 英语学习
  - 作业辅导
lang: zh
body: |-
  批改学生提交的英语作业，指出语法、拼写、标点符号、用词选择等方面的错误，并给出明确的修改建议。

  # Steps
  1. 阅读学生提交的作业并理解全文内容。
  2. 找出其中的错误，例如语法、拼写、标点符号、或用词不当等。
  3. 对每个错误进行解释，说明为什么该用法不正确。
  4. 给出对应的修改建议，帮助学生理解正确的写法。

  # Output Format
  请按照以下格式提供反馈：
  - 错误类型：说明是哪种错误（如语法、拼写、标点等）。
  - 原句：摘录出含有错误的句子。
  - 错误解释：说明错误的原因，尽量简单易懂。
  - 修改建议：给出如何修改的建议或正确的写法。

  结果应以列表的形式呈现，类似如下：
  <item>
      "错误类型": "语法错误",
      "原句": "She go to the store yesterday.",
      "错误解释": "谓语动词在过去时态下不应使用动词原形。",
      "修改建议": "She went to the store yesterday."
  </item>
  <item>
      "错误类型": "拼写错误",
      "原句": "It is a beatiful day.",
      "错误解释": "单词 'beatiful' 的拼写错误。",
      "修改建议": "It is a beautiful day."
  </item>

  # Notes
  - 尽量保证反馈简单易懂，适合学生的理解水平。
  - 如果有多个相同类型的错误，逐一指出。
  - 不仅指出错误，还需解释原因，以便学生可以学习并改正类似错误。
