slug: seedance-photos-to-vlog
title: 手绘涂鸦风照片 vlog
category: 视频
purpose: 上传一组同主题日常照片，把它们合成带手绘动态涂鸦抠像、轻微动态和背景音乐的竖屏短视频。
scenarios:
- 学生把周末探店或出游的一组照片做成日常短片
- 养宠自媒体把宠物不同穿搭的照片合成打卡视频
- 小店店主把店内多张实拍图做成带配乐的趣味短片
summary: 手里攒了一组同一主题的照片，想合成为带配乐的动态短片，又怕模型把照片里的人或物改走样。这条提示词先用「将所有图片进行一键成片，图片顺序自由安排」交由模型编排多张参考图，再指定「手绘动态涂鸦抠像风格」和「具有网感的趣味音频或者 bgm」加上涂鸦装饰与配乐；第二段专门交代「图片可以微微动起来，live 图的效果，但不要改变原图，保持和原图的高度一致」，只让画面做出类似实况照片的轻微动态，同时保留原图内容不被改动。
usage: 必须先上传一组同一主题的照片作为参考图（官方示例上传了 8 张）。把「咖啡店 vlog」里的「咖啡店」和「一只小狗穿着不同可爱服装在咖啡店打卡拍照的趣味日常」，换成你照片里的地点、主角和日常活动；想换视觉风格或声音，也可改动「手绘动态涂鸦抠像风格」和「具有网感的趣味音频或者 bgm」。可在火山方舟里使用 Doubao Seedance 2.5 系列（含 2.5 flash）的视频生成功能，推荐比例 9:16（官方示例为 720×1280、15 秒，带音轨）。出片后检查各张照片是否保留了原图内容、轻微动态与配乐衔接是否自然。
tags:
- 照片成片
- vlog
- 涂鸦风
- 实况动效
models:
- Doubao Seedance 2.5
- Seedance 2.5 flash
lang: zh
body: |-
  将所有图片进行一键成片，图片顺序自由安排，生成一个手绘动态涂鸦抠像风格的咖啡店 vlog，记录一只小狗穿着不同可爱服装在咖啡店打卡拍照的趣味日常。生成具有网感的趣味音频或者 bgm。

  图片可以微微动起来，live 图的效果，但不要改变原图，保持和原图的高度一致。
