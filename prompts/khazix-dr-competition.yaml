slug: khazix-dr-competition
title: 查清同一市场里各家靠什么竞争
category: 分析
purpose: 给它行业和自己的产品，它调查主要对手，比较各家长短，再建议你从哪里切入。
scenarios:
- 学生为创业比赛准备竞品分析
- 独立开发者给新工具找差异化方向
- 业务团队做市场调研时比较同行定价
lang: zh
body: |-
  请帮我分析当前 <在线教育>行业的主要竞争对手。具体要求：
  1. 列出至少 <五>家主要竞争公司，并简要介绍其产品定位和市场份额。
  2. 分析各竞争对手的 <优势和劣势>（从功能、价格、用户口碑等角度）。
  3. 综合以上信息，给出 <我公司产品>在市场中的机会点和差异化建议。
summary: 先弄清同一市场里有哪些主要公司，各自卖给谁、占多大份额，再从功能、价格和用户口碑看它们的长处与短处。最后把这些比较落到你自己的产品上：对手已经做好了什么，还有哪些需求值得你去做。
usage: 开启 AI 的深度研究功能，再贴模板。把 <在线教育> 换成目标行业，<五> 换成至少要查的公司数，<优势和劣势> 可保留或改成重点比较的问题，<我公司产品> 换成产品名称、用途和目标用户。核对市场份额的出处、年份、地区和统计口径；查不到的数字不要拿来排名。
