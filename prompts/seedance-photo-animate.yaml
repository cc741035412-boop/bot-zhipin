slug: seedance-photo-animate
title: 单张照片首帧动态视频
category: 视频
purpose: 上传一张照片作为视频首帧，按主体、动作、运镜、环境动态和声音写一句话，生成有声动态短片。
scenarios:
- 把家里的单人照或合照做成人物睁眼看向镜头的动态画面
- 把和宠物的照片做成带微风吹拂和环境音的短视频
- 自媒体作者把单张插画或人像照转成带运镜的动态片头
summary: 拿一张照片作为视频首帧时，照片里已经有的穿搭和背景不用重新描写，提示词重点交代画面接下来怎么动。这条官方示例虽然只有一句话，却按顺序拆出了五层信息：先点明画面主体（「女孩抱着狐狸」），再写主体的细微动作与神态（「女孩睁开眼，温柔地看向镜头，狐狸友善地抱着」），接着交代镜头运动（「镜头缓缓拉出」），再补上环境带来的动态细节（「女孩的头发被风吹动」）以及匹配的背景声音（「可以听到风声」）。照着这五步拆句，就能把静态照片转成有声短片。
usage: 必须先上传一张照片作为视频首帧。整句都是具体示例，用时按五段结构整句替换：把「女孩抱着狐狸」换成你照片里的人或物；把「女孩睁开眼，温柔地看向镜头，狐狸友善地抱着」换成主体的动作与神态；把「镜头缓缓拉出」换成想要的运镜方式；把「女孩的头发被风吹动」换成环境引起的动态；把「可以听到风声」换成对应的环境音（不需要声音可删去）。可在火山方舟里使用 Seedance 2.5 系列的图生视频功能，推荐画幅跟随首帧原图比例（官方示例为 1280×720、5 秒，带音轨）。出片后检查主体动作、运镜方向和环境音是否与描述一致。
tags:
- 首帧生视频
- 图生视频
- 照片动效
- 有声视频
models:
- Seedance 2.5
lang: zh
body: |-
  女孩抱着狐狸，女孩睁开眼，温柔地看向镜头，狐狸友善地抱着，镜头缓缓拉出，女孩的头发被风吹动，可以听到风声
