slug: khazix-dr-learning-path
title: 按你的起点和期限排学习路线
category: 学习
purpose: 给它你的基础、目标和可用时间，它把要学的内容分阶段排好，配上书、课或练习项目。
scenarios:
- 设计专业毕业生准备转行做开发
- 上班族打算用业余时间学数据分析
lang: zh
body: |-
  背景：我是一名<视觉传达设计>应届毕业生，想转行做软件开发，但没有编程基础。
  目标：希望在<X个月>内具备胜任初级软件工程师的能力。
  请结合我的背景和优势，为我设计一份学习路线：
  - 列出每阶段（例如每2个月）的学习重点（比如编程基础、算法与数据结构、项目实践等）。
  - 为每个阶段推荐<具体资源>（书籍、在线课程、练习项目等）。
  - 提供一些学习技巧或注意事项。
summary: 同样是学编程，有人得从写第一行代码开始，有人已经能动手做项目。这份路线先看你会什么、想在多久以后做到什么，再按阶段列出重点。书、课和练习都跟着阶段走，拿到计划就知道眼下该用哪份材料，不必先啃完整张书单。
usage: 开启 AI 的深度研究功能，贴入提示词。把 <视觉传达设计> 换成你的专业或经历，把 <X个月> 换成实际期限，<具体资源> 写你想用的书、课程或项目。应届身份、零基础转开发、初级工程师目标都按实情改；每两个月一段以及算法等学习重点只是示例。收到路线后，打开第一阶段的资源，试一道练习，看看难度和时间安排是否合适。
