slug: khazix-film-triptych
title: 三宫格电影感字幕写真
category: 出图
purpose: 给它一张人物或宠物照，填好场景、三格景别动作和可选台词，它生成合成在一张图里的三宫格写真。
scenarios:
- 用一张日常单人照做发朋友圈或小红书的电影感三宫格
- 给家里的猫狗上传一张照片，配上三句内心独白台词
- 旅行回来拿一张打卡照生成远景、特写和背影三格画面
summary: 靠一张参考图，就能让同一人物或宠物在同一场景里呈现出三格不同景别与动作的画面，并合成在一张三宫格图里。提示词先统一整体质感（胶片感、艺术感或电影感）、地点时间氛围，以及与参考图一致的主体和衣着；再按第一到第三张画面分别填写景别、所处位置与动作神态，以及可选的底部居中字幕；最后收束整体色调、摄影参数与画幅比例。
usage: 需先上传 1 张人物或宠物参考图。在【胶片感/艺术感/电影感】和末尾【2:3/3:4/9:16】中各选定一项（常用 3:4）；填好【详细描述时地点，时间，氛围】、【主体】和【描述穿着】；三格画面分别填写【景别】、【人物所处的场景位置，动作，（手持物/神态/氛围）】。每格末尾括号里的字幕为可选：要加字幕就选定【中英文】并在“字幕【】”里填台词，不加字幕可删掉对应括号。最后补上【整体色调，摄影参数，氛围】，放进豆包（Seedream 4.0）使用。出图后检查三格主体的长相与衣着是否一致、字幕有无错漏。
tags:
- 三宫格
- 电影感写真
- 人像改图
- 宠物写真
- 豆包
models:
- 豆包
- Seedream 4.0
lang: zh
body: |-
  将图片编辑为三宫格【胶片感/艺术感/电影感】写真。
  场景为【详细描述时地点，时间，氛围】。
  画面中【主体】与参考图一致，衣着为【描述穿着】。
  第一张画面：【景别】，【人物所处的场景位置，动作，（手持物/神态/氛围）】，（添加【中英文】字幕【】）。
  第二张画面：【景别】，【人物所处的场景位置，动作，（手持物/神态/氛围）】，（添加【中英文】字幕【】）。
  第三张画面：【景别】，【人物所处的场景位置，动作，（手持物/神态/氛围）】，（添加【中英文】字幕【】）。
  【整体色调，摄影参数，氛围】，字幕位于底部居中。字幕位于底部居中，三宫格合成一张图。比例【2:3/3:4/9:16】
