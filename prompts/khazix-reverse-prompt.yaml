slug: khazix-reverse-prompt
title: 从成品反推同风格提示词
category: 创意
purpose: 给它一份满意的成品，它反推一段可复用的提示词，并解释每句的作用。
scenarios:
- 写作者想延续栏目样稿的口吻
- 社团编辑想按往期样例写下一期活动预告
- 开发者想沿用已有的版本说明格式
lang: zh
body: |-
  这是我想要的成品范例。
  请你倒推一个提示词，让我用它能稳定生成同风格的内容。
  并说明这个提示词里每一句的作用。
summary: 有时你一眼就认得想要的效果，却说不清该怎么要求 AI。它从成品往回推，交给你的不是另一份仿作，而是一段下次还能用的指令。逐句说明能帮你判断，换了题材以后，哪些要求要保留，哪些只是这个范例的细节。
usage: 不用填占位符。先贴成品范例，再接上这段提示词一并发送；范例是文件时，先上传到能读该格式的 AI 对话里。另开对话，用它反推的提示词换个题目试写，对照范例看结构和语气是否仍然相近，而不是照抄原句。
