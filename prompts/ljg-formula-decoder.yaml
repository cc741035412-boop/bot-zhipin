slug: ljg-formula-decoder
title: 把一个公式讲明白
category: 学习
purpose: 给它一个数学或物理公式，它先讲现实困惑和几何物理直觉，再逐项对应符号、代入极端值检验
scenarios:
  - 高中生或大学生学贝叶斯公式、傅里叶变换时，搞懂分母和算符到底在干什么
  - 考研党或自学者背不牢物理公式，通过代入 0 和无穷大以及量纲看穿公式脾气
  - 开发者或理工科老师备课时，给抽象公式找一个切蛋糕、拉面积式的直观解释
summary: 课本讲公式常上来就摆定义和推导，字都认识就是不知道它为什么长这样。这条提示词反过来走五步：先不写公式，讲一个没有它就卡壳的现实场景；再抛开符号搭一个切蛋糕、流体管道或面积拉伸的直觉画面；第三步才写出公式，把每个变量、主算符、修正项和归一化因子一一对回刚才画面里的动作；第四步代入 0、1、无穷大等极端值和量纲单位去拷问公式；最后放到守恒律或知识网络里看清直觉在什么边界会失效。
usage: 复制提示词后换行，直接写公式名字（如「贝叶斯公式」「麦克斯韦方程组」）或贴上公式表达式，也可以加上你现在的年级或卡住的地方（比如「我大一，总搞不懂分母为什么要归一化」）。建议用推理能力强且能正常渲染 LaTeX 公式的对话模型。读完后自己动手算一遍第 4 阶段的极端值，核对公式里的正负号、上下标和量纲单位有没有写错。
tags:
  - 公式解读
  - 数学直觉
  - 物理学习
  - 理科自学
