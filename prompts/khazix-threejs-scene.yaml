slug: khazix-threejs-scene
title: 把一段场景描述做成可旋转的三维网页
category: 编程
purpose: 给它一段画面描述，它用 Three.js 写出可拖动视角、滚轮缩放的单文件网页。
scenarios:
- 学生把校园一角做成课堂演示
- 小说作者从不同角度查看虚构街景
- 开发者给作品集试做交互场景
lang: zh
body: |-
  帮我做一个单文件的HTML网页，用Three.js实现一个可以自由浏览的3D场景。
  场景是：【你想要的画面，越具体越好。比如：重庆洪崖洞的夜景，层层叠叠的吊脚楼亮着暖黄色的灯，前面是嘉陵江，江上有游船，旁边是千厮门大桥，远处是城市的楼群】
  要求：
  1.所有模型和贴图都用代码生成，不要引用任何外部的图片和模型文件。
  2.支持鼠标拖动旋转视角、滚轮缩放。
  3.画面要有氛围感，重点处理光照、雾气和色调。
  4.在普通的笔记本上也要流畅，加载的时候显示进度。
  5.主要物体，都做成独立的组件，方便我后面单独修改。
summary: 模型和贴图都由代码生成，不用另备图片或模型文件。光照、雾气和色调负责表现气氛，主要物体则分成独立组件，想挪一栋楼时不必重做整条街。模板还要求显示加载进度，并照顾普通笔记本上的浏览体验。
usage: 把场景是：后面【】里的整段洪崖洞夜景示例换成自己的画面，写明主体、远近位置和光线，再整段贴给会写代码的 AI。用浏览器打开生成的 HTML，在自己的笔记本上拖动、缩放，检查画面是否流畅、加载时有没有进度提示，再对照描述看主要物体的位置。
