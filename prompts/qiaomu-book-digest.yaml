slug: qiaomu-book-digest
title: 把一本书整理成读书笔记
category: 学习
purpose: 给它书名或全书内容，它按核心观点、重要引用、分类笔记、思维导图、问答、行动建议和术语表七部分拆出一份读书笔记
scenarios:
  - 学生读专业书或课外书时快速梳理全书框架与术语
  - 上班族读完工具书后提炼能落地的行动建议
  - 读书博主写拆书稿前整理重点章节、核心问答和知识脉络
summary: 读完一本书想留存笔记，常常只摘了几句金句就不了了之。这条提示词把一本书拆成七块固定输出：先写最少 3 段的核心观点解读，外加 5 条关键要点和 5 条创新见解；接着摘出带章节号的重要引用与引用理由；再按主题整理带标签的阅读笔记、文本绘制的思维导图、核心问题问答、具体的行动建议与认知升级，最后附上关键术语解释。从全书骨架到读完怎么用都列得明明白白，省去自己搭笔记框架的功夫。
usage: 复制后，把最末尾写死的示例书名“待解读的书：《用户体验要素》”里的《用户体验要素》换成你想读的书名；上面输出格式里的方括号和尖括号是给 AI 看的排版说明，不用动手填。如果只给书名，AI 只靠自身记忆发挥，第 2 部分的引用句子和“（第X章）”章节号很容易张冠李戴或硬编，建议选 Kimi、Claude 等支持长文本的 AI，把电子书全文、目录或你划线的书摘一起上传。拿到笔记后，务必对照原书核对引用的句子和章节号是否真实存在。
tags:
  - 读书笔记
  - 拆书
  - 思维导图
  - 知识整理
lang: zh
body: "Why：\n目的：解读一本书的核心内容\n\nHow：\n方法：\n1. 基础分析：核心观点、书籍概括、重点引用\n2. 进阶分析：阅读笔记、思维导图、书籍FAQ\n3. 建议补充：行动建议 & 认知升级、关键词术语表\n\nWhat：\n\n输出格式：\n## 1. 核心观点\n[完整解读，最少3段话，逻辑清晰连贯]\n\n- **关键要点**：[要点列表，最重要的5条]\n- **创新见解**：[原创性观点，最重要的5条]\n\n## 2. 重要引用\n> 原文1：[引用内容]（第X章）\n\n**引用理由：**[为什么这段引用重要]\n\n> 原文2：[引用内容]（第X章）\n\n**引用理由：**[为什么这段引用重要]\n\n> 原文3：[引用内容]（第X章）\n\n**引用理由：**[为什么这段引用重要]\n\n...\n\n## 3. 阅读笔记\n**【分类1】：一句话概括**\n\n- <列点1>\n- <列点2>\n- <列点3>\n\n#<tag1> #<tag2> #<tag3> ...\n\n**【分类2】：一句话概括**\n\n- <列点1>\n- <列点2>\n- <列点3>\n\n#<tag1> #<tag2> #<tag3> ...\n\n**【分类3】：一句话概括**\n\n- <列点1>\n- <列点2>\n- <列点3>\n\n#<tag1> #<tag2> #<tag3> ...\n...\n\n## 4. 思维导图\n[文本绘制的思维导图]\n\n## 5. 文章核心问题问答（回答尽量引用原文）\n**问题1**\n回答：回答1\n\n---\n**问题2**\n回答：回答2\n\n---\n**问题3**\n回答：回答3\n---\n\n## 6. 行动与改变\n**行动建议：** \n[读完此书，读者可采取的一个具体步骤。]\n\n**认知升级：** \n[读完此书，读者在思想或认知上的提升。]\n\n## 7. 关键术语解释\n[解释文中出现的关键术语]\n\n\n质量要求：\n1. 准确度：忠于原书内容，力求准确客观\n2. 完整度：关键信息点覆盖率达90%以上\n3. 可操作性：每部分输出提供具体的见解和应用价值\n4. 清晰度：结构层次分明，重点突出\n\n---\n\n待解读的书：《用户体验要素》"
