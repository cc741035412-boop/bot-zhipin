slug: khazix-premortem
title: 开工前先写一份失败复盘
category: 分析
purpose: 给它一个项目设想，它参照类似项目的失败案例，倒推哪里可能先出问题。
scenarios:
- 社团办展前排查筹备风险
- 独立开发者上线前审视推广计划
- 团队立项前复查关键决策
lang: zh
body: |-
  【我的项目/想法】
  请假设这个项目到时候失败了拉了大跨。
  然后回答：
  什么时间点开始出现衰退信号？
  最致命的决策错误是什么？
  你忽视的核心风险是什么？
  如果能重来，第一个应该改的是什么？
  要求：写一篇 "失败复盘文章"，要基于真实的类似项目失败案例。
summary: 先假定项目已经失败，再回头写复盘：最早什么时候有了苗头，哪次决定最致命，当时漏看了什么风险？它要参照真实的类似案例，最后挑出重来时最先该改的一件事。比起列一长串风险，这样更容易看出眼下该盯住哪个信号。
usage: 把【我的项目/想法】换成你准备做的事，写清目标、进度安排和已经定下的做法，整段发给能联网查案例的 AI。核对案例出处，再比较对方出事的条件与你的项目是否相同；复盘里假想的情节不是预测。
