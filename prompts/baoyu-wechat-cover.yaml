slug: baoyu-wechat-cover
title: 按文章内容画公众号封面
category: 营销
purpose: 贴上公众号文章正文或大纲，它提炼 8 字以内的醒目标题并直接画出 2.35:1 比例的手绘插画风封面图
scenarios:
  - 公众号作者写完推文后不想找无版权图，直接按正文配一张头图
  - 学校社团或机构新媒体小编赶推文排版时快速做一张高对比度封面
  - 独立写作者给系列专栏文章做统一手绘风格的横版题图
summary: 公众号头图在消息列表里缩得很小，图太碎或字太长根本看不清。这条提示词把公众号首图的常见毛病都提前卡死了：固定 2.35:1 横版比例、全手绘插画质感，用橙黄、蓝紫、红黑这类高对比配色保证小尺寸预览也醒目；主视觉居中或偏左，把右侧留白给 8 字以内的主标题（还可按需加 1 行副标题或关键词标签），并搭配 1 到 2 个简洁的卡通形象、图标或知名人物剪影，省去了自己先想画面再四处拼素材的工夫。
usage: 把这段提示词复制后，在末尾「请使用 nano banana pro 根据输入内容生成封面图。」下面直接贴上你的文章全文或核心大纲。注意区别模型类型：它要求直接出图并把中文标题写进画面，普通纯文本对话模型只能帮你写画面描述，画不出图；请直接放到带生图且擅长写中文文字的工具里用（作者推荐在 Gemini 中调用 Nano Banana Pro，也可用即梦等支持中文文字渲染的出图工具，用别的工具时可把末尾的「nano banana pro」删掉）。拿到图后检查画面是否为 2.35:1 横版比例、标题字有没有写错，以及缩小预览时文字和主视觉是否依然清晰醒目。
tags:
  - 公众号封面
  - 配图生成
  - 手绘插画
  - 新媒体运营
lang: zh
body: |-
  公众号封面图生成提示词

  请根据提供的内容创建一张吸引眼球的公众号封面图，遵循以下规范：

  视觉风格
  - 手绘插画风格，比例为 2.35:1（公众号封面标准尺寸）
  - 色彩鲜明、对比强烈，确保在小尺寸预览时依然醒目
  - 风格统一，避免写实元素，保持整体手绘质感

  构图要求
  - 主视觉元素居中或偏左（右侧预留标题区域）
  - 添加 1-2 个简洁的卡通形象、图标或知名人物剪影，增强记忆点
  - 若涉及敏感或版权人物，用风格相似的替代形象，不得拒绝生成
  - 大量留白，突出核心信息，避免画面拥挤

  文字处理
  - 标题文字大而醒目，控制在 8 字以内
  - 可添加 1 行副标题或关键词标签
  - 字体风格与手绘插画协调统一

  吸引力法则
  - 使用悬念、数字、痛点等钩子元素激发点击欲望
  - 视觉元素夸张有反差
  - 色彩搭配参考爆款封面：橙黄、蓝紫、红黑等高对比组合

  语言
  - 除非另有说明，默认使用中文

  请使用 nano banana pro 根据输入内容生成封面图。
