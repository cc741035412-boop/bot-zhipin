slug: khazix-cross-domain
title: 去别的领域借一个能试的解法
category: 创意
purpose: 给它背景和卡点，它去历史与不同领域找相似难题，把可借的做法改成一个小实验。
scenarios:
- 学生社团的器材总被抢订，想换个分配办法
- 杂志编辑想疏通稿件都堵在终审的流程
- 开发者想换个角度处理任务排队
lang: zh
body: |-
  我的困惑是：【说明背景、当前做法、现实约束和具体卡点】。

  请先剥掉行业术语，把它抽象成一个人类在其他领域也可能遇到的问题，并找出：
  1. 问题的底层结构；
  2. 真正的核心矛盾；
  3. 普通解法失效的原因。

  然后从历史案例，以及至少3个彼此距离较远的领域中，寻找底层结构相似的问题。

  每个案例都要说明：
  1. 那个领域遇到了什么问题；
  2. 使用了什么解决机制；
  3. 与我的问题相似在哪里；
  4. 哪些部分可以迁移；
  5. 什么条件下会失效。

  最后请选出最值得借用的3种机制，把它们翻译成适合我当前处境的解决方案，再推荐一个最值得先试的低成本、可逆实验。
summary: 它先把行话拿掉，说清到底是什么卡着什么、平常的办法为什么不管用，再从历史案例和至少三个相距较远的领域找参照。判断标准不是故事听起来像不像，而是对方的办法靠什么起效，换到你这里会不会失效。最后从三种可借的机制里推荐一个成本低、能撤回的试验。
usage: 把【说明背景、当前做法、现实约束和具体卡点】换成你遇到的情况，写清试过什么、具体卡在哪一步，整段发给对话 AI。选做法前核实案例，尤其要对照它列出的失效条件；先试可撤回的那一步，不必整套照搬。
