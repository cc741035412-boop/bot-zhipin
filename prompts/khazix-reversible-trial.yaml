slug: khazix-reversible-trial
title: 拿不定主意时先小范围试试
category: 产品
purpose: 说出你犹豫的选择，它帮你设计一个花钱少、随时能停的小试验
scenarios:
- 改用错题卡复习前，先拿一章试几天
- 读书会想改成轮流领读，先试一场再问大家要不要继续
lang: zh
body: |-
  我正在纠结的是：【填写你的选择或想法】。

  请先找出这个决定背后最需要验证的3个假设，再选出最可能改变最终结论的那一个。

  围绕这个假设，帮我设计一个低成本、可逆、能在【7天或你能接受的周期】内完成的最小实验。

  请写清：
  1. 具体要做什么；
  2. 需要投入多少时间和资源；
  3. 观察什么指标；
  4. 什么结果支持继续；
  5. 什么结果提醒我停止；
  6. 实验结束后能获得什么新信息。

  最后告诉我，明天就能开始的第一个动作是什么。
summary: 拿不准要不要做客服摘要，不一定得先排开发。它先挑出最值得花力气验证的那件事，再围绕它安排短期试做，让你事先知道要看哪种反馈，以及何时该停。
usage: 第一处【】填你纠结的选择或想法，第二处【】填 7 天或你能接受的试做周期，再补上能用的人手、时间和预算。读方案时先看它从三个假设里选的那一个：如果猜错了，你会改主意吗？开试前定好观察指标和继续、停止的条件，确认中途能退回、第一步明天就能做。到期按记录决定，不凭印象加码。
