slug: khazix-ask-first-oneliner
title: 让 AI 动手前一次问你一件事
category: 效率
purpose: 把这句话接在任务后，它先停下来追问，每次只问一件没弄清的事。
scenarios:
- 学生做课堂展示前梳理作业要求
- 写作者约稿时说清读者和篇幅
- 开发者写功能前确认使用场景
lang: zh
body: |-
  请你先不要开始干活，用苏格拉底提问法向我提问，一次只问一个问题，直到你认为已经完全理解这件事。
summary: 你已经知道要做什么，却未必想到该交代哪些细节。这句话让 AI 暂缓执行，用苏格拉底式提问接着你的回答往下问，而不是一次扔来整份问卷。这样，它对任务的误解有机会在动笔或写代码之前露出来。
usage: 没有占位符。在支持多轮对话的 AI 里先写任务，把这句话接在末尾，一起发送。每次只答眼前这一问；等它认为已经理解，请它先用自己的话复述要交什么、哪些限制不能改。你核对无误后，再让它动手。
