slug: khazix-dr-novel
title: 先查时代细节，再写架空奇幻小说
category: 写作
purpose: 给它时代背景、奇幻元素和主角设想，它先查资料搭大纲，再根据报告写小说。
scenarios:
- 小说作者给炼金术学徒设计入行经历
- 写作社成员用真实的行会制度构思冲突
- 奇幻爱好者把一份世界观大纲写成故事
lang: zh
body: |-
  我正在构思一部架空历史奇幻小说，背景类似于15-16世纪的欧洲文艺复兴时期，但我想加入一点炼金术与魔法元素。请你使用Deep Research，帮我完成以下任务：
  1.文化与时代设定：
  - 查找文艺复兴时期的主要文化特征、社会结构（贵族与平民的地位对比、城市行会制度）、日常生活形态（服装、饮食、礼仪等）。
  - 我想加入“炼金术”的超自然设定，请检索真实历史上与炼金术相关的典籍或人物（例如帕拉塞尔苏斯），看看他们在实际历史中扮演了什么角色。
  - 同时查找这段时期在欧洲发生的重要事件（如主要战乱、王朝更替）和科技进步（如火枪、印刷术的发展），列出我可参考的关键年份或里程碑。

  2.魔法体系灵感：
  - 搜集民间传说或神秘学文献，看看可以融入的魔法或巫术素材（例如关于魔法阵、符文的说法）。
  - 调研当时宗教（如天主教、异端审判）对“超自然现象”的态度，帮助我合理描写魔法师与教会的冲突。
  - 如果有类似的奇幻小说或影视作品参考（如《女巫猎人》《魔法门》系列的世界观），简要介绍它们怎样处理“中世纪+魔法”的设定。

  3.角色与情节建议：
  - 我希望主角是一个刚入行的年轻炼金术学徒，请检索有没有相关的历史人物或传说能提供灵感，如真实存在的学徒制训练流程或著名炼金术师的轶事。
  - 基于以上信息，建议一个大致故事主线：包括主角如何在宫廷或贵族赞助下研究炼金术，如何面对教会或他国敌对势力等。可以帮助我梳理出5-8个关键情节点。
  - 提供一些可能的情感冲突（如贵族小姐爱上炼金术学徒、教会内部的暗流斗争、不同国家联姻或战争等），并举出真实历史中类似的宫廷事件做参考。

  4.注意事项：
  - 引用所使用的主要历史或奇幻来源；如果有特定年份或人物，请标注出处方便我交叉验证。
  - 有关魔法或炼金术的内容，如果没有足够史实支撑，也请标记“推测内容”，以便我后续进行改编处理。

  输出格式：
  -先给我一份浓缩版的世界观背景摘要（包含我可以直接用的关键设定）。
  -之后详细列出文艺复兴历史元素与奇幻魔法元素的参考资料或灵感来源，并根据我的需求提供章节/情节大纲。
  -最后附上可能的结局走向或伏笔提示。

  根据上面的报告信息，帮我写出这篇3w字的短篇小说，就参考钢之炼金术师的风格吧，可以再融入一点点克苏鲁的那种不可名状的恐惧，作为故事的暗线。
summary: 一个炼金术学徒靠谁教手艺，又靠谁出钱做研究？第一步从这类写故事会碰到的问题入手，查行会、宫廷、宗教和日常生活，为人物与年份注明出处，把缺少史实支撑的设定标作推测。报告把这些材料连成五到八个情节点，给出结局或伏笔；第二步才据此写正文。
usage: 分两次发。先开启深度研究功能，贴从开头到伏笔提示的第一部分。可把文艺复兴欧洲、炼金术、学徒身份及宫廷或教会冲突换成自己的设定，关联人物和参考作品也一起改。等报告出来，核对年份、人物出处及推测标记，再在同一对话发最后一段。三万字篇幅、《钢之炼金术师》风格和克苏鲁式恐惧暗线都可替换；读成稿时对照大纲查情节是否接得上。
