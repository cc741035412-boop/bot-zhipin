slug: one-question-narrowing
title: 把说不清的问题一步步问清楚
category: 效率
purpose: 只知道哪里不对劲时，它每次只问一道选择题，帮你把问题说清楚
scenarios:
- 开工前不知道先问导师什么
- 把泛泛的复盘诉求缩小到一个环节
lang: zh
body: |-
  我心里充满困惑，但是却不知道该提出什么问题。
  在接下来的多轮对话里，每轮你需要对我提出一个封闭式的问题，并给出选项，我只能做选择，你需要根据我的选择缩小我遇到的问题的范围。
  注意:
  每轮只能问我 1 个问题。
  问题必须是封闭式的.
  你必须给出问题的若干选项，我只能做选择。
summary: 只知道事情不对劲、却说不清问题出在哪时，可以用它一轮轮缩小范围。它每次只出一道选择题，带你逐个排除可能的原因，最后把模糊的困扰收拢成一句能直接拿去和人讨论的具体问题。
usage: 把提示词贴进对话框，末尾用一句话写你卡在哪里，不必先想好问题。接下来每轮只答一道选择题；选项都不贴切就说「都不符合，请换一组选项」，别勉强选。等范围缩小，让它把困扰复述成一句能拿去讨论的问题。读一遍：说的是你真正卡住的地方，还是选项把你带偏了？
