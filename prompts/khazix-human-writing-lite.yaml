slug: khazix-human-writing-lite
title: 让 AI 拿具体材料写，少说套话
category: 写作
purpose: 把五条规则接在写作需求后面，它会按你给的材料落笔，写清谁做了什么，删掉空话。
scenarios:
- 学生用亲身经历写实习小结
- 作者把采访原话写进人物稿
- 开发者把项目复盘里的黑话改成具体动作
lang: zh
body: |-
  你写这篇稿子时，遵守下面五条规则。它们的优先级高于你的默认写作习惯。

  一、先清点材料再动笔。把用户给的经历、数字、原话逐条列在心里，写长文至少要五件具体材料。材料不够就先问用户要，或者查证公开资料，都不行就把文章写短。抽象道理换四种说法不算材料，凭空想象的「比如有个人」不算材料。文章的每一段都要能指出它靠哪件材料站住。

  二、判断从正面下，禁止翻案腔。翻案腔指先立一个读者并没有的误解，再推翻它抬价，包括「不是A，而是B」「不在于A，而在于B」「你以为A，其实B」「表面上A，实际上B」「与其说A，不如说B」「A不重要，重要的是B」以及一切同类变形。想下判断就直接说出判断，把依据放在旁边。同理禁止三项以上的整齐排比，禁止给抽象名词配具体动词的抒情（时间不会保管细节，焦虑不会显出形状）。开头不拿「在当今……时代」铺垫，结尾不升华到时代、文明和所有人，也不喊「让我们……吧」。

  三、句子先交出主干。先说谁做了什么，再补时间、原因和条件。一句话里堆四个「的」就重写。「进行了优化」写成「改顺了」，「实现了增长」写成「多挣了多少」。删掉一半连词，中文小句靠语序自己会接。

  四、长短句要有高低差。十个字的句子要能挨着四十个字的句子，普通的地方用普通句子结束，不要每段都用一句短判断收尾。动作和原话已经把情绪写出来，就停住，不要追一句解释；写小说时，动作看不出来的心理照样要写。该重复的词就重复，不要换着花样找同义词。

  五、成稿不用破折号，冒号只用来引出人物原话，不用「说白了」「值得注意的是」「先说结论」，不用赋能、抓手、闭环、底层逻辑这类黑话。

  两段对照，感受方向。

  这样写不行。「真正让他下定决心的，不是那次失败本身，而是他终于看清了一个残酷的真相：留在原地，才是最大的风险。」

  这样写可以。「他折腾了几年，一直没挣到稳定的钱。后来老同事找过来，问他愿不愿意一起做项目，他才换了方向。收入会不会稳定，当时没人知道。」

  写完后自查一遍。哪一段像模型在完成写作任务就改掉，哪句话说得比材料大就删掉，文章在哪一句已经结束就在哪一句停。
summary: 这五条规则先管文章拿什么来写：长文至少要有五件具体材料，不够就追问、查证或写短。落到句子上，先写谁做了什么，直接说判断和依据。动作或原话已经传达了情绪，就停在那里。把成稿和手里的材料对一遍，比单挑几个像 AI 的词更容易找出空话。
usage: 在能写中文的对话 AI 里先写你的写作需求，附上经历、数字、原话或待改稿，再把整套规则紧跟在需求后面贴好，一起发送。不用填占位符；两段对照是写法示范，不要把里面的经历当成自己的素材。读成稿时逐段找依据：原话有没有改，事实有没有多出来，最后一句删掉是不是反而更好。
