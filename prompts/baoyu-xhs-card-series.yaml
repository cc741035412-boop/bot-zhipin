slug: baoyu-xhs-card-series
title: 把内容拆成一组小红书图文
category: 营销
purpose: 贴一篇干货文章或笔记草稿，它按复杂度拆成 1 到 10 张小红书竖版卡片，逐张给出排版文案和手绘风画图提示词
scenarios:
  - 自媒体作者把写好的公众号长文拆成一套小红书滑动图卡
  - 学生或考公党把复习笔记整理成几张清爽的手绘风知识卡片
  - 小店店主把产品选购指南或使用教程做成多张图文笔记
summary: 把长文章发到小红书，最费神的是怎么分页、每页留几个字、画面怎么配。这条提示词会先按内容复杂度决定拆成 2 到 3 张、4 到 6 张还是 7 到 10 张，按封面图、中间的一页一观点内容图、结尾总结图排好节奏；再统一用莫兰迪或奶油色系背景、3:4 竖版手绘卡通风格，为每一张分别输出主副标题文案和可直接喂给出图工具的视觉提示词，让整套卡片翻起来既有重点又保持同一套画风。
usage: 用前必改一处：在提示词后半段「视觉提示词」代码块末尾，写死了「右下角水印：“宝玉”」，请先把它改成你自己的账号名，或者直接删掉这一行；然后在最末尾贴上你要拆解的文章或要点。第一步拆卡和写提示词用 ChatGPT、Claude、豆包、Kimi 等普通文本对话模型就能完成；第二步真要把卡片画出来，需把每张生成的「视觉提示词」复制到支持中文手绘排版的生图工具（如 Gemini 的 Nano Banana 系列、即梦等）里逐张出图。出图后逐张检查图上中文有无错字或漏字。
