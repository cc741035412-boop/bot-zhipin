slug: khazix-expert-panel
title: 用三种专业视角会诊一个难题
category: 分析
purpose: 给它问题、目标和限制，它让三种互补的专业视角互相质疑，再给出有条件的建议。
scenarios:
- 社团筹办校外活动，要兼顾预算、体验和安全
- 开发者决定要不要重写一个难维护的模块
- 编辑在截稿前决定是否重做专题
lang: zh
body: |-
  我的问题是：【填写问题、已知事实、目标和现实约束】。

  先不要直接给方案。请为这个问题选择3种真正互补的专业视角，并说明每种视角为什么必要。

  让每种视角分别回答：
  1. 它怎样重新定义这个问题；
  2. 它最推荐的解决路径；
  3. 其他视角最容易忽略的风险；
  4. 什么新证据会让它改变判断。

  然后让三种视角互相质疑，找出：
  1. 共同认可的事实；
  2. 真正的分歧；
  3. 分歧背后的不同假设。

  最后请综合输出：
  1. 综合后最推荐的方案；
  2. 适用条件；
  3. 最大风险；
  4. 退出条件；
  5. 第一步行动。

  不要选择三个高度相似的身份，也不要模仿或编造真实人物的观点。信息不足时，先只问我一个最关键的问题。
summary: 这不是找三个身份给方案投票。每种视角都要说明自己怎么看问题、别人可能漏了什么风险，以及什么证据会让自己改主意。把分歧追到各自依赖的假设之后，AI 才综合出建议，说清适用条件、最大风险、什么时候该放弃，以及第一步做什么。
usage: 把【填写问题、已知事实、目标和现实约束】换成你要解决的事、已掌握的情况、想达到的结果和不能突破的限制，整段发给对话 AI。信息不够时先答它的关键一问。读建议时，核对三方是否真有分歧，推荐方案所依赖的条件在你这里是否成立。
