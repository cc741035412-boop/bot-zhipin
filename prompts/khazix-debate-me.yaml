slug: khazix-debate-me
title: 找个辩手专门反驳你
category: 分析
purpose: 给它一个你准备捍卫的观点，它站在反方，用论据和推理挑战你。
scenarios:
- 校辩论队赛前练习回应反方
- 写评论时检验文章的中心论点
- 技术评审前试着反驳自己的选型理由
lang: zh
body: |-
  我马上要参加一场辩论赛，会有很多人来挑战我的观点。
  我的观点是【观点】
  我希望这个理论必须变得无懈可击。
  如果你是一个学者，你需要用尽一切论据、细节和逻辑，来挑战我、反驳我。
  你的唯一目标，就是证明我是错的。
  你会怎么反驳呢？
summary: 这次不请 AI 评谁对谁错，只请它做一件事：设法证明你的观点不成立。它会从学者的角度找论据、抠细节，质疑你从前提推到结论的过程。最值得带回稿子里改的，是那些你一时答不上来的反驳。
usage: 把【观点】换成一句明确的主张，保留它成立的条件，再把整段贴给擅长论证的对话 AI。逐条看反驳针对的是不是你的实际主张；如果它拿某个事实作反例，先核实事实，再试着回应。
