slug: khazix-song-style
title: 给音乐模型写一段曲风说明
category: 创意
purpose: 给它你想听的声音，它把流派、节奏、配器和人声写成音乐模型能用的一段提示词。
scenarios:
- 写词的人想听同一首歌换个编曲
- 学生给社团短片试不同配乐
- 音乐爱好者比较男女声演唱的效果
lang: zh
body: |-
  请用 300 字以内、中文、分号分隔的格式，输出可直接喂给 AI 音乐模型的提示词。结构固定：
  1) **风格关键词**（2-3 个流派+2-3 个情绪词）；
  2) **BPM & 调式 & 节拍**（如“105BPM, A minor”，“4/4或3/8拍”）；
  3) **核心配乐**（主/副乐器 + 质感形容词）；
  4） **演唱风格**（按演唱风格划分：流行，摇滚，美声，说唱，戏曲等）；
  5） **性别**（男声、女声）；
summary: 一句轻快还说不清歌该怎么唱。它用两三个流派词和两三个情绪词定方向，再写每分钟多少拍、用什么调和拍子、哪件乐器领奏，最后交代唱法和男女声。五项用分号隔开，想单独换一种乐器时，不用把整首歌重新描述一遍。
usage: 把模板贴给文本 AI，在后面补上想要的听感或已有偏好。105BPM、A minor、4/4 或 3/8 拍只是示例，可换也可让 AI 选；主副乐器、质感、唱法和男女声同理。检查输出是否是分号隔开的五项中文描述，再贴进音乐模型的风格栏。给 Mureka 用时保留 300 字上限，换别的模型可去掉这个限制。
