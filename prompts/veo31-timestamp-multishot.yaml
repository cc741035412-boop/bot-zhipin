slug: veo31-timestamp-multishot
title: 时间戳多镜头分镜短片
category: 视频
purpose: 按两秒一段的时间戳分行动笔，依次交代四个镜头的机位、动作及音效或情绪，一次生成多镜头短片。
scenarios:
- 自媒体创作者用一段提示词生成带正反打切换的剧情片头
- 学生拍短片前用四段分镜测试背后中景、反打、跟拍到摇臂广角的衔接
- 小店店主按两秒一镜编排商品出场、特写反应和全景收尾的短片
summary: 想在一条 8 秒视频里完成多次切镜，只写一段笼统剧情很容易变成一镜到底。这条提示词用 `[00:00-00:02]` 到 `[00:06-00:08]` 四个时间戳，把 8 秒拆成四个各 2 秒的连续镜头：第一镜用背后中景拍女探险家拨开丛林藤蔓；第二镜切反打拍她看到遗迹时的脸部表情，并用「音效：」加上树叶沙沙声与远处鸟鸣；第三镜用跟拍写她走进空地抚摸石墙雕花，并用「情绪：」点明惊叹与敬畏；第四镜切广角高角度摇臂镜头，展现孤零零一个探险家站在半被丛林吞没的神庙建筑群中央，再用「音效：」配上渐强的管弦乐。
usage: 保留每行 `[00:00-00:02]`、`[00:02-00:04]`、`[00:04-00:06]`、`[00:06-00:08]` 时间戳，把女探险家、丛林藤蔓和古老神庙建筑群换成你的主角与场景，按「景别机位+人物动作」改写四镜画面，替换第 2、4 段「音效：」后的环境音或配乐和第 3 段「情绪：」后的神态词。无需上传参考图。若账户有权限，可在提供 Veo 3.1 的 Google Cloud 视频生成工具中使用（不保证所有账户都有），画幅可选 16:9 或 9:16，示例总长 8 秒（4 个 2 秒镜头）。出片后检查四镜是否按时切镜、主角衣着外貌是否连贯、音效配乐是否按时响起。
tags:
- 多镜头
- 时间戳分镜
- 镜头切换
- 音效控制
models:
- Veo 3.1
lang: en
body: |-
  [00:00-00:02] Medium shot from behind a young female explorer with a leather satchel and messy brown hair in a ponytail, as she pushes aside a large jungle vine to reveal a hidden path.
  [00:02-00:04] Reverse shot of the explorer's freckled face, her expression filled with awe as she gazes upon ancient, moss-covered ruins in the background. SFX: The rustle of dense leaves, distant exotic bird calls.
  [00:04-00:06] Tracking shot following the explorer as she steps into the clearing and runs her hand over the intricate carvings on a crumbling stone wall. Emotion: Wonder and reverence.
  [00:06-00:08] Wide, high-angle crane shot, revealing the lone explorer standing small in the center of the vast, forgotten temple complex, half-swallowed by the jungle. SFX: A swelling, gentle orchestral score begins to play.
bodyZh: |
  [00:00-00:02] 从背后拍的中景镜头：年轻女探险家背着皮质挎包，凌乱的棕色头发扎成马尾，她拨开粗大的丛林藤蔓，露出一条隐秘小径。
  [00:02-00:04] 反打镜头拍向探险家带雀斑的脸，她凝视着背景中长满青苔的古老遗迹，神情充满敬畏。音效：茂密树叶的沙沙声，远处奇异的鸟鸣声。
  [00:04-00:06] 跟拍镜头跟随探险家踏入空地，她用手抚过残破石墙上繁复的雕花。情绪：惊叹与敬畏。
  [00:06-00:08] 广角高角度摇臂镜头，展现孤零零一个探险家渺小地站在庞大而被遗忘的神庙建筑群中央，整片建筑群半被丛林吞没。音效：渐强而轻柔的管弦乐配乐开始响起。
