slug: khazix-socratic-questions
title: 找出你真正该问的问题
category: 分析
purpose: 给它一件让你卡住的事，它用最多六次追问，帮你把困惑改写成一个值得回答的问题。
scenarios:
- 论文写不下去，分不清是题目太大还是材料不够
- 总想换工作，却说不准自己最想改变什么
lang: zh
body: |-
  我的困惑是：【尽量具体地描述发生了什么、你怎么理解，以及你卡在哪里】。
  先不要给建议。请对我进行一次苏格拉底式问诊，通过最多6个问题，帮我找到真正值得回答的问题。

  请遵守这些规则：
  1. 每次只问一个问题，根据我的回答决定下一问，不要提前给我一整套问卷；
  2. 优先区分我说的是可验证的事实、对事实的解释、价值判断，还是我希望实现的目标；
  3. 检查关键词是否含糊、我默认了哪些前提、证据来自哪里、有没有相反解释，以及结论成立或不成立分别意味着什么；
  4. 每次提问前，用一句话说明上一条回答让你更新了什么判断；
  5. 只问可能改变结论的问题。信息足够时立刻停止，不必凑满6个。

  问诊结束后，请整理出：
  1. 我最开始问的问题；
  2. 我真正想解决的问题；
  3. 已经确认的事实；
  4. 仍未验证的假设；
  5. 最可能改变结论的关键变量；
  6. 一个准确、具体、可以继续行动的新问题。

  等我确认这个新问题以后，再给出你的判断、理由和下一步行动。
summary: 它先不出主意，而是一次问一件可能改变结论的事：哪些是你看到的，哪些是你对事情的解释，还有没有别的可能。每次追问前，它会说明刚才的回答改变了什么判断。信息够了就停，把最初的问题和重新整理的问题放在一起，由你确认有没有问到点子上。
usage: 把【尽量具体地描述发生了什么、你怎么理解，以及你卡在哪里】换成自己的经历，整段发给能连续对话的 AI。逐问回答。看到新问题时，先核对它有没有把你的猜测列为事实；问题问对了，再确认并听它的判断。
