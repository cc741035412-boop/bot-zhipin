slug: ljg-classical-chinese
title: 把文言文译成白话并讲透
category: 学习
purpose: 给它一段文言文，它输出流畅白话译文、1到3个重点字词的本义与引申义考辨，以及历史文化背景解读
scenarios:
  - 中学生或大学生读古文课文、史书选段时，弄清一词多义和典故背景
  - 成年人自学《易经》《庄子》等经典，看去掉脑补水分、标清补足语的白话译文
  - 写作者或历史爱好者查某句古文的字源本义和当时的言外之意
summary: 读古文要么被逐字死译噎住，要么看网上的白话译文被译者私自塞进一堆脑补情节。这是作者李继刚读《易经》时自用的提示词，固定分三层输出：【核心译文】优先用贴合语境的经典引申义翻出通顺白话，凡是为帮读者理解而补上的过渡词句，硬性规定用 [方括号] 标出；【重点词解】挑 1-3 个核心字词追溯字源本义和词义流变；【背景解读】再把背后的历史典故、名物制度或哲学意图讲透。
usage: 在末尾冒号后面贴上文言文段落；如果出自《易经》《左传》等先秦典籍或冷门篇目，最好顺手写明篇名或上下文，免得模型认错语境。通用对话模型都能用。拿到结果后，先看【核心译文】里带 [方括号] 的部分是不是真有必要，再拿【重点词解】里的字源本义对照古汉语常用字字典核实一下，防止模型在冷僻字上编造甲骨文或金文拆字。
