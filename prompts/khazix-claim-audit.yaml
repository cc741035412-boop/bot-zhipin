slug: khazix-claim-audit
title: 查一个说法靠不靠谱
category: 分析
purpose: 给一段说法，它查来源、分清事实和观点，判断能信几分
scenarios:
- 写文章或报告引用网传数据前核查原始统计口径
- 读热点文章或科普帖时拆开事实、推论与价值判断
- 复核立项材料里的行业判断
lang: zh
body: |-
  我要核查的说法是：【粘贴观点、结论、数据或方案】。

  请先把它拆成：
  1. 可以被外部验证的事实；
  2. 从事实推出的结论；
  3. 其中包含的价值判断。

  对于事实部分，请联网核查来源、样本、时间和完整上下文，并标记为：
  1. 已证实；
  2. 基本成立，但需要收窄；
  3. 存在争议；
  4. 证据不足；
  5. 明显错误。

  在假设相关事实成立的情况下，继续检查：
  1. 这些事实能否推出当前结论；
  2. 是否藏着未经验证的假设；
  3. 是否混淆相关性和因果关系；
  4. 是否遗漏了其他解释或关键信息；
  5. 结论在什么条件下成立或失效。

  最后请输出：
  1. 哪些事实可信，哪些需要修正；
  2. 推理链中最关键的漏洞；
  3. 补强后的最合理版本；
  4. 我目前可以相信到什么程度。
summary: 有人说某工具把工时减半，先看测的是哪道工序、样本里都有谁。它先把一段说法拆成能查证的事实、由此推出的结论和夹带的价值判断，事实部分联网查来源、样本和时间，分成从已证实到明显错误五档；再看这些事实撑不撑得起结论，有没有把相关当成因果。最后给出修正后的说法，并告诉你能信到几分。别人的观点和方案也能这样过一遍。
usage: 把【粘贴观点、结论、数据或方案】换成待查的完整说法，附上出处链接和前后文；如果是图表，带上脚注。用能联网检索的 AI 发送。读结果时先点开一手来源，核对样本、时间和统计口径，再看即便数字没错，能不能推出那句话。找不到原始统计，就别把几篇互相转述的报道当成证实。
