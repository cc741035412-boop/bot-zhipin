slug: khazix-two-sided-decision
title: 做决定前把两个选项都想透
category: 分析
purpose: 给两个选项，它替双方各讲最有力的理由，找出真正决定取舍的那一点
scenarios:
- 在自研与采购之间做选择
- 合唱团商量排练放在周末还是工作日晚上
lang: zh
body: |-
  我需要做的决定是：【写清问题、两个选项、目标和现实约束】。

  先别急着回答，也别默认我已经把问题想清楚。请先做一次双向钢人论证：

  1. 用最完整、有力的方式，重述我真正需要做出的选择；
  2. 分别给出支持两个方向的最强理由、适用条件、最大收益、最大风险，以及最难回答的反对意见；
  3. 找出双方真正的分歧、最可能改变结论的关键变量，以及还需要补充的信息；
  4. 只问我一个最可能改变结论的问题。

  等我回答以后，再给出明确判断、理由、适用条件和下一步行动。
summary: 当团队已经偏向自研，随手列的采购优缺点往往只是在陪跑。这条会替两边分别说出真正站得住的理由，找到争议取决于哪条信息，等你补过这一点才给建议。
usage: 在开头的【】里写清要决定什么、两个选项、你想达到的目标，以及预算、最晚期限等硬约束。发出后先看 AI 有没有替两边都讲出最强理由，而不是替你偏爱的那边说话。等它只问一个关键问题，再按实际情况回答，不知道就说明。最后核对建议依赖的条件是否成立，下一步是否超出预算或期限。
