slug: khazix-year-in-chats
title: 从一年的聊天记录里回看自己
category: 分析
purpose: 给它这一年你和 AI 的聊天记录，它用五千字分析这些对话里呈现出的你。
scenarios:
- 学生在年末回看自己一直在问什么
- 写作者从全年对话里重看自己的兴趣
- 上班族写年终总结前回顾反复纠结的问题
lang: zh
body: |-
  这是我跟AI，所有的聊天记录。年底了，大家都在给自己这一年，写一份总结。我也想做一下这个总结。请你用5000字篇幅，帮我分析，我到底是一个什么样的人？
summary: 平常留在对话框里的一次求助、一个追问，年底都能拿来当回忆的线索。这三句话让 AI 读你一年的聊天记录，围绕你是个什么样的人写一篇长分析。读到特别像或特别不像自己的地方，可以翻回当时的对话，看看它为什么会这样理解你。
usage: 先导出这一年的 AI 聊天记录，删去不想分享的隐私，再把文件附到能读附件、容纳长文本的 AI 对话里，随后贴入提示词。只上传了一部分，就把开头的范围改准确；5000 字可按需调整。选几处对你的判断，请它指出对应对话，核对发言人和上下文。聊天里的你只是生活的一部分。
