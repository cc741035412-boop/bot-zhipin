slug: khazix-dr-product-compare
title: 比较两款产品，推荐更适合你的那款
category: 分析
purpose: 给它两款候选产品和你在意的条件，它对照参数、实测与用户评价，说明哪款更合适。
scenarios:
- 常出差的人比较两台笔记本的重量和续航
- 学生在两款电脑之间权衡性能和售后
lang: zh
body: |-
  帮我比较两款产品：
  我在考虑购买 <某某款轻薄商务笔记本A>和 <某某款轻薄商务笔记本B>。
  需求：
  - 我经常出差，需要 <电池续航长>、 <>重量轻>的笔记本，也关注 <性能和售后服务>。
  请从规格参数、电池续航测试、用户评价等方面比较A和B，列出各自的优缺点，并根据我的需求给出推荐。
summary: 电脑每天要背着走，轻多少、离开插座能用多久，就比单看配置表更有分量。它把两款产品的规格、续航测试和使用评价放到一起，分别列出得失，再按你的使用场景给推荐。即使没选参数更高的那款，你也知道自己换来了什么。
usage: 开深度研究功能，贴入提示词，把 <某某款轻薄商务笔记本A> 和 <某某款轻薄商务笔记本B> 换成完整型号及配置。把出差改成你的使用场景；<电池续航长>、<>重量轻>、<性能和售后服务> 都是可替换的需求，直接写最在意什么。核对实测用的是不是同一配置，两款的测试条件能不能比，再看推荐有没有照顾你的首要需求。
