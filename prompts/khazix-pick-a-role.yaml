slug: khazix-pick-a-role
title: 先选对专家视角，再谈具体问题
category: 分析
purpose: 给它领域和问题类型，它先挑一位擅长这个细分问题的专家，解释理由，再请你展开。
scenarios:
- 读史遇到制度问题，不确定该从哪门专长切入
- 写悬疑故事想讨论线索安排，不想只听泛泛的写作建议
- 开发者想讨论编程语言设计，先缩小讨论范围
lang: zh
body: |-
  我想探讨【领域】里的【问题类型/场景】。
  先别回答。
  请你先选一位最适合的领域顶尖名人专家来思考它。
  可以是活人或历史人物，名字可以小众，但必须在该细分领域很专业。
  如果你不确定该选谁，可以先反问我2个定位问题再选。

  先输出
  1.你选谁，他对应的细分领域
  2.为啥选他，三句话
  然后再让我描述详细的问题。
summary: 第一轮只做选人这一件事。AI 可以选在世或历史人物，名气大小不重要，专长要对得上你的问题。拿不准时，它可以先问两个定位问题，再交代选了谁、此人研究哪一小块、为什么合适。你可以先判断角度对不对，再花时间讲细节。
usage: 把【领域】换成讨论范围，把【问题类型/场景】换成你关心的那类事，先把填好的模板贴给对话 AI。看完人选、细分领域和三句话理由，核对这人的专长是否相符，再发详细问题。后续回答是模型借这个视角做的分析，不是专家本人的发言。
