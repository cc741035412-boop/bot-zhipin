slug: khazix-reverse-case
title: 从好作品里学做法
category: 产品
purpose: 给一个做得好的产品或页面，它拆出你能借鉴的做法和不能照搬的地方
scenarios:
- 改版前拆解同行的注册页
- 从别人的数据看板学布局
lang: zh
body: |-
  我想拆解的优秀范例是：【粘贴产品页面、网页、方案、流程说明、数据看板或其他成品】。
  我想学会的是：【填写你希望从中学会什么】。

  请先用一句话说明它解决了什么问题，再反向拆解它为什么有效。

  重点分析：
  1. 它服务谁，目标是什么；
  2. 它采用了什么结构或流程；
  3. 哪些关键选择拉开了质量差距；
  4. 它的完成标准是什么；
  5. 哪些规律可以迁移，哪些细节只适合这个案例。

  最后请给我：
  1. 提炼3到5条可复用规律；
  2. 一份可以照着执行的操作清单；
  3. 一个最值得先尝试的小练习。
summary: 看到一页不错的新手引导，先别急着照搬按钮。它会沿着用户要办的事倒推页面为什么这样安排，把可以借的做法和只在对方产品里管用的细节分开，最后留一个小练习。
usage: 第一处【】贴你想拆解的成品，如页面正文或流程说明；用截图就写「见附图」，随消息上传，并选能看图的 AI。第二处【】写具体想学什么，比如「它怎样让第一次来的用户走完注册」。拿到清单后，把每条规律对回成品里的具体步骤，分清哪些做法依赖对方的条件，再挑一个小练习试在自己的作品上。
