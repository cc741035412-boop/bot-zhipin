slug: khazix-dr-sentiment
title: 看一次事件里用户在夸什么、怨什么
category: 分析
purpose: 给它事件、产品和团队名称，它整理社交平台上的好评与吐槽，附上评论出处和改进建议。
scenarios:
- 开发者复盘新版上线后收到的吐槽
- 学生给传播课案例挑选不同立场的评论
- 编辑查一场产品争议到底在争什么
lang: zh
body: |-
  帮我详细分析<某某事件>的用户舆论：
  - 汇总社交媒体上用户对<某某产品>的主要正面评价（喜欢的点）和负面吐槽（不满之处）。
  - 统计正负评价的大致占比，分析用户整体满意度倾向。
  - 引用几条具有代表性的用户评论（注明出处，如微博或论坛）。
  - 根据反馈给出对<某某公司或团队>营销或产品改进的建议。
summary: 热评里吵得最凶的事，未必是大家最常提的事。它分别整理用户喜欢和不满的地方，估算正负评价各占多少，再用带出处的评论说明每一类意见具体指什么。读建议时，可以回头看用户究竟抱怨了什么，再决定改产品还是改宣传。
usage: 在 AI 的深度研究功能里贴入提示词：<某某事件> 换成具体事件，<某某产品> 填被讨论的产品，<某某公司或团队> 填要接收建议的一方。微博、论坛可换成你关心的平台，也可补上日期范围。逐条点回出处核对原话；先看占比是按哪些评论算的，不把抽到的评论当成全体用户。
