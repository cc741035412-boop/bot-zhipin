slug: khazix-travel-postcard
title: 旅行手账风水彩明信片
category: 出图
purpose: 给它一张风景或景点照片，它转绘成左文右画、带手绘色块和留白横线的复古水彩明信片。
scenarios:
- 旅行回来把手机拍的景点照做成明信片发社交平台
- 学生把校园建筑照片转成水彩纪念卡打印送同学
- 民宿或小店把门店外观照做成手账风欢迎卡
summary: 它先把照片转绘成带自然晕染、纸张颗粒和不规则笔触边缘的水彩插画，再把明信片版式写得很细：暖米白纸面采用横版布局，右侧约 60% 放四周留白的水彩画，左侧排上小编号、复古衬线体英文短标题、LOCATION 与 DATE 标签及空白横线，底部附上三枚从照片里提取的手绘色块。最后点明“只输出明信片设计平面图，去除原图水印与界面元素”，要求画面只呈现明信片本身的平面版式，不带入原图的水印或截图界面。
usage: 需先上传 1 张景点或建筑照片。没有需要替换的占位符，直接复制就能用；若想指定左侧的英文标题或填入地点、日期，可在发送时另补一句。提示词已写明采用横版布局，推荐选 3:2 横版比例（如 1080×720），在 ChatGPT 的“创建图像”功能（GPT-Image 2.5）中使用。出图后检查画面是不是明信片平面图、右侧水彩画四周有没有留白、左侧 LOCATION 与 DATE 标签拼写是否正确，以及原图的水印或界面元素是否已去掉。
tags:
- 旅行明信片
- 水彩插画
- 照片转绘
- 复古手账
models:
- GPT-Image 2.5
lang: zh
body: |-
  将照片设计成复古旅行手账风明信片：保留原图主体与视角，转绘为清透的水彩插画，带自然晕染、纸张颗粒和不规则笔触边缘，柔和融入暖米白纸面。采用横版布局，右侧约60%区域放插画，插画略微收小，四周留出更宽的纸面，上下边缘保持呼吸感，笔触不要延伸至画布边缘。左侧疏朗排版：小编号、简短英文主题标题、LOCATION与DATE标签及空白横线，底部放三枚从照片提取的手绘色块。标题用复古衬线字体，整体清新、舒展、有旅行收藏感。只输出明信片设计平面图，去除原图水印与界面元素。
