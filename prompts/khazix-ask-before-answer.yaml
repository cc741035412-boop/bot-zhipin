slug: khazix-ask-before-answer
title: 出方案前，让 AI 一次问清一件事
category: 效率
purpose: 给它一个还没说完整的需求，它根据你的回答逐次追问，弄清目标后才给方案。
scenarios:
- 备考想排复习计划，但还没说每天有多少空闲
- 约人写稿前，要理清读者是谁、稿子给谁用
- 请助手安排出差行程，还有几项时间限制没交代
lang: zh
body: |-
  【你的问题/需求】
  请你在回答前，先问我问题。
  要求：
  一次只问一个问题。
  根据我的回答，继续追问。
  直到你有95%的信心理解我的真实需求和目标。
  然后才给出方案
summary: 不用一开始就写出完整需求，也不用一次填完一张问卷。它每轮只问一件事，听过回答才决定下一问，直到自认为有95%的把握理解你的需求和目标，再开始给方案。这个百分比说的是它觉得自己听懂了多少，不是方案有多大概率成功。
usage: 把【你的问题/需求】换成眼下想办的事，连同后面的追问规则一起发给能多轮对话的 AI，等它先问再补细节。收到方案后，对照你在前几轮说过的目标和限制；若漏掉了会改变做法的条件，就指出来，让它接着问。
