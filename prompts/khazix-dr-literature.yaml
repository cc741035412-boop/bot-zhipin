slug: khazix-dr-literature
title: 围绕一个课题梳理研究文献
category: 学习
purpose: 给它课题和时间范围，它整理有出处的代表论文，比较方法并梳理待解问题。
scenarios:
- 研究生开题前寻找值得精读的论文
- 开发者选方法时比较数据需求
- 科普作者梳理某个课题的研究进展
lang: zh
body: |-
  帮我调研： <近5年用于阿尔茨海默症早期诊断的机器学习方法综述>。
  报告需包含：
  - 此领域重要的 <研究成果和论文>（作者、年份、成果简述）。
  - 不同 <机器学习方法>的 <优劣比较>（如准确率、数据需求、可解释性）。
  - 当前研究的 <挑战与未来方向>建议。
  请提供详细内容和引用来源。
summary: 报告把论文的作者、年份和主要成果放在一起，方便你挑出值得细读的几篇。它还会按你关心的指标比较不同方法，再梳理哪些难题尚未解决。这样读文献时，手里有的是一组具体问题，而不只是一张书单。
usage: 开启 AI 的深度研究功能，贴入模板。把 <近5年用于阿尔茨海默症早期诊断的机器学习方法综述> 换成自己的年限和课题；<研究成果和论文> 填要收的成果类型，<机器学习方法> 填要比较的方法类别，<优劣比较> 填比较重点，括号里的指标也可换；<挑战与未来方向> 填想追问的问题。打开所引论文，核对作者、年份、结论，并确认不同方法的指标能否直接比较。
