slug: guizang-xhs-cover
title: 做一张能一键存图的小红书封面
category: 营销
purpose: 填入一段笔记正文、账号名和标语，它提炼出 30 到 40 字大字标题，生成 3:4 比例、带一键存图按钮的封面网页
scenarios:
  - 不会用 PS 的个人博主用一段笔记草稿快速做出大字报式小红书首图
  - 知识类自媒体或学生做干货分享时，批量生成带账号署名的文字封面
  - 小店运营发活动通知或避坑指南时，做一张重点词高亮醒目的封面图
summary: 做干货类小红书笔记，大字排版封面往往比花哨配图更好用，但自己调字号、对齐和配色很花时间。这条提示词让 AI 直接用 HTML、CSS 和 JavaScript 写出一张 3:4 直角封面：先从你给的长文案里提炼 30 到 40 字精华，让文字占满画面七成以上空间，把主标题放大到副标题的三倍以上，并挑出 2 到 3 个关键词做高亮或描边处理；同时用 html2canvas 在画面外加了一个「保存为图片」按钮，预览满意就能直接存成干净的封面图。
usage: 在末尾的「用户输入内容」里，把「封面文案」整栏的示例换成你的笔记正文，把账号名「歸藏(guizang.ai)」换成你的昵称，把标语「正儿八经学AI」换成自己的口号，不需要标语就删掉这一栏。有偏好的配色或风格，也可以在末尾写明。用 Claude Artifacts 或 ChatGPT 画布预览生成的 HTML，也可以把代码存为 .html 文件，用联网的浏览器打开。先看关键词有没有被拆到两行，再点保存按钮，打开导出的图片，确认只有封面，没有边框或按钮。
tags:
