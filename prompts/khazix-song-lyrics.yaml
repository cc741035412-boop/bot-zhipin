slug: khazix-song-lyrics
title: 把一个主题写成能唱的歌词
category: 创意
purpose: 给它主题、曲风和情绪，它按主歌、副歌和桥段写出押韵、方便演唱的歌词。
scenarios:
- 毕业生把校园回忆写成告别歌
- 乐队排练前为新歌试一版副歌
- 上班族把加班时的心情写成歌词
lang: zh
body: |-
  你现在，要帮朕写歌词啦！！！
  朕会给你一个主题，你要去找一些参考，然后帮朕写成牛逼、押韵、有情绪煽动力的歌词。
  你要考虑如下因素：
  ## 核心风格
  -具体音乐风格（如：国风、摇滚、爵士、雷鬼等）
  -风格参考（可列举1 - 2位代表性歌手/乐队，如：周杰伦的中国风、Queen的摇滚叙事）

  ## 情感基调
  -核心情绪（如：治愈、伤感、热血、慵懒等）
  -情绪层次（如：从压抑到释放、始终温暖舒缓等，可选填）

  ## 主题内容
  -核心主题（如：青春回忆、职场压力、自然感悟、爱情遗憾等）
  -关键意象/场景（如：老槐树、深夜加班的台灯、海边日落等，可选填）

  ## 结构要求
  -段落组成（如：主歌2段 + 副歌2段 + 桥段1段）
  -语言风格（如：口语化、诗意化、叙事性强等）

  ## 节奏提示
  -整体节奏（如：轻快流畅、缓慢悠长、强弱交替明显等，可选填）

  ## 质量优化
  -避免使用陈词滥调，避免听起来像AI
  -保证音节平仄流畅，尾字押韵准确
  -保证每行歌词的字数适中，无生僻字，适合演唱

  ##最终输出格式：
  [前奏]
  [主歌]
  [主歌]
  [副歌]
  [副歌]
  [间奏]
  [主歌]
  [主歌]
  [副歌]
  [副歌]
  [桥段]
  [副歌]
  [副歌]
  [尾奏]

  听懂了就等朕的要求。
summary: 主歌里想唱哪个场景，副歌到了哪一句才把情绪放出来，都可以事先交代。它除了考虑曲风和用词，还顾及行长、尾字押韵和读音是否顺口，最后按演唱顺序标出段落。写完可以先自己哼一遍，再交给音乐模型试唱。
usage: 先把整段贴给文本 AI，等它回应，再发主题、想要的曲风、情绪和措辞。歌手或乐队参考可自选，情绪变化、场景和节奏按需补；主歌、副歌和桥段的数量也可改。[主歌]、[副歌] 等是成稿段落标记，不是填空。拿到歌词后顺着节拍念一遍，检查尾字与拗口处，再把改好的歌词贴进 Suno 或 Mureka。
