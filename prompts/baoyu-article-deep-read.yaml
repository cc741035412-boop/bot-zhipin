slug: baoyu-article-deep-read
title: 把一篇好文章拆开读透
category: 学习
purpose: 给它一篇文章并填上两个读者身份，它按论点、背景假设、论证漏洞、可复用方法和写作技巧五层逐题拆解
scenarios:
  - 学生或读书人精读长篇评论、社科文章时，理清作者没明说的底层假设和论证边界
  - 写作者或自媒体拆解一篇爆款长文，看它的开头结尾怎么设计、论据怎么排布
  - 上班族读行业深度报告时，代入自己的岗位看能提炼出什么可复用的方法
summary: 读完一篇好文章常觉得点头称是，合上页面却说不出它到底好在哪、哪里可能站不住脚。这套框架按五层共 19 个小问题逐一深挖：第一层拆核心论点、关键概念、论证结构和证据；第二层追问作者立场、回应的争论和没明说的底层假设；第三层找反对意见、推理跳跃、成立边界和回避的问题；第四层按你指定的两个读者角色提取可复用框架；第五层拆标题、开头结尾和说服技巧，遇到材料不够的问题还会直接说明原因。
usage: 发送前先把第四层里的「[目标读者角色1]」和「[目标读者角色2]」改成具体身份（比如「独立开发者」和「科技专栏作者」）；不想拆写法可以把「五、写作技巧分析（可选）」整段删掉。接着在末尾贴上文章全文，顺手附上作者简介和发表时间，第二层背景语境才不会因信息不足留空。任何支持长文本的对话模型都能用。读结果时，把第三层指出的漏洞对回文章原句，看看是真抓到了跳步还是AI过度挑刺。
tags:
  - 文章精读
  - 深度阅读
  - 批判性思维
  - 拆解写法
lang: zh
body: |-
  你是一位专业的内容分析师。请对以下文章进行深度分析，按照下面的框架逐层回答问题。

  分析框架

  一、核心内容（搞清楚"是什么"）
  1. 文章的核心论点是什么？用一句话概括
  2. 作者用了哪些关键概念？这些概念是怎么定义的？
  3. 文章的结构是什么？论证是怎么展开的？
  4. 有哪些具体案例或证据支撑观点？

  二、背景语境（理解"为什么"）
  1. 作者是谁？他的背景、身份、立场是什么？
  2. 这篇文章是在什么背景下写的？在回应什么现象或争论？
  3. 作者想解决什么问题？想影响谁？
  4. 作者的底层假设是什么？有哪些没说出来的前提？

  三、批判性审视
  1. 有人会怎么反驳这个观点？主要的反对意见可能是什么？
  2. 作者的论证有没有漏洞、跳跃或偏颇之处？
  3. 这个观点在什么情况下成立？什么情况下不成立？边界在哪里？
  4. 作者有没有刻意回避或淡化什么问题？

  四、价值提取
  1. 作者提出了什么可复用的思考框架或方法论？
  2. 对于[目标读者角色1]，能从中学到什么？
  3. 对于[目标读者角色2]，能从中学到什么？
  4. 这篇文章可能改变读者的什么认知？

  五、写作技巧分析（可选）
  1. 文章的标题、开头、结尾是怎么设计的？
  2. 作者用了什么技巧让文章有说服力？
  3. 这篇文章的写法有什么值得学习的地方？

  请按照上述框架，逐一回答每个问题。回答要具体、有洞察，避免泛泛而谈。如果某个问题信息不足无法回答，请说明原因。
