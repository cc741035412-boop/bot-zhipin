slug: sensory-concept-tour
title: 把抽象概念讲成画面
category: 学习
purpose: 给一个抽象名词，它不背定义，用一个能想象出来的场景讲给你听
scenarios:
- 给第一次接触向量的人讲直觉
- 为技术分享想一个开场比喻
lang: zh
summary: 给它一个抽象名词，它会先绕开术语定义，用一段能想象出画面的场景把概念讲出来，帮你在刚接触新概念或准备分享开场时先建立直觉。因为画面里借用了不少打比方的说法，读完还要回教材核对一遍，分清哪些只是比方、哪些才是事实。
usage: 先只给一个概念。读完后自己写一句不带比喻的定义，看能否说准确。
