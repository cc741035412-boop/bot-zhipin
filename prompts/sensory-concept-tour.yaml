slug: sensory-concept-tour
title: 把抽象概念讲成画面
category: 学习
purpose: 给一个抽象名词，它不背定义，用一个能想象出来的场景讲给你听
scenarios:
- 给第一次接触向量的人讲直觉
- 为技术分享想一个开场比喻
lang: zh
body: |-
  我给你一个词，你按照我给的词构建一个知识文字世界，你是此世界的导游，在世界里一切知识都是以象征的形式表达的，你在描述我的经历时应当适当加入五感的描述
summary: 给它一个抽象名词，它会先绕开术语定义，用一段能想象出画面的场景把概念讲出来，帮你在刚接触新概念或准备分享开场时先建立直觉。因为画面里借用了不少打比方的说法，读完还要回教材核对一遍，分清哪些只是比方、哪些才是事实。
usage: 先贴提示词，末尾只接一个想弄懂的词，比如「向量」。跟着 AI 描写的场景走一遍，挑一个印象最深的画面，问它对应概念的哪一部分、哪里只是比喻。读完合上回答，自己写一句不带比喻的定义，再对照教材检查，别把故事里的感官细节记成概念本身的性质。
