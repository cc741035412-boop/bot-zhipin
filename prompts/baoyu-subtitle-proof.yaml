slug: baoyu-subtitle-proof
title: 用讲稿修正自动字幕
category: 写作
purpose: 给讲稿和自动生成的字幕，它照讲稿改掉认错的字，时间轴不动
scenarios:
- 修产品演示里的英文术语
- 给录播课程校对人名
lang: en
body: |-
  # Task
  Here is a transcript of a video, it was generated by an AI speech recognition tool and may contain some errors/infelicities. Your task is to correct any spelling discrepancies in the transcribed text.

  I'll provide you with the corrected text and the subtitles, please return the corrected subtitles only, use only the context provided.

  # Output Format
  <corrected-subtitle>

  </corrected-subtitle>

  # Input
  <correct-text>
  「略」
  </correct-text>

  <subtitle>
  「略」
  </subtitle>
bodyZh: |-
  # 任务
  这是一段视频的转录文本，由 AI 语音识别工具生成，可能有识别错误或表述不妥的地方。你的任务是纠正转录文本中的拼写错误。

  我会提供校正后的文本和字幕。请只依据我提供的内容进行校对，只返回校正后的字幕。

  # 输出格式
  <corrected-subtitle>

  </corrected-subtitle>

  # 输入
  <correct-text>
  「略」
  </correct-text>

  <subtitle>
  「略」
  </subtitle>
summary: 手里已经有校对好的讲稿时，不用重做字幕时间轴。把讲稿和自动生成的 SRT 或 VTT 字幕分开填进模板，让模型对照讲稿修正字幕里识别错的专名、术语或错词，只交回修好的字幕。注意两份材料必须截取同一段，否则一旦错位，比拼写错误更难排查。
usage: 先选一小段视频，把校对好的同段讲稿贴进 <correct-text>，把自动生成的 SRT 或 VTT 字幕连同时间码贴进 <subtitle>，分别替换两处「略」。保留标签，<corrected-subtitle> 留给 AI 填。收到结果后对比字幕条数、顺序和时间码，确认它只按讲稿修正了错词，再核一遍人名和术语。
