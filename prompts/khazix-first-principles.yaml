slug: khazix-first-principles
title: 放下老办法，从基本事实重新找路
category: 分析
purpose: 给它一个久攻不下的问题，它分开事实与假设，从目标和现实限制重新推导做法。
scenarios:
- 复习时间越排越满，错题却还是那几类
- 程序反复打补丁，想判断是不是修错了地方
- 每周都加会，交接时仍然漏事
lang: zh
body: |-
  我想解决的问题是：【填写你的问题】。

  请用第一性原理把它拆回最底层，区分：
  1. 已经确认、无法绕开的基本事实；
  2. 习惯性接受、却没有验证过的假设；
  3. 真正想实现的目标；
  4. 现实中的资源与约束。

  暂时放下行业惯例和现成方案，只从基本事实、目标和约束出发，重新推导可行路径。

  最后请输出：
  1. 原方案中只在修补表面的部分；
  2. 从基本事实重新推导出的新路径；
  3. 这条路径成立的前提；
  4. 验证它的第一步。
summary: 有些限制绕不过去，有些只是一直没人问过为什么。它把基本事实、未经验证的假设、真正的目标和手头的资源分开，先不沿用现成方案，再看还有哪条路走得通。这样既能指出老办法哪里只是在补表面，也能说清新办法要先验证什么。
usage: 把【填写你的问题】换成具体难题，最好一起写下现在怎么做、想达到什么结果、手头有什么限制，再整段贴给对话 AI。逐条核对它认定的基本事实；没有依据的先算作假设，再看建议的第一步能否检验新路径的前提。
