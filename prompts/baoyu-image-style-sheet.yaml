summary: 把参考图发给看图模型，让它把构图、光线、用色以及主体位置、镜头、文字和材质拆开描述。拿到分项记录后，可以按字段挑出这次想沿用的部分单独调整，不用只靠口头说「照这个感觉来」；如果打算把结果交给程序读取，用前先核查是否为合法 JSON。
usage: 在能看图的对话里上传一张你有权使用的参考图，贴上提示词一起发送。JSON 里的 string 是给 AI 的格式示意，不用自己填。拿到结果后对着图核对主体位置、配色、光线和画面文字，只摘出新设计想沿用的字段。要交给程序读取，先验证整段能否按 JSON 解析。
