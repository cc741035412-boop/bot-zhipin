title: 把学习材料做成记忆卡
titleOriginal: to_flashcards
category: 学习
purpose: 贴一段要记的材料，它把知识点拆成问答，排成可导入 Anki 的两列 CSV。
scenarios:
- 考前把一章地理笔记拆成自测题
- 把培训手册里的易混术语做成问答卡
tags:
- Anki
