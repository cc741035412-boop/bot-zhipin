slug: khazix-dr-history
title: 对照多种史料梳理一件往事
category: 分析
purpose: 给它一件历史事件和关心的人或事，它排出时间线，对照不同来源分析影响。
scenarios:
- 学生写历史作业时核对事件先后
- 写作者查清某件大事怎样影响笔下人物
- 播客编辑备稿时比对报道和回忆录
lang: zh
body: |-
  我要深度研究<你想研究的>这一历史事件。请帮我：
  - 按时间顺序列出该事件发生的主要阶段，每阶段简述发生了什么，并尽可能提供时间日期。
  - 引用至少<X个不同来源>对这一事件的评价或记载（如当时报刊、历史学者著作、当事人回忆录），并注明出处。
  - 综合资料，分析这件事对当时的<XX事件或角色>的影响。
summary: 它先把事件分阶段，尽可能标出日期，再把当时报刊、当事人回忆或学者著作里的记载和评价放在一起看。有了时间线和出处，你可以分清谁在什么时候作了什么判断，再追问这件事对某个人或另一件事究竟有什么影响。
usage: 开启 AI 的深度研究功能，贴入模板，把 <你想研究的> 换成事件名称，<X个不同来源> 换成要求的来源数量，<XX事件或角色> 换成你关心的相关事件或人物。沿出处核对关键日期和引文，注意几篇材料是否转引自同一处；说法不一致时保留分歧，不要硬凑成一个结论。
