slug: seedance-product-turntable
title: 商品白底旋转展示视频
category: 视频
purpose: 上传同一件商品两三个角度的照片，生成一段白底桌面上展示正面、侧面和背面的旋转展示视频。
scenarios:
- 网店店主用手机拍几张商品照做详情页展示视频
- 二手卖家把闲置数码产品做成多角度旋转展示短片
- 手作店主展示摆件或器物的正面、侧面与背面细节
summary: 只凭一张正面照生成旋转展示视频，转到侧面和背面时很容易跟实物对不上。这条提示词先用「提取`图片1`、`图片2`、`图片3`的相机」把同一商品的多张视角图绑在一起，再依次交代四步：把背景换成白色、把商品放到白色桌子上、镜头以特写聚焦主体，最后「以相机为主体缓慢旋转，清晰展示相机的正面侧面以及背面」。一句话就把多图参考、换白底和多角度旋转展示串了起来。
usage: 必须先上传参考图：提供同一件商品 2–3 个角度（如正面、侧面、背面）的照片；若只传 2 张，删去提示词里的「、`图片3`」。把句中各处「相机」都换成你的商品名称；想换背景或桌面颜色，可改动两处「白色」。在即梦或火山方舟等支持 Doubao Seedance 2.0 系列的入口使用，推荐比例 16:9（官方示例为 1280×720、11 秒，带音轨）。出片后检查旋转过程中商品正面、侧面和背面的外观细节是否与所传照片一致。
tags:
- 商品展示
- 白底视频
- 多图参考
- 电商视频
models:
- Doubao Seedance 2.0
- 即梦
lang: zh
body: |-
  提取`图片1`、`图片2`、`图片3`的相机，把背景换成白色，相机在一个白色桌子上，镜头以特写的形式聚焦相机，然后以相机为主体缓慢旋转，清晰展示相机的正面侧面以及背面。
