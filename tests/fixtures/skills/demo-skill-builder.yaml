slug: demo-skill-builder
title: 示例·把做事方法写成新技能再跑几轮测试的小帮手们
name: demo-skill-builder-with-a-deliberately-long-original-name-xx
category: 工具
purpose: 照着一套问答把你的做事方法写成一个新的 skill，并跑几个例子检查它好不好用
scenarios:
  - 有一套固定的做事流程，想让 agent 以后自己照着做
  - 写好了一个 skill，不知道它会不会被正确触发
tags: [做技能, 评测, 元技能, 自动化, 示例]
agents: [通用]
summary: |
  一个虚构的示例 skill，用来测试长标题、长原名和很长的安装命令：它先问你几个问题，把回答整理成 SKILL.md 的骨架，再生成几个测试用例跑一遍，看 agent 会不会在该用它的时候用它。没有声明许可证。
install:
  - agent: 通用
    command: mkdir -p ~/.agents/skills/skill-builder/refs && curl -fsSL https://example.com/s/raw/main/skill-builder/SKILL.md -o ~/.agents/skills/skill-builder/SKILL.md && curl -fsSL https://example.com/s/raw/main/skill-builder/refs/checklist.md -o ~/.agents/skills/skill-builder/refs/checklist.md
requires: [Node.js 18+]
source:
  url: https://example.com/demo-skills/tree/main/skill-builder
  name: demo/skill-builder
author:
  name: 示例个人开发者
license: 未声明
addedAt: 2026-11-09
examples:
  - caption: 将重复的操作整理为技能草稿。
    lang: zh
    ask: 把这份操作记录整理成一个能反复使用的技能。
    source: { name: 示例个人开发者, url: https://example.com/demo-skills/builder/draft }
    rights: © 示例个人开发者
