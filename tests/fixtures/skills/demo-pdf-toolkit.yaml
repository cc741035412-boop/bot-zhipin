slug: demo-pdf-toolkit
title: 示例·PDF 工具箱
name: demo-pdf
category: 文档
purpose: 读、拆、合并 PDF，把表格和文字抽出来，再按要求生成新的 PDF
scenarios:
  - 从几十页的合同里把关键条款抽出来
  - 把几份扫描件合并成一个文件
  - 填一张 PDF 表单
tags: [PDF, 表单]
agents: [Claude Code, Claude.ai, 通用]
summary: |
  一个虚构的示例 skill，用来测试多条安装命令：附带几个 Python 脚本，处理 PDF 的读取、拆分、合并、填表，需要本机装 Python 3 和两个第三方库。目录里自带的许可证是专有许可，只能按原作者的说明使用，这里不转载任何原文。
install:
  - agent: Claude Code
    command: /plugin marketplace add example/demo-skills
    note: 加完市场后再运行 /plugin install demo-document-skills@demo-skills
  - agent: Claude.ai
    command: 设置 → 功能 → Skills → 上传 demo-pdf.zip
  - agent: 通用
    command: git clone https://example.com/demo-skills.git && cp -r demo-skills/pdf ~/.agents/skills/
requires: [Python 3, pypdf, pdfplumber]
source:
  url: https://example.com/demo-skills/tree/main/pdf
  name: demo/skills
author:
  name: 示例团队
