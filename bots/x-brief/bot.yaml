slug: x-brief
name: "X Brief"
nameZh: "X 简报员"
tagline: "盯你选的 X 账号和话题，每天一份带链接的简报"
category: 内容
author:
  name: "Dan McAteer"
  url: https://x.ai/bot/marketplace/bots/x-brief
templateUrl: https://x.ai/bot/RO8GwQZFXL9O95i13epqF
addedAt: 2026-11-15
prerequisites:
  - "想盯的 X 账号或话题"
  - "建议连上 X，不连只能读公开页面，很多内容看不全"
  - "日报默认关，开了以后工作日每天跑，按你设的时区"
quotaCost: 中
permissions:
