external: true
pitch:
  - 你关注的那几个号，今天发了啥我替你看。
  - 一天最多十二条，水帖进不来。
about:
  intro: 你挑 5 到 15 个 X 账号、几个话题或搜索词，它每天读一遍新帖，只留发布、融资、公开数据、大佬强观点这类有分量的，按主题分组出一份最多 12 条的简报，每条带链接。周五再把一周串起来。你贴来的帖子也能帮你拆读、核数字，要发帖它只写草稿。
  does:
    - 每天按主题汇总你关注的 X 账号和话题
    - 每条都附原帖链接，同一条不会报两次
    - 周五总结本周主线、值得新关注的人
    - 拆读你贴的长帖，核对里面的数字
    - 起草帖子或回复，发不发你定
  trial: |-
    全程中文，先不连任何应用。帮我盯这 5 个号：@OpenAI @AnthropicAI @xai @GoogleDeepMind @karpathy。先只看过去 24 小时，挑最多 6 条值得看的，每条一句话加原帖链接。日报和其他设置等我试完再说。
  starters:
    - 帮我盯这几个账号：@OpenAI @AnthropicAI @xai
    - 先给我一份过去 24 小时 AI 圈的简报
  skills:
    - name: 上手引导
      does: 问清你想盯什么，尽快给出第一份简报
    - name: 盯梢清单
      does: 添加、删除要盯的账号和话题，随时能查在盯谁
    - name: 每日简报
      does: 汇总当天值得看的帖子，每条带链接
    - name: 每周回顾
      does: 把一周简报归成几条主线，列周末值得读的
    - name: 读帖子
      does: 读你贴的帖子或长帖，做总结或核实
    - name: 起草帖子
      does: 根据简报或链接写帖子、回复的草稿
  routines:
    - what: 读盯梢清单，按主题发当天的简报
      when: 默认工作日每天，几点你定
      default: 关
      quiet: 照发
    - what: 把一周简报归成主线，列值得加和变安静的账号
      when: 每周五
      default: 关
      quiet: 照发
  fit: 要跟海外 AI 圈或行业动态的开发者、创作者和从业者
  notFit: 想盯微博、即刻等国内平台的人
  cnFit: 一般
  cnNote: 核心靠 X，建议连上 X，不连只能读公开页面；Slack、Notion 都可以不连
