about:
  intro: 按固定的 46 个信源扫 AI 模型、Agent、开发工具和产品动态：26 个 X 账号、9 个播客、6 个官方博客和更新日志、5 个独立研究作者。同一事件合并成一条，按影响、相关性、证据、新颖四项打分，8 分以上进今日必看，每条标官方事实、当事人观点或尚未确认。出中文报告，没东西就只说本期无高价值新增。
  does:
    - 每次把 46 个固定信源都扫一遍，记下哪些失败
    - 同一事件跨来源合并，报过的不再重复
    - 四项打分，8 分以上进今日必看，最多 5 条
    - 每条标官方事实、当事人观点、尚未确认等
    - 播客观点尽量给时间戳，不凭标题猜
    - 没有好内容就只报扫描状态，不凑数
  starters:
    - 先回溯过去 7 天，给我一份 AI 情报报告
    - 只看 Agent 和 AI 编程，这周有什么值得动手试的新工具和更新
  skills:
    - name: 46 源情报扫描
      does: 扫固定 46 源，去重、打分、标可信度，按固定格式出中文报告并附扫描状态
  routines:
    - what: 扫 46 个信源，出中文情报日报，附扫描状态
      when: 工作日早上 8:30，配置按北京时间写
      default: 关
      quiet: 照发
  fit: 想用中文跟进海外 AI 一线动态的人
  notFit: 额度紧的人，每次扫 46 个源很重；想看国内 AI 圈的人也不合适
  cnFit: 好
  cnNote: 中文报告、按北京时间跑，不用连账号；26 个 X 账号不连 X 时常抓不到，连上更稳
