# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: lead-pipeline-desk
name: "Lead Pipeline Desk"
nameZh: "线索管理员"
tagline: "给销售线索打分去重、分配跟进人、盯住超时没跟的"
category: 销售
author:
  name: "Miguel Cruz"
  url: https://x.ai/bot/marketplace/bots/leadsworth
templateUrl: https://x.ai/bot/oPDkINUfpUXhJDdsfRZht
addedAt: 2026-11-15
prerequisites:
  - "一份线索表（导出、表格或直接贴），再说清什么样的线索算好"
  - "名单含客户个人信息，会存在共享云电脑上"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 线索一大堆，先跟哪个？我给你排好。
  - 没人跟的线索，周一我会点名。
about:
  intro: 把 CRM 导出、表格或直接贴的线索名单交给它，先整理成一张统一的线索台账。再按你定的标准给每条打 0 到 100 分，分 A、B、C、D 四档并写理由，合并重复，配好跟进人和下一步，给 A 档起草第一封回复。每周一出一份报告，标出没人跟、超时和卡住的。
  does:
    - 把散在各处的线索整理成一张台账
    - 按你的标准打分分档，每条写清理由
    - 合并重复线索，合并前先存一份备份
    - 配跟进人和下一步，给 A 档起草首封回复
    - 每周出报告，标出没人跟、超时和卡住的
  trial: |-
    全程中文。先拿下面的示例线索走一遍。好线索：物流或电商公司、200 人以上、总监及以上。跟进人小陈、小林轮流分。
    1. 王磊，华运物流 IT 总监，800 人，wanglei@huayun-wl.com，官网申请演示，11 月 20 日
    2. 李娜，个人卖家，lina@qq.com，表单问价格，11 月 19 日
    3. 王磊，华运物流，wanglei@huayun-wl.com，展会扫码，11 月 18 日
    4. 赵强，优选电商运营经理，300 人，zhaoq@youxuan-ec.com，下载白皮书，11 月 15 日
    打分分档、合并重复、配好跟进人，给 A 档写第一封回复，只出稿不发。
  starters:
    - 这是上周的线索导出，帮我打分排个先后
    - 帮我看看这批名单里有多少重复的
  skills:
    - name: 上手引导
      does: 问清你想要什么，尽快给出第一份结果
    - name: 建线索台账
      does: 把导出、表格或贴的名单变成一张台账
    - name: 打分分档
      does: 给线索打匹配分和档位，告诉你先跟哪个
    - name: 合并重复
      does: 新数据进来或同一人出现两次时去重
    - name: 分配和首封回复
      does: 给线索配负责人和下一步，起草第一封回复
    - name: 管道健康报告
      does: 汇报线索来源、档位、进展和卡点
    - name: 接工具换来源
      does: 教你把线索导进来，或换来源和汇报去处
  routines:
    - what: 给隔夜新线索打分去重，列出没人跟和超时的
      when: 工作日早上，时间你定
      default: 关
      quiet: 照发
    - what: 管道周报：来源、档位、进展、卡点和目标进度
      when: 每周一早上
      default: 关
      quiet: 照发
  fit: 手上线索多、总有人漏跟的销售主管和增长运营
  notFit: 要主动去找新客户的人，它只管已经进来的线索
  cnFit: 好
  cnNote: 贴或上传表格就行，飞书多维表格、企业微信导出来都能用；名单会存在共享云电脑
