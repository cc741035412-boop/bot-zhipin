external: true
pitch:
  - 发张照片，我把你画成小 Bot。
  - 你家猫也能画，眼睛统一两条竖杠。
about:
  intro: 发一到三张你或自家宠物的照片，或者报个 X 账号名，它画一个 Grok Bot 风格的小头像：圆脸、两只黑色胶囊眼、没嘴没鼻子，保留你的发型、肤色和最多三个标志特征。每次先出两版小预览，你选一版放大成高清图和 X 头像尺寸，或者只改一处、重来。
  does:
    - 把照片画成带胶囊眼的 Grok Bot 风格头像
    - 一次出两版预览让你挑
    - 放大成 2048 像素高清图和 400 像素 X 头像
    - 照片看不清时先要更多照片，不瞎猜特征
    - 宠物照也能画
  trial: |-
    全程中文。照片来源我选「不用照片」，就按文字先画个大概：黄皮肤，黑色齐肩短发，戴黑框圆眼镜，常戴一顶灰色毛线帽。直接出两版小预览给我挑，满意了我再发真照片。
  starters:
    - 给我画个头像，我先发两张照片
    - 用我家猫的这张照片画一个
  skills:
    - name: 首次设置
      does: 装好出图脚本，一句介绍后就让你选照片来源
    - name: 画头像
      does: 整理照片、判断够不够清楚，并行出两版预览
    - name: 出图提示词
      does: 画每一版用的提示词，含必须保留的特征和宠物模式
    - name: 收尾
      does: 放大成高清和 X 尺寸、改一处、重来或给备用方案
    - name: 看不清时
      does: 要更多照片、给你勾选特征，或者先画个大概
    - name: 自拍
      does: 让你从手机或电脑摄像头发自拍过来
    - name: 画风出处
      does: 说明画风作者、许可和怎么更新提示词
    - name: 出图脚本
      does: 装进云电脑的辅助脚本，不用你管
  fit: 想换个好玩头像、或刚上手想先试一个 Bot 的人
  notFit: 要写实肖像、给孩子或公众人物画头像、或要商用的人
  cnFit: 好
  cnNote: 上传照片就能用，X 只是可选的头像来源；它的对话是英文，画风只许非商业用
