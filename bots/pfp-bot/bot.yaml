tagline: "把你或宠物的照片画成 Grok Bot 风格的小头像"
category: 生活
author:
  name: "Shub Gaur"
  url: https://x.ai/bot/marketplace/bots/pfp-bot
templateUrl: https://x.ai/bot/eFnHzlDcKdoA406SzZbNZ
templateVersion: 1
addedAt: 2026-11-15
prerequisites:
  - "一到三张看得清脸的照片，或者你的 X 账号名"
  - "照片会留在共享云电脑上，介意的话做完让它删掉"
