# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: office-ops-desk
name: "Office Ops Desk"
tagline: "帮行政盯快递、报修和同事生日，按时出日报周报"
category: 运营
author:
  name: "Erika Cabrera"
  url: https://x.ai/bot/marketplace/bots/office-ops-desk
templateUrl: https://x.ai/bot/afZj-XnYkThA4MB7GfZK6
addedAt: 2026-11-15
prerequisites:
  - "一份快递、报修或同事生日清单，粘贴或表格都行"
  - "同事生日和收货地址会存在共享云电脑上"
  - "国内快递能不能查到没有保证"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 快递到哪了、空调修没修，都记在我这儿。
  - 下周谁过生日，周五我提醒你。
about:
  intro: 给小公司行政用的台账员。把快递单号、报修事项、同事生日和新人入职要准备的东西丢给它，先整理成三张表，之后每天报快递进度，周一出报修汇总，周五提醒未来两周谁过生日、谁满周年。催件信、工单都只起草，你点头才算数。
  does:
    - 把快递、报修、生日清单整理成固定格式的台账
    - 快递超期时去承运商查件页核实，再起草催件信
    - 按严重程度汇总没修好的事，标出负责人和拖了几天
    - 列出未来 14 天的生日和入职周年
    - 按新人到岗日倒排要买的电脑、工牌和桌椅
  starters:
    - 下周一有个新同事入职，帮我列一下要提前准备什么
    - 这是我们这个月的快递单号，帮我建个台账看看哪些超期了
    - 会议室空调又坏了，记一下，顺便看看还有哪些没修好
  skills:
    - name: 上手问询
      does: 首次问清你管哪些事、几点要日报，尽快出第一份结果
    - name: 建行政台账
      does: 把你给的快递、报修、生日清单整理成台账
    - name: 报修周报
      does: 把没修好的事按紧急程度分组，附负责人和天数
    - name: 催迟到的快递
      does: 核实超期或长时间没动静的快递，起草催件信
    - name: 生日和周年清单
      does: 找出近期的生日和入职周年，跳过不想被提醒的人
    - name: 新人入职准备
      does: 按到岗日倒排要采购和准备的东西
    - name: 同步到 Notion、Linear、Slack
      does: 经你同意后把报修建成工单、台账同步或发到频道
  routines:
    - what: 快递日报：哪些到了、哪些晚了、哪些停住不动
      when: 每个工作日早上，几点由你定
      default: 关
      quiet: 不打扰
    - what: 报修周报：没修好的事按紧急程度分组
      when: 每周一早上
      default: 关
      quiet: 照发
    - what: 未来 14 天的生日和入职周年提醒
      when: 每周五早上
      default: 关
      quiet: 照发
  fit: 小公司里一个人管快递、报修和团建的行政或办公室主管
  notFit: 想让它直接下单采购、审批报销的人，这些它明确不做
  cnFit: 好
  cnNote: 粘贴清单或传表格就能用，所有连接都可选；国内快递能不能查到没保证，结果要自己贴到飞书
