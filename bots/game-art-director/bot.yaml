external: true
pitch:
  - 你的游戏长什么样，咱们先定个调。
  - 这张图色板跑偏了，我一眼就看得出来。
about:
  intro: 做独立游戏的人可以把它当美术指导，一次只管一款游戏。先问清类型、视角、画法和引擎，写出风格指南、带色值的色板和能直接粘进出图工具的提示词，再定精灵和瓦片的尺寸、帧数和命名。图你自己出，丢回来后它查色板偏移、网格对齐和命名。
  does:
    - 写风格指南和带 hex 色值的色板
    - 写能粘进 Midjourney、SD 的提示词表
    - 定精灵瓦片的尺寸、帧数、锚点和命名
    - 查你出的图有没有色板偏移和网格错位
    - 切图、打包图集、做动画预览
  trial: |-
    全程中文，其他问题先跳过，拿下面这款示例游戏走一遍：
    像素风横版动作游戏，场景是赛博朋克夜市，氛围要潮湿、霓虹、有点孤独。侧视角，瓦片 16x16，主角画布 32x32，引擎用 Godot，先上 PC，出图用 Midjourney。
    先不找参考链接，直接给我一版风格指南要点、一套带 hex 色值的 12 色色板，再写一段通用风格提示词和 3 条主角动作的提示词。
  starters:
    - 我在做一款像素风横版动作游戏，帮我定一版美术风格
    - 这是我用 AI 出的一批角色图，帮我看看哪里跑偏了
  skills:
    - name: 上手引导
      does: 问清做什么游戏、想要什么样子，尽快出第一份东西
    - name: 风格指南
      does: 定美术原则、参考、色板、线条和光影规则
    - name: 提示词表
      does: 写贴合风格指南、能直接粘进出图工具的提示词
    - name: 精灵瓦片规格
      does: 出图前定好画布、帧数、锚点、网格和导入设置
    - name: 素材一致性检查
      does: 查色板偏移、网格错误、杂边、描边光影和命名
    - name: 精灵图工具箱
      does: 切图、打包、改名、整数缩放，做成引擎能读的图集
  routines:
    - what: 对照风格指南查新增素材，报偏差和还缺什么，没事回一句
      when: 每周一次，哪天几点你定，按你的时区
      default: 关
      quiet: 照发
    - what: 找 4 到 6 张同类型同风格的公开参考，带链接和可借鉴点
      when: 每周一次，哪天几点你定，按你的时区
      default: 关
      quiet: 照发
  fit: 在做 2D 独立游戏、用 AI 出图又怕风格不统一的人
  notFit: 想让它直接出图，或做 logo、通用配图的人
  cnFit: 好
  cnNote: 不连任何应用都能用；提示词表没列即梦、可灵，会给通用写法让你自己调
