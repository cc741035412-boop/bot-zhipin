slug: game-art-director
name: "Game Art Director"
nameZh: "游戏美术指导"
tagline: "帮独立游戏定美术风格、写出图提示词、检查素材"
category: 产品
author:
  name: "Danny Limanseta"
  url: https://x.ai/bot/marketplace/bots/sable-game-art
