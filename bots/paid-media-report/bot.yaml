slug: paid-media-report
name: "Paid Media Report"
nameZh: "投放周报员"
tagline: "把各广告平台的导出表合成一份带解读的投放周报"
category: 市场
author:
  name: "Miguel Cruz"
  url: https://x.ai/bot/marketplace/bots/tally
templateUrl: https://x.ai/bot/qBFjPRQ3IbHG69qIFHblE
addedAt: 2026-11-15
prerequisites:
  - "各广告平台的导出表，每周给它新的"
  - "盯 Slack 提问的任务每小时跑一次，很烧额度，建议只开周报和月报"
quotaCost: 中
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 各家导出的表丢给我，我拼成一份周报。
  - CPA 为什么涨了，我给你拆开看。
about:
  intro: 每周把 Google Ads、Meta、LinkedIn 或任何带花费列的导出表丢给它，先把各家表头对到同一套字段，再按固定口径算 CTR、CPC、CPA、ROAS，出周报或月报，写清哪个数变了、为什么变。只读导出表，不登录广告后台。
  does:
    - 把不同平台的导出表头对成同一套字段
    - 出带环比的周报，月报加三个月趋势和预算进度
    - 把 CPA 拆成点击成本和转化率，解释为什么变
    - 起草回复同事要数的消息，你批了才发
    - 转化太少时提醒你这个变化可能是噪音
  trial: |-
    全程中文。先不连任何应用，拿下面这份巨量引擎示例导出走一遍：每行是一周，币种人民币，转化就是表单提交。出一张两周对比的周报，再告诉我信息流的 CPA 为什么涨了，拆成点击成本和转化率讲。
    周开始日,计划,展示,点击,消耗,转化
    2026-11-03,职场课-信息流,80000,1600,4000,80
    2026-11-10,职场课-信息流,85000,1500,4800,60
    2026-11-03,搜索-品牌词,20000,900,1800,45
    2026-11-10,搜索-品牌词,21000,950,1900,47
  starters:
    - 给你上周的 Meta 导出表，先出一张周报
    - 为什么这周 CPA 涨了这么多？
  skills:
    - name: 上手引导
      does: 首次对话问清偏好，尽快出第一张表
    - name: 对表头
      does: 第一次拿到某平台导出或表头变了时，建字段对应
    - name: 回答要数
      does: 同事在频道要数，或你贴来问题时起草回复
    - name: 投放周报
      does: 出周报或周环比，周报定时任务也用它
    - name: 投放月报
      does: 出月报、月环比或预算进度检查
    - name: 变化解读
      does: 解释某个数为什么变，给报告写解读
  routines:
    - what: 看你指定的频道有没有人要数，起草回复给你批
      when: 工作日工作时段，每小时一次
      default: 关
      quiet: 不打扰
    - what: 用手头导出表出上周周报，缺表就说缺哪份
      when: 每周一次，你选哪天早上
      default: 关
      quiet: 未说明
    - what: 出上个月的月报，含三个月趋势和预算进度
      when: 每月第一个工作日
      default: 关
      quiet: 未说明
  fit: 手上有几个广告平台、每周要合一份报表的投放人
  notFit: 想实时盯账户、超线就报警的人，它只在出报告时看数
  cnFit: 好
  cnNote: 带花费列的导出表都能用，国内平台导出理论上也能对上字段；盯要数要连 Slack
