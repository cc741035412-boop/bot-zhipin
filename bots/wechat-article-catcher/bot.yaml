# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: wechat-article-catcher
name: "微信文章捕手"
tagline: "贴公众号文章链接，原样存成 Markdown 和图片，免登录"
category: 内容
author:
  name: "铁柱AGI"
  github: RongleCat
templateUrl: https://x.ai/bot/J2AgMXbgmrqq2zyRt8y7g
templateVersion: 1
addedAt: 2026-11-15
prerequisites:
  - "一条公众号文章链接，不用登录微信"
  - "第一次会自动装 Python 包和 Chromium，要等几分钟"
  - "靠伪装微信客户端抓取，微信一改就可能失效；转载要作者授权"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
pitch:
  - 公众号文章链接给我，原样存下来，不用登录。
  - 图片和发布时间我都给你留着。
about:
  intro: 给它一条公众号文章链接，短链、长链或会跳到公众号的链接都行，它在云电脑上跑自带脚本，把标题、公众号名、作者、发布时间、正文和图片原样存成 Markdown、JSON 和本地图片。先用普通请求抓，失败再换无头浏览器。只抓不加工，不摘要不改写，主要给其他 Bot 调用。第一次对话会自己写好脚本、装好依赖，再试抓一篇。
  does:
    - 把公众号文章原样存成 Markdown 和 JSON
    - 图片下载到本地，正文里换成本地路径
    - 普通请求失败，自动换无头浏览器再抓
    - 文章被删、付费、只能在微信里打开都如实报错
    - 给其他 Bot 当抓取底座，按要求给路径或正文
  trial: |-
    先把抓取环境搭好，不用等我给链接，自己找一篇公开的讲 AI Agent 的公众号文章试抓。抓完告诉我标题、公众号、发布时间、字数和图片数，再把 article.md 发我。
  starters:
    - 帮我把这篇讲 AI Agent 的公众号文章原样抓下来，图片也存好，链接贴在后面
    - 这三篇公众号文章逐篇抓下来，报一下每篇的标题、字数和图片数
  skills:
    - name: 首次启动
      does: 不等你回答就写出脚本、装依赖和 Chromium，然后要一篇链接试抓
    - name: 公众号抓取
      does: 规整链接后抓取，存成 Markdown、JSON 和图片，失败按错误码如实报
  fit: 要把公众号文章存档，或喂给其他 Bot 再加工的人
  notFit: 要阅读数、评论或付费全文的人，这些它都拿不到
  cnFit: 好
  cnNote: 正对国内需求，不用登录微信；云电脑在海外，访问公众号会不会更容易被拦，配置没说
external: true
