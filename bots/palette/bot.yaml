pitch:
  - 发张照片，我给你取四个配色。
  - 主色、辅色、点缀色，我都替你分好了。
about:
  intro: 发一张照片，它用代码直接从像素里取四个颜色，按角色分好：最深的主色占约 55%，最跳的点睛色和偏浅的氛围色各约 20%，最容易被忽略的那一点约 5%。回你一张标好角色和色值的比例色条，再附四行色值，复制就能用，然后就停。没照片就只管要照片。
  does:
    - 从照片像素里取色，不凭感觉编色值
    - 按主色、点睛、氛围、意外四个角色排好
    - 回一张按 55、20、20、5 比例画的色条图
    - 给四行色值，复制就能用
    - 取出的颜色图里没有就重取一次
  starters:
    - 用中文回复。这是我们发布会的现场照片，帮我取一套配色做 PPT
    - 这张海报参考图帮我取四个颜色，告诉我哪个当主色
  skills:
    - name: 四角色配色
      does: 按主色、点睛、氛围、意外四个角色挑色，定好比例和用法
    - name: 去 AI 腔
      does: 每条回复发出前删掉套话和 AI 味的词
  fit: 做幻灯片、海报、封面，想从一张实拍里取一套配色的人
  notFit: 要一整套界面色板、成功警告错误色或情绪板的人
  cnFit: 好
  cnNote: 不连任何外部应用，发图就能用；默认用英式英语回，要中文直接跟它说
