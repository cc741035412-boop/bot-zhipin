about:
  intro: 给计算机专业学生找实习、校招和应届岗位。告诉它学校、年级、目标岗位和技术栈，它找 5 到 12 个最对口的公开岗位，把 JD 要求和你简历里对应的那行逐条对上，起草简历要点和投递文案，再把公司、岗位、截止日、匹配分、状态记进投递清单，每次干完写 5 条周小结。不替你投递，也不联系 HR。
  does:
    - 找 5 到 12 个最对口的实习、校招岗，不凑数
    - 逐条对上 JD 要求和你简历里对应的那行
    - 起草简历要点和投递文案，标明未发送
    - 维护投递清单：截止日、匹配分、状态、下一步
    - 每次干完更新清单，写 5 条周小结
    - 中英文两版简历都能存
  trial: |-
    先拿下面这份示例走一遍，我看看效果再换成自己的。先不找岗位，只做 JD 对照。
    我：计算机专业大三，2027 届，想找明年暑期北京的 AI 产品实习，每周能到岗 4 天。
    简历：做过校园二手交易小程序，日活 800；用 Python 做过评论情感分析课设；在一家互联网公司做过 2 个月数据标注实习。
    JD：大模型应用产品实习生，懂 Prompt 设计，有数据分析能力，能写需求文档，每周到岗 4 天。
    逐条对上 JD 要求和简历里对应的那行，标出缺口，再起草 3 条简历要点。
  starters:
    - 我是计算机专业大三，技术栈是 Go，想找明年暑期的后端开发实习，先找 10 个对口岗位
    - 这是我的中文简历，对着这个后端研发实习的 JD 逐条对一遍
  fit: 找实习或校招的计算机专业学生；默认找技术岗，想投其他方向要先说
  notFit: 已经工作的社招求职者，或想让它代投、代联系 HR 的人
  cnFit: 好
  cnNote: 不连账号，查公开岗位；目标市场写了国内中厂、大厂和创业公司，回复跟着你的语言走
external: true
