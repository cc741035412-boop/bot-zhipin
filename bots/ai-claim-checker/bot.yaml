# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: ai-claim-checker
name: "AI Claim Checker"
nameZh: "AI 说法核查员"
tagline: "贴 AI 发布帖或跑分图，逐条核查真假并附出处"
category: 产品
author:
  name: "Michael Gannotti"
  url: https://x.com/MichaelGannotti
templateUrl: https://x.ai/bot/G48vC01p5cAxckACKFIaM
addedAt: 2026-11-15
prerequisites:
  - "贴文字、链接或截图就能用，不用连任何应用"
  - "核查卡可能引用作者自家站点，它不是中立第三方"
  - "来源偏英文，查国产模型时独立证据可能偏少"
quotaCost: 中
permissions:
  - 联网
  - 定时自动运行
pitch:
  - 又说吊打 GPT？跑分图发我，我逐条查。
  - 厂商自己说的和第三方测的，我分开标。
about:
  intro: 贴一条 AI 发布帖、链接、X 帖子或跑分图、价格表截图，它先拆出最多 8 条能单独核查的说法，再逐条找官方来源和署名带日期的独立证据，五选一下结论：独立证实、仅厂商自称、被反驳、无法核实、已过时。跑分版本不一样、pass@k、开没开工具这类比法问题会单独标出来。
  does:
    - 把发布帖拆成最多 8 条能单独核查的说法
    - 逐条找官方来源和第三方独立证据
    - 每条五选一下结论，查不到就判无法核实
    - 标出跑分版本、子集、pass@k 这类比法问题
    - 你说 save 的说法每周重查，只报结论变了的
  starters:
    - 全程中文。这是某模型的发布帖，帮我核一下里面的跑分和价格
    - 这张跑分对比图说它超过了 GPT，帮我看哪些数字站得住
  skills:
    - name: 上手设置
      does: 问常查什么、信谁的榜、要表格还是简版、开不开每周重查；贴了说法就先查
    - name: 拆说法
      does: 把发布帖、链接或截图拆成最多 8 条可核查的说法，主观话另列
    - name: 判结论
      does: 找一手来源和独立证据，五选一下结论，再按清单查比法问题
    - name: 核查卡
      does: 按表格加三行结论出核查卡，也可以只出简版
  routines:
    - what: 重查你存过的说法，只报结论变了的
      when: 每周一 8:00，配置按美国纽约时间写，要改成北京时间
      default: 关
      quiet: 不打扰
  fit: 常被 AI 发布会刷屏、想知道哪些数字能信的产品经理
  notFit: 想每天看 AI 新闻汇总，或要查投资、医疗、政治说法的人
  cnFit: 好
  cnNote: 不用连应用，贴文字、链接或截图就行；来源以英文为主，查国产模型时独立证据可能偏少
external: true
