# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: weight-coach
name: "减重教练"
tagline: "拍餐前照片估热量，按中国家常饮食帮你减重"
category: 生活
author:
  name: "Cola"
templateUrl: https://x.ai/bot/MgvqAC7RBf-gsvQl6Jw6n
templateVersion: 1
addedAt: 2026-11-15
prerequisites:
  - "无，发照片就行"
  - "一天固定提醒 5 次，不用的可以关"
  - "不是医生，不看诊"
quotaCost: 中
permissions:
  - 定时自动运行
pitch:
  - 饭前拍一张，我帮你估估热量。
  - 家常菜也能算，红烧肉我心里有数。
about:
  intro: 按米饭、面条、家常菜、外卖这些国内吃法估热量的减重教练。饭前发照片，它认出吃的、估热量，有营养标签就用标签值，没有就往高了估，你确认才记。三餐时间没记会短短催一句，记过就不出声；每天早上汇总昨天吃了多少、动了多少、缺口多大，再给当天的饮食建议。
  does:
    - 看饭前照片认食物、估热量，你确认才记
    - 有营养标签用标签值，没有就往高估
    - 三餐到点没记就催一句，记过不打扰
    - 每天早上算昨天的摄入、消耗和缺口
    - 教你用 iPhone 快捷指令把手表消耗传过来
  trial: |-
    我叫小林，女，28 岁，163 厘米，62 公斤，想三个月减到 56。平时久坐，每周跑两次步，没有 Apple Watch，时区北京。三餐提醒先不建，等我试完再说。
    今天中午吃了一份黄焖鸡米饭外卖，米饭吃了大半碗，还喝了一杯全糖奶茶。先帮我估一下热量，再说说今天晚饭怎么吃。
  starters:
    - 我 172 厘米、78 公斤，想三个月减到 70，先帮我设好
    - 这是我中午点的外卖，帮我估一下热量
  skills:
    - name: 上手设置
      does: 一次问一件事，问齐体重、目标、身高、活动量和提醒时间，再建好提醒
    - name: 手表接入
      does: 一步步教你用 iPhone 快捷指令把 Apple Watch 活动消耗发给它，每步等你截图
  routines:
    - what: 早餐没记就问一句吃了啥，记过就不出声
      when: 每天 7:45，北京时间
      default: 未说明
      quiet: 不打扰
    - what: 午餐没记就问一句吃了啥，记过就不出声
      when: 每天 11:47，北京时间
      default: 未说明
      quiet: 不打扰
    - what: 晚餐没记就问一句吃了啥，记过就不出声
      when: 每天 19:10，北京时间
      default: 未说明
      quiet: 不打扰
    - what: 汇总昨天的摄入、消耗和缺口，给当天饮食建议
      when: 每天 7:12，北京时间
      default: 未说明
      quiet: 照发
    - what: 早报补跑：主早报还没发就先发一份，已发就跳过
      when: 每天 7:05，北京时间
      default: 未说明
      quiet: 不打扰
    - what: 收到手表发来的当天活动消耗，记进消耗日志
      when: 快捷指令推送时，建议每晚 23:59
      default: 未说明
      quiet: 不打扰
  fit: 在国内吃家常菜和外卖、想认真记热量减重的人
  notFit: 有慢性病要医生指导的人，或嫌一天被提醒 5 次太烦的人
  cnFit: 好
  cnNote: 配置是中文写的，时区默认北京时间；不连任何账号，Apple Watch 只是可选项
external: true
