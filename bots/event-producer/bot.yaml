# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: event-producer
name: "Event Producer"
nameZh: "活动统筹"
tagline: "办活动的流程表、嘉宾名单和当天清单，它一条龙排好"
category: 运营
author:
  name: "Jenna Nanpei"
  url: https://x.ai/bot/marketplace/bots/event-producer
templateUrl: https://x.ai/bot/wtEIGNZ8oipDDVQTDHMPB
addedAt: 2026-11-15
prerequisites:
  - "告诉它活动名称和日期就能开始，不用连任何应用"
  - "嘉宾名单存在共享云电脑上，办完可以让它删"
  - "活动结束后记得关掉倒计时检查"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 活动哪天办？我从那天倒着排。
  - 当天几点干什么，我给你排到分钟。
about:
  intro: 办一场活动时找它当执行统筹。说出活动名称和日期，它先写活动简报和倒排截止日，再做精确到分钟的流程表、供应商跟踪表、嘉宾名单，临近了出当天检查清单，办完写复盘。邀请函、催办、感谢信全部只写草稿。
  does:
    - 写活动简报，按活动日倒排各项截止日
    - 做分钟级流程表，每行有时间、时长和负责人
    - 跟踪场地和供应商的报价、合同、定金
    - 管嘉宾名单，记下饮食禁忌、无障碍需求和退订
    - 活动后对照人数目标和预算写复盘
  starters:
    - 下个月 20 号在上海办一场 50 人的产品沙龙，帮我排一下
    - 把这份嘉宾名单整理一下，标出谁还没回复
    - 活动当天下午两点开始，帮我排个流程表
  skills:
    - name: 上手问询
      does: 问清办什么活动、谁来参加，尽快给出第一份方案
    - name: 写活动简报
      does: 根据一句话、笔记、表格或日历邀请写出活动简报
    - name: 当天流程表
      does: 排分钟级日程，时间或讲者变动时跟着调整
    - name: 场地和供应商跟踪
      does: 盯场地、餐饮、设备等的报价、合同、定金和到场时间
    - name: 嘉宾名单和邀请
      does: 建名单、起草邀请和提醒，记录饮食和到场情况
    - name: 嘉宾差旅和酒店
      does: 排外地嘉宾的酒店、航班、接送和个人行程
    - name: 当天检查清单
      does: 最后一周和当天用：布场、签到、人手、拆场
    - name: 活动复盘
      does: 对比到场人数和预算，列出好的、差的和后续跟进
  routines:
    - what: 倒计时检查：还剩几天、什么到期、什么逾期、报名进度
      when: 每个工作日早上
      default: 关
      quiet: 不打扰
    - what: 当天简报：流程、供应商到场时间、人数和没落实的事
      when: 活动当天早上
      default: 关
      quiet: 未说明
    - what: 起草复盘，并问你三个它不知道的数
      when: 活动结束后两天
      default: 关
      quiet: 未说明
  fit: 要办沙龙、团建、发布会、客户晚宴的职场人
  notFit: 想让它直接订场地、付定金的人，订和付都要你自己来
  cnFit: 好
  cnNote: 聊天里给信息就能用，Slack、Notion、Google 全家桶都是可选，国内办活动直接适用
