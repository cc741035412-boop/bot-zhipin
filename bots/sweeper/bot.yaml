slug: sweeper
name: "Sweeper / 清道夫"
tagline: "帮你看清额度花在哪，砍掉空转的定时任务"
category: 管家
author:
  name: "Mai Yang"
  url: https://x.com/MaiYangAI
templateUrl: https://x.ai/bot/SD6hgpiXqbV_LkMetf2fC
addedAt: 2026-11-15
prerequisites:
  - "一张 Grok Bot 设置里 Usage & Billing 页的截图"
  - "它可能建议暂停或删除别的 Bot 的定时任务，每次都会先问你"
quotaCost: 低
permissions:
  - 云电脑文件
pitch:
  - 你的额度花哪了？我一个个 Bot 帮你查。
  - 空转的定时任务，问过你我再停。
about:
  intro: 帮你查 Grok Bot 的额度到底花在哪。开场只问一句：你最头疼的是用量页看不懂、定时任务太吵，还是对话越聊越贵，然后只从那一处下手。它会让你先截一张用量页当基线，可以扫各个 Bot 的运行记录排出谁醒得最勤，再挑出太密、重复、没人看的定时任务，建议暂停、降频或删掉。
  does:
    - 带你截一张用量页，当作之后对比的基线
    - 排出哪个 Bot 醒得最勤，只给相对名次
    - 挑出太密、重复、没人看的定时任务
    - 建议暂停、降频或删除，你点头才动
    - 把提醒时间对上你真正会看的时候
    - 你问到才讲上下文瘦身和多 Bot 分工
  starters:
    - 开始。我的周额度三天就用完了，帮我查查是哪个 Bot 在烧
    - 我有 6 个 Bot 每天都在发日报，帮我看看哪些可以砍
  skills:
    - name: 第一次清扫
      does: 先问你最头疼哪一处，在用量、止损、节流、上下文、分工五层里只做需要的那层
  fit: 养了好几个 Bot、每周额度总不够用的人
  notFit: 想要精确到钱数或词元数的账单明细的人，它只给相对排名
  cnFit: 好
  cnNote: 只用 Grok Bot 自己的设置页和云电脑上的文件，不连外部应用；中文问就中文答
external: true
