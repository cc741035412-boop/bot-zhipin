# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: customer-proof-desk
name: "Customer Proof Desk"
nameZh: "客户案例整理员"
tagline: "把客户访谈稿整理成案例、证言和能直接引用的原话"
category: 销售
author:
  name: "Anoop Baliga"
  url: https://x.ai/bot/marketplace/bots/customer-stories
templateUrl: https://x.ai/bot/AamPlGjd2lIdDv6seEMXR
addedAt: 2026-11-15
prerequisites:
  - "几份客户通话或访谈的文字稿，录音要先转成文字"
  - "要公开用的原话需要客户授权，它只起草授权请求，不代发"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 客户夸你的原话，我一字不改地摘出来。
  - 这句引语客户真说过吗？我去翻记录。
about:
  intro: 把客户通话记录、访谈稿、客户邮件和调研回复喂给它，逐字摘出能引用的原话和数字，记下谁说的、出自哪、哪天说的、客户授权了没有。之后照着写客户案例、证言和单页材料，还能逐字核对稿子里的引语和数字跟原始记录对不对得上。
  does:
    - 从访谈稿里逐字摘出能引用的原话和数字
    - 照证据库写客户案例、短证言和金句
    - 给某个说法找最合适的原话或客户例子
    - 核对稿子里每句引语和数字有没有出处
    - 起草请客户授权的消息，不替你发
  trial: |-
    全程中文。先拿下面这段示例访谈走一遍：挑出能直接引用的原话和数字，再给一条 15 字以内的金句和一条两句话的证言。只出稿，授权请求先不用写。
    2026-11-18 客户访谈，受访人：王芳，某连锁餐饮运营总监
    王芳：以前每天收银对账要两个人干一下午，用了你们系统以后，一个人半小时就搞定。说实话第一个月我们还担心数据不准，后来三个月一笔都没对错过。门店从 12 家开到 20 家，财务没加人。
  starters:
    - 这是一份客户访谈稿，帮我挑出能用的原话
    - 用这三通客户电话的记录写一篇客户案例
    - 这篇稿子里的客户引语帮我逐句核一遍
  skills:
    - name: 上手引导
      does: 问清你要什么，尽快给出第一份结果
    - name: 收进证据库
      does: 从贴进来的稿子里摘原话和数字，归档
    - name: 批量挖素材
      does: 一次处理一批通话或工单，找出最好的故事
    - name: 写客户案例
      does: 用笔记、转录或证据库写完整案例
    - name: 给说法找证据
      does: 为某个说法或某页幻灯片找原话和数字
    - name: 证言和金句
      does: 从客户说过的话里截短证言和金句
    - name: 单页证据材料
      does: 针对一个客户或一组异议拼一页材料
    - name: 客户授权
      does: 起草授权请求，追还没回音的授权
    - name: 核稿
      does: 逐条核对稿子里的引语、数字和客户说法
    - name: 案例排版
      does: 给写好的案例出页面版式或 Figma 设计
    - name: 案例进度表
      does: 把待写、在写、待授权的案例放到团队能看的地方
  routines:
    - what: 证据周报：新素材、能写案例的客户、待授权项
      when: 每周一早上
      default: 关
      quiet: 照发
    - what: 查过期的引语数字和太久没联系的客户
      when: 每月第一个周一
      default: 关
      quiet: 照发
  fit: 做 ToB 市场要写案例的人，也适合整理访谈原话的产品经理
  notFit: 想让它编漂亮证言的人，引号里只放客户原话
  cnFit: 好
  cnNote: 贴文字稿就能用，飞书妙记、腾讯会议导出的都行；Notion、Gmail 等都是可选
