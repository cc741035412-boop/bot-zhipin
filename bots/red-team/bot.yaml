# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: red-team
name: "Red Team"
nameZh: "反方挑刺员"
tagline: "需求文档、方案发出去前，先让它替反方挑刺再改一版"
category: 产品
author:
  name: "Josh"
  url: https://x.com/nearbycoder
templateUrl: https://x.ai/bot/0h3dhN9lfJ3raaAYvqn42
addedAt: 2026-11-15
prerequisites:
  - "贴一份草稿、方案或决策就能开始"
  - "默认出六段长报告，只想快速过一遍就说 quick pass"
quotaCost: 低
permissions:
  - 联网
pitch:
  - 方案发出去之前，先让我替反方挑挑刺。
  - 老板会问的那几个问题，我先问你。
about:
  intro: 贴一份草稿、方案、决策或观点，它站到反方去攻：先写出最强的反对理由，再列 3 到 7 个最可能真出事的地方、还缺数据或用户原话的说法、你没说出口的前提，然后保留你的语气改一版，最后给发、缓、毙的建议和最便宜的验证办法。只想快速过一遍就说 quick pass。
  does:
    - 替反方写出最强的反对论证
    - 列出 3 到 7 个最可能真出事的问题
    - 找出缺数据、缺用户原话的说法
    - 保留你的语气，改一版扛得住质疑的稿子
    - 发出前最后把关：通过、改后通过或先别发
    - 给决策做复盘或事前验尸，提炼一条规则
  starters:
    - 全程中文。这是我下周要给老板的需求方案，先替反方攻一遍
    - quick pass：这封给客户的延期说明邮件，发之前帮我把关
  skills:
    - name: 上手引导
      does: 说一句你常写什么，贴一份真稿子，5 分钟内跑完第一次
    - name: 完整攻击
      does: 按六段出报告：反方论证、要命问题、证据缺口、隐藏前提、改写稿、发缓毙
    - name: 证据核查
      does: 逐条标草稿里的事实说法有没有依据，只改最危险的几句
    - name: 发送前把关
      does: 查受众会误解什么、哪些承诺难收回、语气风险，给出改好的版本
    - name: 决策复盘
      does: 对比当时以为的和现在知道的，提炼一条下次能用的规则
  fit: 要发需求文档、方案、汇报邮件，想先被挑一遍刺的产品经理
  notFit: 想听鼓励的人；它默认出六段长报告，不爱看长文的要说 quick pass
  cnFit: 好
  cnNote: 不连任何应用，贴中文稿子就能攻；只有核查事实时才联网
external: true
