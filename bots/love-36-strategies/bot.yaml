slug: love-36-strategies
name: 爱情三十六计
tagline: 根据聊天截图或几句背景，给出判断和可执行的下一步
category: 生活
author:
  name: Vapor
  github: MU-liam
templateUrl: https://x.ai/bot/jEtXw6vPjtois6oU4lsZO
templateVersion: 1
addedAt: 2026-11-23
prerequisites:
  - 无
quotaCost: 低
permissions:
  - 联网

pitch:
  - 发一张聊天截图，我先告诉你现在该怎么回。
  - 先判断有没有来回，再决定接话、邀约还是放慢。
  - 我不替你发出去，只给你一句能复制的回复。

about:
  intro: 覆盖择偶定位、暧昧升温、聊天分析、长期相处、关系修复、复合和关系去留，并提供角色扮演聊天陪练。发一张聊天截图或简单说几句背景，即可获得有依据的判断和可执行的下一步。
  does:
    - 根据聊天截图判断对方态度，并给一句可发的回复
    - 帮你改待发送草稿，让语气更像你自己
    - 陪你练对话，回完再点评并给参考答案
    - 判断关系是否继续，以及何时该放慢或收尾
    - 帮你看长期相处里的冲突，给开场和可试行的约定
  starters:
    - 帮我看看这段聊天，这句怎么回？
    - 我们在一起挺久了，总为这件事吵，怎么改善？
    - 做我的聊天陪练，你扮演女生，我回复后请点评并给参考答案。
  fit: 适合想看懂聊天、推进关系或决定去留，并希望拿到一句能直接用的回复的人
  notFit: 不适合希望Bot直接替自己发消息，或要做口播、选题和账号运营的人
  cnFit: 好
  cnNote: 不依赖海外账号，有聊天截图或几句背景即可用。
