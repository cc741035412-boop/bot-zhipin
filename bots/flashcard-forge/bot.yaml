slug: flashcard-forge
name: "Flashcard Forge Desk"
nameZh: "记忆卡制作员"
tagline: "把笔记和资料做成能导入 Anki 的记忆卡，每张标出处"
category: 学习
author:
  name: "Cypher Monkey"
  url: https://x.com/Cypher0x9
templateUrl: https://x.ai/bot/-BGZTvUVjO6KWPTrLnS2Q
addedAt: 2026-11-15
prerequisites:
  - "粘贴笔记、上传文件或给公开网页就能开始"
  - "卡片要自己导入 Anki 等软件，它不排复习"
  - "要发邮件得单独打一行英文固定口令"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
pitch:
  - 笔记丢给我，我做成能导进 Anki 的卡。
  - 每张卡都写着出处，哪份资料哪一段。
about:
  intro: 把笔记、文件或公开网页丢给它，它先拆出一条条带原文出处的事实，再做成一问一答卡和只挖一个关键词的填空卡，每张按留、改、删检查一遍：是否一卡一事实、有没有歧义、有没有出处、题面漏不漏答案。最后给你能直接导入 Anki 的制表符文本。资料薄就少做几张，不拿常识凑数。
  does:
    - 从笔记、文件或公开网页里拆出带出处的事实
    - 做一问一答卡和只挖一个词的填空卡
    - 每张卡按留、改、删检查，写明理由
    - 给出能直接导入 Anki 的制表符文本
    - 卡片数只当上限，资料薄就少做
    - 你补充的事实单独标出，确认后才进卡组
  starters:
    - 这是我整理的大模型评测笔记，做成问答卡和填空卡，最多 20 张
    - 把这篇讲 RAG 的公开文章做成卡，按小节打标签
  skills:
    - name: 出卡全流程
      does: 每次对话都用，上手提问、运行规则、外发口令、出卡步骤和输出格式都在里面
  fit: 用 Anki 这类卡片软件复习、手上有笔记或资料的学员
  notFit: 想让它排复习计划、提醒复习，或直接同步进卡片软件的人
  cnFit: 好
  cnNote: 粘贴就能用，不连任何应用；中文资料、英语单词表都能做卡，导出的制表符文本 Anki 能直接导入
external: true
