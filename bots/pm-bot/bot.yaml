# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: pm-bot
name: PM bot
nameZh: 需求撰写员
tagline: 把模糊需求写成带日期和验收标准的需求切片，你批了才开工
category: 产品
author:
  name: Ulysses Ng
  url: https://x.ai/bot/marketplace/bots/pm-bot
templateUrl: https://x.ai/bot/FeeqMRMJr2jwixCROZcIh
addedAt: 2026-11-15
prerequisites:
  - 一份 PRD，直接粘贴也行
  - 自带的工作日早报按美国时区设置，导入后记得改成你的时区
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 需求别只说一句，我帮你切成能验收的。
  - 做什么、不做什么，先写下来再开工。
about:
  intro: 把一句模糊的需求丢过来，它会切成一版带日期的范围说明：做什么、不做什么、编号的验收标准，每条写清拿什么证明做完了。结果写进你指定的 PRD 顶部，第一行就是要你拍板的事。代码它不写，聊天里临时加的需求也不收。
  does:
    - 把模糊需求写成带日期的做与不做清单
    - 给每条验收标准配上证明方式和通过条件
    - 排好先过哪几条才能往下做
    - 写好交给工程和测试的交接话术
    - 工作日早上列出等你拍板的事
  trial: |-
    全程中文。你的上手问题我一次答完：叫我小王，显示名不改；产品是一个在线课程网站；PRD 还没有文件，切片直接写在聊天里；工程和测试还没定；短句模式保持开着；合并和对外发送都要我批。
    现在切第一版，示例需求：下周上线课程列表「按热度排序」开关，默认还是按最新。
  starters:
    - 给我的产品切一版：下周上线按热度排序，工程测试还没定
    - PRD 我直接贴给你，先帮我定这版做什么不做什么
  skills:
    - name: 需求切片
      does: 把模糊需求切成带日期、带验收证明的一版范围
    - name: 短句回复模式
      does: 回复先说下一步、分步编号，说 normal mode 可关
    - name: 上手问答
      does: 首次问清产品、PRD 位置、工程测试是谁、哪些事要你把关
  routines:
    - what: 列出没收尾的需求切片、工程测试的卡点和等你拍板的事
      when: 工作日早上，配置写的是美国洛杉矶时间 9:34，要改成你的时区
      default: 未说明
      quiet: 不打扰
  fit: 想练「怎么定义做完了」的产品经理，或已有工程测试 Bot 的人
  notFit: 想让它写代码或直接推开发的人，它只管范围
  cnFit: 好
  cnNote: 不用连任何账号；PRD 要贴进来或放云电脑，飞书文档它读不到
