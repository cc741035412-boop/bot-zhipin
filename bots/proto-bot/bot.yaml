# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: proto-bot
name: "Proto Bot"
tagline: "把产品点子做成你真实应用里能点的原型，以草稿 PR 交付"
category: 产品
author:
  name: "Shub Gaur"
  url: https://x.ai/bot/marketplace/bots/proto-bot
templateUrl: https://x.ai/bot/p4sSEZV7xqcBgdT7m2O8i
addedAt: 2026-11-15
prerequisites:
  - "一个 GitHub 仓库和能打开的预览网址"
  - "会花真钱：Cursor 云端构建和出图出视频都从你自己的账户扣，花费上限只是口头约定"
  - "参考截图会变成公开链接，没发布的产品截图别用"
  - "要在共享云电脑的浏览器里登录你的预览站，最好给测试账号"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
  - 外部账号
  - 浏览器 Cookie
external: true
pitch:
  - 光说没感觉，我直接做个能点的给你看。
  - 原型给你开成草稿 PR，合不合你说了算。
about:
  intro: 把产品点子、需求或一段讨论交给它，它先读你的 GitHub 仓库和应用画出界面地图，写好简报，再派 Cursor 云端 agent 在你的仓库里开草稿 PR。做完按点击路径截图、录一段短视频交给你。合并、发布、分享都要你点头。
  does:
    - 读你的仓库和应用，整理一份界面地图
    - 把点子写成简报，派云端 agent 开草稿 PR
    - 按点击路径截图、录短视频打包交付
    - 照真实界面画 Figma 稿和演示稿
    - 用你自己的密钥出图、做表情包和短视频
  starters:
    - 帮我把这个点子做成原型：首页加一个按热度排序的开关
    - 先帮我连上 GitHub，选好要做原型的仓库
  skills:
    - name: 首次设置
      does: 装脚本、连 GitHub、选仓库和应用、定花费上限
    - name: 连接管理
      does: 接 GitHub、云端构建、生图密钥和 Figma
    - name: 读代码库
      does: 把仓库和应用读成界面地图，过期或换仓库就重读
    - name: 原型构建
      does: 写简报、派云端 agent 开草稿 PR，收回截图和视频
    - name: Figma 出稿
      does: 照真实界面画屏幕、流程和演示稿，也能评审设计
    - name: 出图出视频
      does: 用你的生图密钥出图、配音、做短视频
    - name: 工艺调研
      does: 在 X 和网上查新技巧、新模型，存成一份手册
    - name: 收尾交付
      does: 打包成果、交接给队友，起草分享稿等你同意
    - name: 辅助脚本
      does: 首次设置时装好的 proto.py 脚本本体，不用你碰
  routines:
    - what: 汇报做完的构建和出图结果，把排队的点子写成简报等你点头
      when: 工作日早上 9 点，配置没写时区，开之前要确认
      default: 关
      quiet: 不打扰
    - what: 找你指定手艺的新模型、新技巧，最多 5 条带链接
      when: 每周一上午 10 点
      default: 关
      quiet: 不打扰
  fit: 有 GitHub 仓库和 Cursor、想把点子做成真原型的产品经理
  notFit: 没有代码仓库，或不想为云端构建和生图付钱的人
  cnFit: 一般
  cnNote: 核心要 GitHub 加付费 Cursor，生图要海外密钥；都不连只剩截图评审和网上调研
