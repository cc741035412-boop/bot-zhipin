# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: account-research
name: "Account Research"
tagline: "见客户前帮你把这家公司查清楚，写好简报和客户计划"
category: 销售
author:
  name: "Anoop Baliga"
  url: https://x.ai/bot/marketplace/bots/account-book
templateUrl: https://x.ai/bot/O3iqVd_ZrdRtrDJpxcKss
addedAt: 2026-11-15
prerequisites:
  - "要跟的公司名单，再说清你卖什么、卖给谁"
  - "想自动备会要连 Google 日历，或者每天贴日程"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 明天见客户？这家公司我今晚帮你查清楚。
  - 谁会来开会、谁说了算，我给你画张图。
about:
  intro: 给它要跟的公司名单，再说清你卖什么。每家公司会从公开网页查一遍：在做什么、多大、近 90 天有什么变化、用了谁家的工具、谁会来开会，再混上你贴的笔记，写成见面前一屏看完的简报、干系人地图和客户计划。网上查来的每条都带链接和日期，你的笔记单独标出。
  does:
    - 见客户前写一屏看完的公司简报
    - 画干系人地图，标出谁拍板、谁可能挡路
    - 查对方现在用谁家的，还有哪些竞品在场
    - 理出通话后没落地的事，标清在等谁
    - 写赢单或扩单用的客户计划
  starters:
    - 我明天要见一家物流公司，帮我出一份见面前的简报
    - 这是我这季度要跟的 8 家公司，先建个名单
    - 这是今天的会议笔记，帮我理理还有哪些事没落地
  skills:
    - name: 上手引导
      does: 问清你想要什么，尽快给出第一份结果
    - name: 建客户名单
      does: 记下你负责的公司，可增删可查看
    - name: 会前简报
      does: 要见某家公司前，出一份简报
    - name: 一周备会
      does: 按你贴的日程备好这周的外部会议
    - name: 干系人地图
      does: 理清该找谁、谁拍板、新冒出来的人是谁
    - name: 现有供应商和竞品
      does: 查对方在用什么、谁也在抢、怎么站位
    - name: 客户动态
      does: 查一家公司最近有什么新消息
    - name: 待办和下一步
      does: 从笔记或邮件里理出没落地的事
    - name: 使用情况和健康度
      does: 续约或季度复盘前，看客户实际用得怎样
    - name: 联系和跟进草稿
      does: 写第一封联系信、会后跟进或催一下
    - name: 客户计划
      does: 写赢单、扩单或给经理过的季度计划
  routines:
    - what: 查名单上各家公司的公开动态
      when: 每周一早上
      default: 关
      quiet: 照发
    - what: 备好当天的外部会议
      when: 工作日早上
      default: 关
      quiet: 不打扰
    - what: 盘点各家的待跟进事项
      when: 每周五早上
      default: 关
      quiet: 照发
  fit: 见客户前要做功课的 B2B 销售和客户经理
  notFit: 想找新客户名单的人，它不建潜客名单，也不代发邮件
  cnFit: 好
  cnNote: 靠公开网页和你贴的笔记就能用；查国内公司能搜到多少，看联网搜索的覆盖
