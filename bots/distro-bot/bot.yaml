# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: distro-bot
name: "Distro Bot"
nameZh: "增长操盘手"
tagline: "给出海产品做增长：盯投放、出素材、追热点、写开发信"
category: 市场
author:
  name: "Shub Gaur"
  url: https://x.ai/bot/marketplace/bots/distro-bot
templateUrl: https://x.ai/bot/XbN6iofs_Qjsi2Od1yjyI
addedAt: 2026-11-15
prerequisites:
  - "要有在投的海外广告账户（Meta、Google、X 等）才用得上核心功能；没有也能先贴官网做定位和竞品分析"
  - "自动驾驶先别开：开了它会不逐条问你就暂停、上新广告、调受众。设置时选每次都问"
  - "设置时会问每月花费上限，不设就不改任何花费"
  - "出图出视频用你自己的 FAL、Higgsfield 或 xAI 付费密钥，单次 2 美元以内不问，没有累计上限"
  - "没有连接器时要在共享浏览器里登录广告后台，能花钱的登录态同账号其他 Bot 也能用；线索和投放数据明文存在共享的 /workspace/distro-bot"
  - "4 个定时任务导入后全关；连 X 后每次读取扣你的 X API 额度"
quotaCost: 高
permissions:
  - 云电脑文件
  - 浏览器 Cookie
  - 外部账号
  - 联网
  - 定时自动运行
  - 代我发消息
external: true
pitch:
  - 广告数据我天天盯，动预算前一定先问你。
  - 开发信有人回了，我马上转给销售。
about:
  intro: 给已经在投海外广告的产品当增长操盘手。它读广告账户的数据找异常，每个活动一次只改一处；写广告文案，用你的密钥出图出视频；从 X、Hacker News、Reddit 找值得蹭的热点并起草帖子；再在 Gmail 里写开发信。花钱、发帖、发信都要你点头，有人回复就转给销售。
  does:
    - 读广告账户数据，算节奏、找异常、比广告
    - 每个活动一次只提一处改动，附撤销办法
    - 写广告文案，用你的密钥出图出视频
    - 找 48 小时内值得蹭的热点，配好帖子草稿
    - 起草开发信，你批过的那一批才发
    - 有人回复，马上把线索转给销售
  trial: |-
    全程中文。just go，设置全用默认，自动驾驶关，先不连任何账户，也不出图。拿 Plaud 当示例走一遍：官网 https://www.plaud.ai ，读完用两行说它卖什么、卖给谁，再写一句英文定位和 3 条英文 Meta 广告文案草稿。只出稿，不要发布。
  starters:
    - 先带我把设置走一遍，官网链接我贴在下面
    - 看看我的广告这周花得值不值，哪个该停
    - 这两天有什么热点值得蹭，各配一条帖子草稿
  skills:
    - name: 首次设置
      does: 第一次对话装好脚本、连账户、定花费上限，中途停了能接着来
    - name: 广告账户
      does: 通过连接器、浏览器或导出表读写广告账户
    - name: 投放循环
      does: 盯活动、跑一轮测改、排上线计划、撤销改动
    - name: 广告素材
      does: 写文案，用你的密钥出图和视频，先报价
    - name: 市场扫描
      does: 找热点、看竞品动作和趋势、理定位
    - name: 外联
      does: 拉名单、写开发信、收回复、转给销售
  routines:
    - what: 看各活动的数据、节奏和异常，跑一步优化
      when: 每天 8:25
      default: 关
      quiet: 不打扰
    - what: 挑值得蹭的热点，各配一条帖子草稿
      when: 工作日 9:35
      default: 关
      quiet: 不打扰
    - what: 收开发信回复转给销售，起草跟进
      when: 工作日 11:15 和 16:15
      default: 关
      quiet: 不打扰
    - what: 各渠道周报、竞品动作和本周测试
      when: 每周一 8:45
      default: 关
      quiet: 照发
  fit: 已经在投 Meta、Google、X 广告的出海产品团队
  notFit: 只做抖音、小红书、巨量引擎投放的国内团队
  cnFit: 一般
  cnNote: 不连账号也能贴官网做定位、看竞品落地页、写英文帖子和广告文案
