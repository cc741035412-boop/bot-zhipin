# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: clip-bot
name: "Clip Bot"
tagline: "把长视频里最值得看的片段剪成带字幕的短片"
category: 内容
author:
  name: "This Week in AI"
  url: https://x.ai/bot/marketplace/bots/clip-bot
templateUrl: https://x.ai/bot/-L1yFJ5mtwPgn3O_iYUo_
addedAt: 2026-11-15
prerequisites:
  - "要剪的录音或视频，上传最稳，公开链接也行"
  - "剪别人的视频先确认版权"
  - "长视频的转写和渲染比较费额度"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 一小时的播客，哪几段值得剪，我先挑好。
  - 你点哪段我剪哪段，字幕一起烧好。
about:
  intro: 丢给它一段长录音或录像，先出带时间戳和说话人的逐字稿，再挑出值得剪的段落，按强、可剪、跳过打分。你点哪段，就剪成 20 到 90 秒的竖屏短片，字幕逐字烧进画面，另附字幕文件。适合讲座、播客、访谈切片，挑段落这一步替你做了。
  does:
    - 把长录音转成带时间戳和说话人的逐字稿
    - 挑出有观点、有数字、有转折的段落并打分
    - 把选中的段落剪成带烧录字幕的竖屏短片
    - 一次从一期节目里批量出好几条切片
    - 给切片写标题和各平台配文
  starters:
    - 我传一期播客，帮我找出最值得剪的五段
    - 把 12:30 到 13:40 这段剪成竖屏短片，加字幕
  skills:
    - name: 上手引导
      does: 问清你录什么、想剪什么，带你拿到第一份逐字稿或切片
    - name: 转写录音
      does: 把上传、链接或音频转成带时间戳的逐字稿
    - name: 找可剪段落
      does: 读逐字稿，挑出值得剪成短片的地方
    - name: 剪一条切片
      does: 按你选的段落或时间段出带字幕的短片文件
    - name: 整期打包
      does: 一次从一场演讲或一期节目里剪出多条
    - name: 配文和标题
      does: 给要发的切片写标题、字幕文案和帖子正文
  routines:
    - what: 转写剪辑队列里的新录音，列出值得剪的段落
      when: 每个工作日早上
      default: 关
      quiet: 不打扰
    - what: 本周剪了什么、还有哪些好段落没剪、下周先剪哪三条
      when: 每周五
      default: 关
      quiet: 照发
  fit: 做播客、讲座、直播回放，想切短视频的人
  notFit: 要从零拍摄、写脚本或做多轨精剪的人
  cnFit: 好
  cnNote: 上传就能用，Slack、Notion 都可不连；B 站、抖音链接不一定拉得下来，上传最稳
