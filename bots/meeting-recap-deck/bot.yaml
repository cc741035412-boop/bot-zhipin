# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: meeting-recap-deck
name: "Meeting Recap Deck"
tagline: "贴会议笔记，按你的 PPT 模板出一份会后回顾"
category: 运营
author:
  name: "Krista Letz"
  url: https://x.ai/bot/marketplace/bots/echo
templateUrl: https://x.ai/bot/YklttiPpAHweKbOLV1TSF
addedAt: 2026-11-15
prerequisites:
  - "会议笔记或转写，粘贴或上传都行"
  - "可选：一份你常用的 PPT 模板"
  - "会后自动起草要连日历和笔记来源，开了以后工作时段每小时检查一次"
quotaCost: 中
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 会开完了，回顾 PPT 我照你的模板做。
  - 谁答应了哪天交什么，我都写进去。
about:
  intro: 开完会把笔记或转写贴给它，它照你的 PPT 模板做一份给对方看的会后回顾：对方原话、双方下一步（谁、哪天）、反复出现的话题。先在聊天里给每页的文字，你看过再出文件。没有模板就出一封邮件版回顾。
  does:
    - 照你的幻灯片模板做会后回顾
    - 引用对方原话，列出双方的下一步、负责人和日期
    - 笔记里缺负责人或日期就标出来，不替你补
    - 没模板时改出邮件或文档版回顾
    - 汇总同一家客户几次会议的共同话题
  starters:
    - 这是刚才和客户开会的笔记，帮我出一份会后回顾
    - 我们的 PPT 模板长这样，以后回顾都照这个做
    - 来不及做 PPT 了，给我一封能直接发的回顾邮件
  skills:
    - name: 上手问询
      does: 问清你的模板、读者和习惯，尽快出第一份回顾
    - name: 读懂模板
      does: 照你给的模板学版式，换模板时重新学
    - name: 做回顾 PPT
      does: 根据笔记、转写或录音摘要做回顾
    - name: 改单页
      does: 改错、补会后才定下的承诺，或开会中途更新
    - name: 不做 PPT 的回顾
      does: 出邮件或文档版，十分钟内能发出去
    - name: 发出定稿
      does: 你确认定稿后再发到频道、邮件或存档
    - name: 下一步转任务
      does: 把回顾里的下一步变成工单或任务清单
    - name: 跨会议主题
      does: 汇总多次会议的话题，看同一件事怎么变化
  routines:
    - what: 有外部参会人的会刚结束，就根据笔记起草回顾放在聊天里
      when: 工作日上班时段每小时查一次
      default: 关
      quiet: 不打扰
    - what: 本周已发、还没发的回顾，以及过期的下一步
      when: 每周五下午
      default: 关
      quiet: 照发
  fit: 经常和客户、合作方开会，会后要发纪要的产品、销售、项目经理
  notFit: 只要内部会议的待办清单，用不着给对方看的版本
  cnFit: 好
  cnNote: 贴笔记就能用，模板给截图也行；Google Slides、Figma、Gmail 都可不连
