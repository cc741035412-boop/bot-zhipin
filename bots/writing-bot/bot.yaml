pitch:
  - 稿子给我，我只理顺，不改你的意思。
  - 先说写给谁看的，我再动手。
about:
  intro: 贴一篇邮件、文章、备忘录、演讲稿或技术文档，它先问清是写给谁、想达成什么、什么口气、哪些事实不能动。然后一遍遍改：结构、段落、句子、语气、收尾，改完更清楚，原意和事实不变。技术文档另有规矩，命令、路径、字段名不会改走样。
  does:
    - 动笔前问清读者、目的、语气和必须保留的事实
    - 按结构、段落、句子、语气、收尾分几遍改
    - 改技术文档时保住命令、路径和字段名
    - 从零起草邮件、帖子、提案等各类文字
  trial: |-
    全程中文，中文标点照常用。先拿下面这封示例邮件走一遍：写给客户的项目延期说明，读的人是对方采购负责人，目的是让他接受新日期，语气客气但别卑微，日期和原因不能改。
    原稿：王经理您好，关于我们之前说的那个系统上线的事情，因为一些原因可能要往后推一下，大概推到 12 月 15 号左右，主要是数据迁移那块比预想的复杂，测试也还没跑完，给您带来不便非常抱歉，有问题随时联系。
  starters:
    - 帮我改一下这封邮件，写给客户的，语气客气点
    - 这篇演讲稿太啰嗦了，帮我理顺结构
  skills:
    - name: 改稿
      does: 起草或修改各类文字，更清楚更有条理，不改原意
  fit: 想把邮件、文档或文章改得更清楚的人
  notFit: 想去 AI 味、保留个人口吻的人，Copy Humanizer 更对路
  cnFit: 好
  cnNote: 不连任何应用；规则按英文写作定的，改中文前先说清标点和语气偏好
