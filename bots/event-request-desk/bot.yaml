# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: event-request-desk
name: "Event Request Desk"
tagline: "给活动、赞助和演讲邀约打分，起草答应或婉拒的回复"
category: 运营
author:
  name: "Emma Weyrauch"
  url: https://x.ai/bot/marketplace/bots/event-request-desk
templateUrl: https://x.ai/bot/hp7QlVUPuYUp09kc6IFAA
addedAt: 2026-11-15
prerequisites:
  - "最近收到的几条邀约，粘贴、转发或截图都行"
  - "先说清你的取舍标准和单场花费上限，不说就用默认的 5 项打分"
  - "它不会主动告诉你文件存在哪，想留底就让它把队列导出给你"
quotaCost: 中
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 又有人请你去演讲？先让我打个分。
  - 不想去的，婉拒信我替你写好。
about:
  intro: 专门处理找上门的活动邀请、赞助、演讲和展位请求。每条记进队列，按受众、契合度、成本、时机、关系五项各打 0 到 3 分，建议答应、拒绝、以后再说或先问清楚，再起草回复。答应之后还会倒排要交给主办方的材料并盯着。
  does:
    - 把散在各处的邀约记成一张队列
    - 按五项标准打分，给出答应或婉拒的建议
    - 起草答应、婉拒、改期、追问四种回复
    - 答应后列出欠主办方的材料并倒排截止日
    - 按季度算活动花费和答应率
  starters:
    - 这是这周收到的三个演讲邀请，帮我打个分看去哪个
    - 我们单场赞助上限是两万，帮我按这个改一下打分规则
    - 答应了下月那个行业峰会，现在还欠人家什么？
  skills:
    - name: 上手问询
      does: 问清你收哪类邀约、取舍标准，尽快给出第一条结果
    - name: 记录新邀约
      does: 把粘贴、转发或一批邀约记进队列
    - name: 给邀约打分
      does: 按打分规则判断，建议答应、拒绝、以后再说或缺信息
    - name: 调整打分规则
      does: 改规则，或在你和它判断不一致时重新对一遍
    - name: 起草回复
      does: 按你的决定写回复，或向主办方追问缺的信息
    - name: 答应后的交付跟踪
      does: 列出欠主办方的东西、谁负责、哪些逾期
    - name: 花费和答应率
      does: 统计活动花费、答应了哪些，对照上限和预算
    - name: 队列回顾
      does: 看哪些要决定、哪些放久了、哪些已经答应
  routines:
    - what: 扫收件来源，记下新邀约并打分，点出今天要拍板的
      when: 每个工作日早上，几点由你定
      default: 关
      quiet: 不打扰
    - what: 整个队列回顾：待决定、放久了、已答应
      when: 每周一早上
      default: 关
      quiet: 照发
    - what: 查已答应的活动还欠主办方什么，逾期的排前面
      when: 每周四早上
      default: 关
      quiet: 不打扰
  fit: 邀约多到回不过来的市场、品牌、BD 和创始人
  notFit: 一个月才收到一两个邀请的人，用不上这套打分
  cnFit: 好
  cnNote: 连接全是可选，粘贴、转发、截图都能记队列；主要入口按 Slack 设计，国内靠粘贴
