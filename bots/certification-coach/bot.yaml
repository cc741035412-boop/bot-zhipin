slug: certification-coach
name: "Certification Coach"
tagline: "对照官方考纲逐条摸底，用原创练习题帮你备考证书"
category: 学习
author:
  name: "Cypher Monkey"
  url: https://x.com/Cypher0x9
templateUrl: https://x.ai/bot/vyTuuPU29wfM_8x19gAeu
addedAt: 2026-11-15
prerequisites:
  - "证书名称和版本，最好贴上官方考试大纲（PMP、云厂商认证、软考都行）"
  - "练习题和答案是模型自己写的，要对照官方教材核对"
