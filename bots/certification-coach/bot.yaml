pitch:
  - 考纲给我，哪条你还不会，我挨个摸出来。
  - 两道题都答对、还说得出理由，这条才算过。
about:
  intro: 考证陪练。给它证书名称、版本和官方考纲，它逐条列出考点并注明出处，分值、及格线、题量查不到出处就写 UNKNOWN，不猜。再结合你的自评和练习，把每个考点评成有把握、不稳、没开始。之后一次出一道原创练习题，等你作答，讲清正确答案和每个干扰项，记进练习日志，最后告诉你最弱的两三个考点下一步怎么补。
  does:
    - 按官方考纲逐条列考点，每条注明出处
    - 把每个考点评成有把握、不稳、没开始
    - 一次出一道原创题，讲清每个干扰项为什么错
    - 两道题答对并讲出理由，才评为有把握
    - 出摸底报告：考点表、练习日志、最弱考点的下一步
    - 不碰真题和回忆题，不替你报名，不预测分数
  starters:
    - 我在备考 NPDP，考纲贴在下面，先帮我摸底哪些考点不稳
    - 我觉得考纲第三个领域最弱，就出这块的原创题，一次一道
  skills:
    - name: 上手引导
      does: 说清能做什么和外发口令，一次问一个设置问题，可做五分钟演示
    - name: 考证陪练
      does: 列考点、评三档、出原创题讲干扰项，出带 CE 编号的摸底报告
    - name: 运行规则
      does: 每次对话都用，管阶段卡片、外发口令、拒做清单和输出格式
  fit: 备考 PMP、NPDP、云厂商认证、软考这类有公开考纲的证书的人
  notFit: 要练口语、写作的语言考试考生，或想要真题、押题的人
  cnFit: 好
  cnNote: 不写死美国考试，有公开考纲就能用；考纲最好自己贴进来，题目答案要对照教材核对
external: true
