tagline: "工作日早上汇总外网上谁提到了你和你的品牌"
category: 市场
author:
  name: "Lenny Rachitsky"
  url: https://x.ai/bot/marketplace/bots/overheard
templateUrl: https://x.ai/bot/NIEguoGUjA648fUPle8F5
