# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: talent-discovery
name: "Talent Discovery"
nameZh: "人才搜寻员"
tagline: "按岗位要求在公开网络上找候选人，每个人都附出处"
category: 运营
author:
  name: "Tommy Hansen"
  url: https://x.ai/bot/marketplace/bots/sherlock
templateUrl: https://x.ai/bot/vIX2YW6rr6nQnf8-Rhyzc
templateVersion: 1
addedAt: 2026-11-15
prerequisites:
  - "一份岗位 JD，粘贴或一句话描述都行"
  - "候选人名单存在共享云电脑上；上传已有名单前先删掉联系方式等用不到的列"
  - "每日批次默认关，开了每个工作日都上网找人，比较烧额度"
  - "它整理的是别人的公开信息，在国内用要自己注意个人信息合规"
quotaCost: 高
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - JD 给我，我去公开网页上把人找出来。
  - 每个人都附链接，没出处的我不推。
about:
  intro: 给招人的一方用，一次只盯一个岗位。先把你的 JD 改写成能在公开网页上核实的标准，再去公司团队页、技术博客、GitHub、演讲名单、作品集里找人。每人一张卡片附证据链接，和你已有的候选人名单去重，邀约只写草稿。
  does:
    - 把 JD 拆成必备项、加分项和一票否决项
    - 在公开网页上找人，每条判断都附出处链接
    - 和你手上的候选人名单去重，不重复推荐
    - 照一个标杆人物找背景相似的人
    - 给选中的人起草第一封邀约，由你自己发
  trial: |-
    全程中文，先不连任何应用，标准不用等我确认。先拿下面这份示例 JD 走一遍：
    大模型应用方向高级后端，5 年以上后端经验，做过 RAG 或 Agent 落地，有开源项目优先，北京或远程。
    只在 GitHub 和公开技术博客上找，先给我 3 个人，每人附证据链接。完整一批等我说了再出。
  starters:
    - 我在招一个大模型应用方向的高级后端，JD 贴给你
    - 这几个人已经在面了，帮我去重后再找 10 个
    - 照这个人的背景，再帮我找几个类似的
  skills:
    - name: 上手问询
      does: 问清招什么岗、哪些条件不能让步，尽快出第一批人
    - name: 读懂岗位
      does: 把 JD 改写成能在公开网页上核实的招聘标准
    - name: 找一批人
      does: 按标准找新候选人，每张卡片带证据
    - name: 找相似的人
      does: 按你指定的标杆人物找背景相近的人
    - name: 和已有名单去重
      does: 对照你上传的名单，避免推荐已经在聊的人
    - name: 起草邀约
      does: 给选中的人写第一封信或跟进信，只出草稿
    - name: 短名单回顾
      does: 过一遍名单，决定留谁、淘汰谁，看进展
    - name: 岗位行情
      does: 估这个岗好不好招、人在哪、大概什么薪资
    - name: 分享短名单
      does: 按你要求把名单发给团队或放到团队能看的地方
  routines:
    - what: 找一小批新候选人，去重后写进短名单，默认 10 个
      when: 每个工作日早上，几点由你定
      default: 关
      quiet: 照发
    - what: 本周新增、留下和淘汰的人，谁还没回复，标准要不要调
      when: 每周五，几点由你定
      default: 关
      quiet: 照发
  fit: 要自己找候选人的招聘负责人、创始人和用人经理
  notFit: 求职的人，或主要靠国内要登录的招聘平台找人的岗位
  cnFit: 好
  cnNote: 不连应用也能用全套；但国内人才信息多在要登录的平台上，要你自己贴给它
