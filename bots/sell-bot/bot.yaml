# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: sell-bot
name: "Sell Bot"
nameZh: "销售助理"
tagline: "帮做销售的你写跟进、备通话、出报价，每封确认了才发"
category: 销售
author:
  name: "Shub Gaur"
  url: https://x.ai/bot/marketplace/bots/sell-bot
templateUrl: https://x.ai/bot/znrhzY4AYMg4v3QTfU0IJ
addedAt: 2026-11-15
prerequisites:
  - "建议连 Gmail 和 Google 日历；不连只给可复制的文本"
  - "官网链接、价格和折扣底线、几封你发过的客户邮件"
  - "10 个定时任务导入后全关，全开很烧额度，按需只开几个"
  - "别连 X：读帖子会按条扣你的 X 接口费用"
quotaCost: 高
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
  - 外部账号
  - 代我发消息
external: true
pitch:
  - 跟进邮件我先写好，你说发，我才发。
  - 客户要报价？底线告诉我，我来出单。
about:
  intro: 先读你的官网，整理出产品和买家画像，再按你的口吻写开发信、跟进和回复，还能备通话、出报价、看合同改动，盯老客户的用量和续费信号。邮件都存成 Gmail 草稿或聊天里的可复制文本，你对哪一封说发，才发那一封。
  does:
    - 按你的口吻写开发信、跟进和客户回复
    - 通话前出准备页，通话后整理要点和跟进
    - 按你批过的价格写报价单，解读合同改动
    - 盯客户用量和额度余量，起草续费扩容提醒
    - 照产品文档回答客户问题，追查账单疑问
  starters:
    - 先带我把设置走一遍，官网链接我贴在下面
    - 帮我给这个客户写封跟进邮件，通话笔记在下面
    - 客户要 20 个席位，按我给的价格出一份报价单
  skills:
    - name: 首次设置
      does: 第一次对话带你走设置，中途停了能接着来
    - name: 客户台账
      does: 管设置文件、客户档案、阶段、数据来源和同事
    - name: 写邮件
      does: 起草每封邮件，你说发才发，周五对比复盘
    - name: 约通话
      does: 帮你约、改或取消一通通话
    - name: X 上看客户
      does: 找客户的 X 账号，读他们最近的帖子
    - name: 通话准备页
      does: 重点通话前出准备页和确认提醒草稿
    - name: 通话收尾
      does: 通话后整理收获、对方要求、信号和跟进
    - name: 持续跟进
      does: 定期问候、新功能系列邮件和周一影响复盘
    - name: 客户盯盘
      does: 看额度余量、扩容信号和重点客户名单
    - name: 客户支持
      does: 答客户问题、查账单、记 bug、通知修复
    - name: 报价合同
      does: 写方案报价，处理扩容单、合同和成败记录
  routines:
    - what: 给当天重点通话出准备页
      when: 工作日 7:00
      default: 关
      quiet: 不打扰
    - what: 给一小时后的通话起草确认提醒
      when: 工作日 7:05 到 17:05 每小时一次
      default: 关
      quiet: 不打扰
    - what: 当天通话的总结和摘要
      when: 工作日 17:45
      default: 关
      quiet: 不打扰
    - what: 老客户问候和到期的系列邮件
      when: 工作日 7:50
      default: 关
      quiet: 不打扰
    - what: 看客户额度余量、扩容信号和 X 动态
      when: 工作日 8:56
      default: 关
      quiet: 不打扰
    - what: 潜客回信、跟进和邀约
      when: 工作日 9:40
      default: 关
      quiet: 不打扰
    - what: 漏斗周报：卡住的单和超期没跟的
      when: 每周一 9:00
      default: 关
      quiet: 不打扰
    - what: 对比通过话的客户和其他客户的变化
      when: 每周一 9:20
      default: 关
      quiet: 未说明
    - what: 新功能上线时提醒问过的客户
      when: 工作日 10:10 和 15:10
      default: 关
      quiet: 不打扰
    - what: 拿草稿和你实际发出的对比，调口吻
      when: 每周五 15:30
      default: 关
      quiet: 不打扰
  fit: 卖软件或服务、从开发一路跟到续费的 B2B 销售
  notFit: 只想写几封邮件的人，7 步设置加 10 个定时任务太重
  cnFit: 一般
  cnNote: 不连 Gmail 也能写信、出报价、理笔记，给可复制文本；通话类定时任务要 Google 日历
