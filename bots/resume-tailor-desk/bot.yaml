slug: resume-tailor-desk
name: "Resume Tailor Desk"
nameZh: "简历定制师"
tagline: "逐条对照岗位要求标出差距，改出一份不编造的定制简历"
category: 求职
author:
  name: "Cypher Monkey"
  url: https://x.com/Cypher0x9
templateUrl: https://x.ai/bot/xhEs67Kz7pQ_SizfIIRTb
addedAt: 2026-11-15
prerequisites:
  - "你的真实简历和目标岗位的 JD"
  - "默认按海外简历习惯排版，要国内格式先说清楚"
  - "它只出稿不投递；要发邮件得单独打一行英文固定口令"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
pitch:
  - JD 每条要求，我都对着你的简历过一遍。
  - 简历上没写过的事，我一个字都不替你编。
about:
  intro: 把真实简历和一个岗位的 JD 贴进来，它先把 JD 每条要求标成匹配、沾边、缺口三档，每条注明依据在简历哪一行。然后只用你写过或亲口说过的事实来重排、删减、换成 JD 的说法，出一份定制简历和一封可选的求职信，附来源对照和缺口清单。职位、日期、数字原样照抄，也不替你投递。
  does:
    - 把 JD 每条要求对着简历标成匹配、沾边、缺口
    - 每条改写都注明来自简历哪一行或你哪句话
    - 只用已有事实重排、删减、换成 JD 的说法
    - 可选附一封 200 词以内的求职信草稿
    - 缺口单独列出，你让它硬加也不加
    - 签证、工作许可这类事实留空，等你自己填
  trial: |-
    全程中文，按国内简历格式，不要求职信。先拿下面这份示例走一遍，我看看效果再换成自己的。
    简历：李明，3 年 B 端产品经理，负责客服工单系统，把平均处理时长从 12 分钟降到 7 分钟；带过两个开发小组；会写 SQL。
    JD：AI 产品经理，负责大模型客服助手，要求 3 年以上产品经验，懂 Prompt 和 RAG，有数据分析能力。
  starters:
    - 这是我的简历和一个 AI 产品经理的 JD，先帮我看哪些要求对不上
    - 按国内简历格式，对着这个大模型应用产品岗改一版，不要求职信
  skills:
    - name: 上手引导
      does: 说清能做什么和外发口令，一次问一个设置问题，可做五分钟演示
    - name: 定制简历
      does: 对照 JD 分三档、按来源改写，出带 RT 编号的简历包，再按你的意见改
    - name: 运行规则
      does: 每次对话都用，管阶段卡片、外发口令、拒做清单和输出格式
  fit: 手上有现成简历、要针对具体岗位改一版的求职者，包括转做 AI 产品的学员
  notFit: 没有简历要从零写的人，或想把经历包装得更好看的人
  cnFit: 好
  cnNote: 不连应用就能用，招聘网站上的 JD 复制进来即可；默认海外版式和英文式求职信，国内格式要先交代
external: true
