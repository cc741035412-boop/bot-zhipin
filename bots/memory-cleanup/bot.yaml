# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: memory-cleanup
name: "记忆清理"
tagline: "按主题整理 Bot 的记忆，你点头才删旧规则"
category: 管家
author:
  name: "Oviya Kapoor"
  url: https://x.com/lubo0923
templateUrl: https://x.ai/bot/LzbEuYYioxCKhdpdIc7d8
templateVersion: 2
addedAt: 2026-11-15
prerequisites:
  - "一个记忆攒得很乱、想清理的 Bot"
  - "批准一个主题后会真的删掉旧记忆；能不能跨 Bot 读写，导入后先试一次"
quotaCost: 低
permissions:
  - 云电脑文件
pitch:
  - Bot 记的规矩打架了？我按主题帮你理一遍。
  - 旧规则删之前，我先拿给你过目。
about:
  intro: 把一个 Bot 攒下的记忆按主题分组，比如交流习惯、身份、权限、工具、隐私、定时、多 Bot 协作。每个主题列出它认为现在该留的那一条、准备删的旧版和冲突版、拿不准的事，以及哪些记忆允许它不问你就动手。一次过一个主题，你批了才删，最后交一份清理后的规则清单。
  does:
    - 把零散的记忆按主题分组
    - 每个主题只留一条现行规则
    - 列出要删的旧版和互相打架的版本
    - 揪出允许它不问你就动手的记忆
    - 一次过一个主题，你批准才删
    - 进度存在工作区，下次接着清
  trial: |-
    先拿下面这份示例走一遍。这是我另一个写作 Bot 的记忆，我直接贴过来，你不用去读自己的记忆，也先别删任何东西。按主题分组，先给我第一个主题的批阅，再单独列出允许它不问我就动手的条目。
    1. 回复一律用中文
    2. 回复用英文，我想练英语
    3. 标题不超过 20 字
    4. 标题控制在 15 字以内
    5. 小红书草稿可以不问我直接存进草稿箱
    6. 每周一早上 9 点给我选题
    7. 选题改到每周一 10 点
    8. 我的公众号叫产品手记
  starters:
    - 我的写作 Bot 记了一堆前后矛盾的规矩，帮我按主题理一遍
    - 先只看权限这一块，哪些记忆允许它不问我就动手
  skills:
    - name: 记忆清理
      does: 按主题审一遍记忆，列出现行规则和待删旧版，你批准后才删
  fit: 某个 Bot 用久了、记的规矩越来越乱、开始自相矛盾的人
  notFit: 记忆还很少的新 Bot，或想一键清空记忆的人
  cnFit: 好
  cnNote: 配置本身就是中文写的，不连任何外部应用
external: true
