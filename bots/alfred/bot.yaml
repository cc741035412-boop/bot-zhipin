slug: alfred
name: "Alfred"
nameZh: "Bot 团队顾问"
tagline: "给你的多 Bot 团队做架构设计、定期体检和分享前审查"
category: 管家
author:
  name: "Robin Delta"
  url: https://x.ai/bot/marketplace/bots/alfred
templateUrl: https://x.ai/bot/p7Gh6HIrfv4AGzIow6-9X
addedAt: 2026-11-15
prerequisites:
  - "已经有几个 Bot 在用时最有价值"
  - "自带每周、每月、每季三个巡检，没变化也会发报告；导入后看一下开没开，用不上就暂停"
quotaCost: 中
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 想再加个 Bot？先问问我有没有必要。
  - Bot 越养越乱，我帮你盘一盘。
about:
  intro: 从你的业务目标倒推：这件事要不要用 Bot，要几个，哪些只配做成一个技能或定时任务，默认结论是一个都不加。流程分六步，从组织设计一直到公开分享前的安全检查，每一步都停下来等你明确同意，自己不建、不改、不删。另带周、月、季三份巡检报告。
  does:
    - 盘点现有 Bot，逐个判断留、改、合并还是停
    - 判断一件事值不值得自动化，用最小的办法
    - 给批准的方案出 Bot、技能和定时任务设计
    - 上线前先小范围试跑，验过再启用
    - 公开分享前查一遍密钥和私人信息
  trial: |-
    全程中文。先拿下面这个示例走一遍，什么都别建，直接给我一份自动化决策简报：值不值得新建 Bot，最小的办法是什么。缺的信息按你的默认假设写明，先别问我。
    我带 30 个学员的 AI 产品课，每周一要把上周群里的提问整理成 FAQ 发给 2 个助教。现在我自己翻聊天记录，要 2 小时，还常漏。负责人是我。我账号里现在只有一个写周报的 Bot。
  starters:
    - 我有 5 个 Bot，感觉越来越乱，帮我盘一盘
    - 想做个 Bot 每周汇总学员问题，先别建，给我最小方案
    - 这个 Bot 我想公开分享，帮我做一次分享前检查
  skills:
    - name: 组织摸底和架构
      does: 从零搭或重新设计你的 Bot 组织结构
    - name: 自动化决策
      does: 判断一个流程该不该交给 Bot，或只加个技能
    - name: 系统设计
      does: 方案批准后，设计 Bot、技能、定时任务和交接
    - name: 试点和启用
      does: 设计批准后先安全测试，测过再启用
    - name: 巡检修复
      does: 处理吵、出错、重复或职责不清的 Bot
    - name: 分享前安全检查
      does: 公开链接或投稿市场前做一次安全审查
  routines:
    - what: 公司和 Bot 改进周回顾
      when: 每周一 9:00
      default: 未说明
      quiet: 照发
    - what: Bot 组合策略月回顾
      when: 每月 1 号 9:30
      default: 未说明
      quiet: 照发
    - what: 公司和 AI 运营方式季度回顾
      when: 1、4、7、10 月的 1 号 10:00
      default: 未说明
      quiet: 照发
  fit: 手上已有好几个 Bot、开始觉得乱的人
  notFit: 只有一两个 Bot 的人，它多半只会劝你别再加
  cnFit: 好
  cnNote: 不连任何外部应用，只读你账号里的 Bot 配置；会用你的语言回答，中文没问题
