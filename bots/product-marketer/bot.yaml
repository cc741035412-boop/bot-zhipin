# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: product-marketer
name: "Product Marketer"
nameZh: "定位文案师"
tagline: "先帮你定产品定位，再照着写落地页和广告文案"
category: 市场
author:
  name: "Josh Kim"
  url: https://x.ai/bot/marketplace/bots/product-marketer
templateUrl: https://x.ai/bot/nXp4Rp2trKV8AK-RC1Ohf
addedAt: 2026-11-15
prerequisites:
  - "产品官网链接，和三五段你认可的文案"
  - "文案规则按英文写的（禁用词、广告字数），写中文要自己补中文禁用词和平台字数"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 先说清你到底卖什么，文案才好写。
  - 这段首屏文案，我给你打个分？
about:
  intro: 先读你的官网、定价页、更新日志和三五段你认可的文案，写出一份定位原则和一份语气档案。之后的落地页、广告、邮件文案都照这份原则起草，现成文案也能拿来按 8 个维度各打 1 到 5 分。只出草稿，发不发、投不投由你定。
  does:
    - 写一份带版本号的定位原则和语气档案
    - 照原则起草落地页、广告和邮件文案
    - 按 8 个维度给文案打分，挑出最该改的 3 处
    - 广告文案每行标出字数和平台上限
    - 从你最终发出去的稿子里学你的改法
  starters:
    - 这是我们官网，先帮我把产品定位理一遍
    - 帮我给这段落地页首屏文案打个分
  skills:
    - name: 首次上手
      does: 收文案样本、定原则，再试写一版首屏和一组广告
    - name: 吃透产品
      does: 读官网、文档、更新日志和定价，建产品事实和语气档案
    - name: 定位原则
      does: 撰写和修订定位原则，含证据规则、禁用词和版本
    - name: 磨定位
      does: 拿竞品情报找出哪些说法是你独有又能证明的
    - name: 起草文案
      does: 改稿、去机器味、按渠道起草或想新角度
    - name: 文案评审
      does: 按 8 个维度打分，给出最关键的 3 处改法
    - name: 去 AI 腔
      does: 每稿交出前过一遍，删套话，不编事实
    - name: 从成稿学习
      does: 对比你实际发出的稿子，把反复的改动记成规则
    - name: 交接简报
      does: 定稿后出落地页或广告简报，你点头才转给别的 Bot
  routines:
    - what: 重读定位原则，汇报新评论、缺口和跑偏的文案
      when: 每周一早上 9 点，按你的时区
      default: 关
      quiet: 不打扰
  fit: 要给产品定位、写落地页和广告文案的产品经理和市场人
  notFit: 想让它直接发布或投放广告的人，它只出草稿
  cnFit: 好
  cnNote: 不连任何应用也能用，在聊天里交付；广告字数和禁用词按英文平台写，中文要自己补
