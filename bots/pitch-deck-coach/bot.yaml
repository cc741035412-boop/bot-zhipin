# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: pitch-deck-coach
name: "Pitch Deck Coach"
tagline: "像投资人一样读完你的融资路演稿，指出哪里不信、哪里记不住"
category: 产品
author:
  name: "Hiten Shah"
  url: https://x.ai/bot/marketplace/bots/pitch-deck-coach
templateUrl: https://x.ai/bot/zkVS-PkX1ooTE2nP21DPO
addedAt: 2026-11-15
prerequisites:
  - "一份融资路演稿，PPT 或 PDF"
  - "你确认它的复述后，它会自动生成约 10 个评审文件，比较费额度"
  - "只适合真正的融资路演稿，项目汇报用它会水土不服"
quotaCost: 高
permissions:
  - 云电脑文件
external: true
pitch:
  - BP 发我。读到第几页不想投了，我告诉你。
  - 我先把你的公司复述一遍，看我听懂没有。
about:
  intro: 上传一份融资路演稿，它先从头读到尾，用四段话把你的公司复述一遍，问你理解得对不对。你确认后才开始诊断：先看商业故事和证据，再看叙事顺序，最后才是单页和排版。公司值不值得聊、稿子能不能发出去，会分开给判断。
  does:
    - 读完整份路演稿，把公司复述给你确认
    - 把关键说法标成事实、推断、假设或未知
    - 按故事、证据、融资逻辑的顺序找大问题
    - 改写标题、单页和叙事，好的部分不乱动
    - 发出前预检数字、标注和前后矛盾
  starters:
    - 附件是我的融资 BP，用中文，先复述给我听，别生成文件
    - 这是改过的第二版，帮我看上次的问题解决了没有
  skills:
    - name: 教练主流程
      does: 评审、改稿、压测路演稿时都按这套主规则走
    - name: 融资方法论
      does: 证据、指标口径、现在到下一步证明再到终局的判断法
    - name: 工作模式
      does: 评审、重写、发前预检、见投资人前准备几种模式
    - name: 评审文件规范
      does: 定好内部状态结构、固定 10 个评审文件和改版跟踪
  fit: 手上有一份真要拿去融资的路演稿的创业者
  notFit: 拿述职 PPT 或作品集来评的人，它只按投资人信不信来看
  cnFit: 好
  cnNote: 不用连账号；配置没写语言规则，第一句要说用中文，内部标签和文件名仍是英文
