# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: call-follow-ups
name: "Call Follow-Ups"
nameZh: "通话跟进助理"
tagline: "客户电话打完，帮你写好跟进邮件和双方承诺清单"
category: 销售
author:
  name: "Daniel Brill"
  url: https://x.ai/bot/marketplace/bots/call-follow-ups
templateUrl: https://x.ai/bot/estQ8HWdKqhheDNmOGjcy
addedAt: 2026-11-15
prerequisites:
  - "自动盯新通话要连 Gong 或 Granola；没有就把会议转录贴进来"
  - "定时任务每 30 分钟跑一次，默认暂停，开之前建议改成每天一次"
  - "开了以后会自动往你的邮箱草稿箱里放草稿，不会发出去"
quotaCost: 高
permissions:
  - 定时自动运行
  - 外部账号
  - 代我发消息
external: true
pitch:
  - 电话刚挂，跟进邮件我已经起好草了。
  - 你答应了什么、他答应了什么，我都记着。
about:
  intro: 客户电话打完，把会议转录贴给它，或者让它从 Gong、Granola 自动拿。每通电话出一份会后材料：按你口吻写的跟进邮件草稿、50 字的下一步备注、CRM 字段改前改后对照，还有双方各自答应了什么。发邮件、改 CRM 都要你当场点头。
  does:
    - 按你的口吻写会后跟进邮件，存进草稿箱
    - 写 50 字的下一步备注：现状、下一步、风险
    - 列出 CRM 字段改前改后，每条附原话依据
    - 记下双方各自的承诺，带负责人和日期
  trial: |-
    全程中文。先不连任何应用，也不用学我的口吻。下面是一通示例电话的会后纪要，直接按它出跟进邮件草稿、50 字下一步备注和双方承诺清单。只出稿，不要发送，也不写 CRM。
    2026-11-20 我（王磊，销售）和陈经理（客户 IT 负责人）
    我：今天主要看排班模块。
    陈经理：排班我们很需要，但预算要等 12 月财务会。11 月 25 号前把报价单和两家同行案例发我。
    我：好，23 号前发，试用账号今天开好。
    陈经理：我 28 号前拉运营总监再聊一次。
  starters:
    - 这是刚才客户电话的转录，帮我出一份会后跟进
    - 帮我列一下这通电话里双方都答应了什么
  skills:
    - name: CRM 更新提案
      does: 按改前改后列出字段变化，你批了才写入
    - name: 上手引导
      does: 连录音、CRM 和邮箱，学口吻，拿一通电话演示
    - name: 下一步备注
      does: 按团队格式写 50 字的下一步备注
    - name: 承诺清单
      does: 列出双方答应的事，没办完就一直挂着
    - name: 跟进邮件
      does: 按你的口吻写一封跟进，存进草稿箱，不发
    - name: 口吻档案
      does: 从你发过的邮件里学你怎么给客户写信
  routines:
    - what: 找刚结束的通话，备好会后材料等你批
      when: 工作日 7:00 到 20:00 每 30 分钟一次
      default: 关
      quiet: 不打扰
  fit: 每天打好几通客户电话、会后跟进总拖着的销售
  notFit: 通话没有录音也没有转录的人，它没东西可处理
  cnFit: 一般
  cnNote: 飞书妙记、腾讯会议的转录贴进来照样出邮件和清单，CRM 那段要你手动粘
