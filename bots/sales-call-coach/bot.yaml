# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: sales-call-coach
name: "Sales Call Coach"
nameZh: "销售通话教练"
tagline: "贴一段销售通话转写，逐项打分，告诉你下次改哪里"
category: 销售
author:
  name: "Daniel Brill"
  url: https://x.ai/bot/marketplace/bots/sales-call-coach
templateUrl: https://x.ai/bot/yZ5MFQFdl32vHt6fcIJAc
addedAt: 2026-11-15
prerequisites:
  - "一通通话的转写文字或录音文件"
  - "打分方法按英文销售习惯写的，中文通话能评，口头禅清单要自己补"
  - "通话内容会存在共享云电脑上，涉及客户报价时留意"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 录音发我，哪句话把客户聊跑了，我指给你看。
  - 客户老说太贵？来，我陪你练。
about:
  intro: 贴一通销售电话的转写，或者上传录音让它先转成文字。每通都按六项打 1 到 5 分：说话占比、需求挖掘、倾听、异议处理、价值表达、下一步，每个分数都附通话原话。再挑出决定成败的几个时刻、给替代说法，最后只留一条下次要改的。
  does:
    - 按六项给通话打分，每项附一句原话
    - 挑出决定成败的时刻，给替代说法
    - 陪你对练总被卡住的那个异议
    - 通话没敲定下一步时，帮你写一封补救跟进
    - 攒够三通以上，看你反复犯的毛病
  trial: |-
    全程中文。先拿下面这段示例通话走一遍，是节选，分数可以不打，帮我挑出决定成败的时刻、给替代说法，最后只说一条下次要改的。
    我卖连锁门店排班软件，对面是一家烘焙连锁的运营总监。
    销售：王总您好，我们的系统能帮门店省 20% 人力，功能很全，我先给您整体介绍一下。（我讲了大概 3 分钟）
    客户：听着不错，就是价格有点高。
    销售：这已经是最低价了，很多客户都在用。
    客户：那我再考虑考虑吧。
    销售：好的，您考虑好了随时联系我。
  starters:
    - 这是昨天一通客户电话的转写，帮我打个分
    - 客户老说太贵，陪我练一下怎么接
    - 明天要见一个新客户，帮我做个通话前计划
  skills:
    - name: 上手引导
      does: 问清你卖什么、通话怎么给它，出第一张评分卡
    - name: 通话评分卡
      does: 给一通电话打分，挑关键时刻，给一条改法
    - name: 异议重演
      does: 复盘没接好的异议，或在通话前预演回答
    - name: 补救下一步
      does: 没定下一步或单子冷了，写一封能推进的跟进
    - name: 教练趋势
      does: 多通电话里看重复问题和进步，定本周要练的
    - name: 通话前计划
      does: 开场说什么、问什么、对方会怎么顶回来
    - name: 提问题库
      does: 从你自己问得好的问题里攒一套题库
    - name: 口头禅和节奏
      does: 快速查口头禅、含糊其辞、啰嗦和语速
  routines:
    - what: 教练周报：哪些数变了、最弱两项和要练的习惯
      when: 每周一次，哪天几点你定
      default: 关
      quiet: 照发
    - what: 拿你通话里的原话，对练最常丢分的异议
      when: 每周两个早上，默认周二和周四
      default: 关
      quiet: 不打扰
  fit: 常打客户电话、想一通比一通讲得好的销售和创业者
  notFit: 想让它旁听实时通话或管商机进度的人，这些它不做
  cnFit: 好
  cnNote: 贴转写就能用，飞书妙记、腾讯会议的都行；口头禅清单是英文的，要自己补中文
