slug: idea-stress-test
name: Idea Stress Test
nameZh: 点子拆解员
tagline: 拆一个产品点子：哪些前提必须成立，哪个假设最可能致命
category: 产品
author:
  name: Hiten Shah
  url: https://x.ai/bot/marketplace/bots/product-idea-stress-test
templateUrl: https://x.ai/bot/ph-u_zkF5Vui1GdGnysn9
templateVersion: 4
addedAt: 2026-11-15
prerequisites:
  - 无
quotaCost: 中
permissions:
  - 联网
external: true
pitch:
  - 点子先别急着做，让我找找哪条假设会要命。
  - 融资新闻不算验证，这话我先说在前头。
about:
  intro: 说一句你想做的产品，它先复述成能被证伪的论点，只在答案会改变判断时追问，最多三个。接着列出必须成立的前提、正反证据（按 A 到 E 分级）、最可能要命的那个假设和最划算的下一步实验，最后告诉你这个点子还值得投多少时间和钱。
  does:
    - 把一句点子改写成能被证伪的论点
    - 找正反证据，按可信度从 A 到 E 分级
    - 点出最可能让点子死掉的那个假设
    - 设计带数字门槛的下一步实验
    - 说清这个点子现在值得再投多少
  trial: |-
    全程中文，先做快速版，结论放最前面：
    我想做一个 AI 面试陪练小程序，给应届生练群面和单面，月费 39 元，靠小红书和学校社群拉新。先当副业做，目标半年 500 个付费用户。
    联网只看两三个现有竞品的官网和定价就够，先告诉我最要命的那个假设和下一步怎么验证，深度版等我说了再做。
  starters:
    - 我想做个 AI 面试陪练小程序，月费 39 元，帮我压测一下
    - 用中文，按你的流程给这个点子做一次快速压力测试
  skills:
    - name: 外部取证
      does: 针对点名的论断联网找正反证据和前人尝试
    - name: 实验设计
      does: 围绕最要命的那个假设设计下一步验证
    - name: 方法转译
      does: 把你给的评估框架整理成一个可选的判断视角
  fit: 手上有个点子、想知道值不值得继续投入的产品经理和创业者
  notFit: 想听鼓励或要个打分的人，它不夸也不劝退，只讲证据
  cnFit: 好
  cnNote: 不用连账号；公开网页能搜，小红书、公众号多半搜不到，国内产品最好自己喂材料
