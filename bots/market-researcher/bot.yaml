# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: market-researcher
name: "Market Researcher"
nameZh: "竞品调研员"
tagline: "每周盯竞品的广告、落地页和定价，告诉你怎么应对"
category: 市场
author:
  name: "Josh Kim"
  url: https://x.ai/bot/marketplace/bots/market-researcher
templateUrl: https://x.ai/bot/xzkXiUbdYfPd7g30OhLGf
addedAt: 2026-11-15
prerequisites:
  - "你的官网地址和一两个竞品名"
  - "数据来自谷歌、Meta、LinkedIn 的公开广告库和 X，国内平台的投放看不到"
  - "周报要截大量图，单次很耗额度；定时任务默认关"
quotaCost: 高
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 竞品最近在投什么广告，我每周去翻一遍。
  - 他们改价、换素材，周报里都给你截好图。
about:
  intro: 给它你的官网和几个竞品，每周去谷歌、Meta、LinkedIn 的公开广告库，再加竞品官网、定价页、谷歌搜索结果和 X，看谁换了广告、改了价、在抢你的词。周报带截图，结尾给 2 到 5 条营销上的应对动作；每月再出一份该微调还是该转向的建议。
  does:
    - 把竞品在跑的广告截图整理成素材库
    - 拆竞品的落地页、报价和促销日历
    - 查核心搜索词上谁在和你抢位置
    - 把你和竞品的说法并排做成对比表
    - 每周出带截图的变化简报和应对动作
  starters:
    - 我们是做 XX 的，主要竞品是 A 和 B，先做张对比表
    - 看看竞品 A 最近在投什么广告
  skills:
    - name: 首次上手
      does: 问清公司、竞品和渠道，当场交对比表和广告素材库
    - name: 连接账号
      does: 引导你在 Bot 浏览器登录自家后台，不行就用导出
    - name: 广告素材分析
      does: 看竞品广告的钩子、优惠和格式，按投放天数判断疲劳
    - name: 落地页和报价
      does: 拆竞品页面首屏、报价和表单，记下价格和促销变化
    - name: 搜索重叠
      does: 查核心词的付费和自然结果里谁在跟你抢
    - name: 说法对比表
      does: 把你和竞品的卖点并排比，找出缺口和应对
    - name: 内容节奏
      does: 看竞品博客和 X 的发布频率、主题和声量
    - name: 每周简报
      does: 逐个竞品汇总广告、页面、定价、搜索和内容变化
    - name: 月度策略
      does: 把一个月的周报和你的数据归成 2 到 4 条建议
    - name: 截图和报告
      does: 截图归档规则，以及生成能单独打开的报告文件
  routines:
    - what: 逐个竞品查变化，出带截图的周报和应对动作
      when: 每周一早上 8 点，可改，按你的时区
      default: 关
      quiet: 照发
    - what: 把一个月的周报和你的数据归成调整建议
      when: 每月 1 号上午 10 点，按你的时区
      default: 关
      quiet: 照发
  fit: 盯海外竞品或做出海产品的市场人和产品经理
  notFit: 竞品主要在百度、抖音、小红书投放的，广告部分基本看不到
  cnFit: 一般
  cnNote: 不连账号也能看竞品官网和定价；广告和搜索数据全来自海外平台，国内投放看不到
