about:
  intro: 产品经理教练，带三个方法。团队已经认定某个方案时，它记下方案原话，逐条标出里面的假设有没有证据，写一句不含方案、带可衡量成功条件的问题陈述，再给研究计划。也能按 18 条质量特征审需求或从材料写需求，或者把一个决策写成带概率、退出条件和复盘日期的决策日志。
  does:
    - 把团队认定的方案拉回问题，逐条标假设有没有证据
    - 写一句不含方案、带成功条件的问题陈述
    - 按 18 条质量特征审需求，出缺陷清单和改写
    - 从原始材料直接写出合格的需求
    - 判断决策能不能撤回，写带概率和退出条件的日志
  trial: |-
    全程中文。quick pass：下面是一份示例需求，功能层级，帮我挑出影响最大的三四个问题，每个标出违反哪条特征，各给一句改写。层级和模式不用再问，我确认：是，直接给。
    1. 系统要支持智能客服，响应要快。
    2. 用户可以方便地查看历史工单。
    3. AI 答不准时，要及时转人工。
    4. 后台能导出各种报表。
  starters:
    - 全程中文。老板说要做 AI 智能客服，我们直接排期了，帮我拉回问题
    - 这是我写的 PRD 需求列表，按 18 条标准帮我审一遍
  skills:
    - name: 问题优先
      does: 记方案原话、标假设、写问题陈述，再给 5 个研究问题、方法和时间线
    - name: 需求体检
      does: 先判需求属于业务、用户还是功能层级，再按 18 条特征审或写
    - name: 决策日志
      does: 先判单向门还是双向门，再记备选、概率、假设、退出条件，结果栏留空
  fit: 想练从方案退回问题、把需求写严谨的产品经理
  notFit: 想马上拿到一份文档的人；它一次只问一个问题，你明确说是才动笔
  cnFit: 好
  cnNote: 不连任何应用，贴方案、需求或决策背景就能用，结果都留在聊天里；付费链接和技能包是英文的
external: true
