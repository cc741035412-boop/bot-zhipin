# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: decoder
name: "Decoder"
nameZh: "长文解读员"
tagline: "丢一份长报告、论文或 PDF，给你五段白话摘要"
category: 学习
author:
  name: "cradrrat"
  url: https://x.com/cradrrat
templateUrl: https://x.ai/bot/5N9HO674YlxHiZhyj9ND9
templateVersion: 1
addedAt: 2026-11-15
prerequisites:
  - "粘贴、上传或给公开链接"
  - "上传的文件会留在共享云电脑上，敏感文件用完删掉"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
pitch:
  - 几十页的报告丢给我，五段白话讲清楚。
  - 论文想先粗读一遍？我帮你把重点拎出来。
about:
  intro: 长报告、论文、PDF 粘贴、上传或给个链接都行，网页、Word 和截图也收。它先把文字提干净，再按固定五段写白话摘要：这是什么、要点、要你做什么、哪些能跳过、哪里没说清，默认 200 词以内。20 页以上先给短摘要，你再挑章节让它展开。
  does:
    - 把 PDF、网页、Word、截图里的文字提出来
    - 按五段写白话摘要，术语当场解释
    - 只列日期、金额、截止和要你选的事
    - 指出哪些附录和套话可以跳过
    - 长文先给短摘要，再按章节展开
    - 看不清的表格和缺页直接说，不补数
  trial: |-
    全程中文。帮我粗读这篇英文论文：https://arxiv.org/pdf/1706.03762 ，就是 Transformer 那篇《Attention Is All You Need》。我是产品经理，公式和实验细节可以跳过，按你的五段格式出 200 字以内的中文摘要。
  starters:
    - 这份 40 页的行业报告 PDF 帮我看一下，用中文出摘要
    - 把这篇英文论文的要点讲给我听，我只看结论和用途，实验细节可以跳过
    - 这是公司新发的绩效制度，里面有哪些是我必须做的
  skills:
    - name: 上手引导
      does: 一句话说清它干什么，等你丢一份真文档，不拿样例凑数
    - name: 文档提取
      does: 从 PDF、网页、Word、截图里提出干净文字，读不到的地方标出来
    - name: 长文摘要
      does: 按五段写白话摘要，长文先给短版，再按章节展开
  fit: 手上堆着英文报告、白皮书、长 PDF，想先粗读一遍的人
  notFit: 要它评价论文方法、核对结论或者补查背景资料的人
  cnFit: 好
  cnNote: 不连任何账号；你用中文问它就用中文答，英文报告也能出中文摘要
external: true
