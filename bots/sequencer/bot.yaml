# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: sequencer
name: "Sequencer"
tagline: "帮销售排开发信的跟进节奏，只写草稿，由你来发"
category: 销售
author:
  name: "Simon Lackowski"
  url: https://x.ai/bot/marketplace/bots/sequencer
templateUrl: https://x.ai/bot/6xnxd_CHg0cXVMQCwnRrZ
addedAt: 2026-11-15
prerequisites:
  - "连 Gmail，或粘贴几封你写过的开发信，让它学你的口吻"
  - "一张跟进表：连 Google 表格或上传 CSV"
  - "4 个定时任务默认关；盯收件箱那个每小时跑一次，最烧额度，可以不开"
quotaCost: 高
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
  - 外部账号
external: true
pitch:
  - 今天该跟进谁，我每天给你列好。
  - 第三封开发信怎么写，照你的口气来。
about:
  intro: 专管给陌生客户发开发信的多轮节奏。先从你发过的邮件里学口吻、确认目标客户画像，再用一张跟进表记每个人走到第几步，到期就写好下一封草稿。邮件放进 Gmail 草稿箱，LinkedIn 和 WhatsApp 的给你一段文字，发都由你自己发。
  does:
    - 从你发过的开发信里学口吻，做成口吻卡
    - 按目标客户画像往跟进表里排新潜客
    - 到期推进下一步，写好那一轮的草稿
    - 标出跟进对象的回信，给下一步建议
    - 对方进入商谈阶段，就暂停对他的冷触达
  starters:
    - 我卖 SaaS 工具，名单在一张表里，帮我搭一套跟进节奏
    - 这是我写过的三封开发信，先学学我的口吻
    - 今天该跟进谁？把草稿列给我看
  skills:
    - name: 上手四步
      does: 问清卖什么、名单在哪，最后演练出几封真草稿
    - name: 自动摸底
      does: 连上工具后扫一遍推断口吻和画像，你确认才存
    - name: 学口吻写信
      does: 照你自己的口吻写冷触达和跟进，只出草稿
    - name: 去 AI 腔
      does: 最后一遍只改节奏，不动事实、数字和人名
    - name: 每日推进
      does: 判断条件、推进到期步骤、写回状态、出复核单
    - name: 跟进表管理
      does: 建表或对字段，没有表格连接时改用 CSV
    - name: 潜客排队
      does: 按画像往表里加人，有出处才填，不超每日上限
    - name: CRM 对接
      does: 先摸清 CRM 的真实字段和阶段，写入要你点头
    - name: 账号登录
      does: 需要登录平台时交给你登，只记平台和权限
  routines:
    - what: 推进到期步骤，写草稿，出一份复核单
      when: 工作日 8:00
      default: 关
      quiet: 不打扰
    - what: 按画像往表里排新潜客，到每日上限为止
      when: 工作日 7:00
      default: 关
      quiet: 不打扰
    - what: 标出跟进对象的回信，给下一步建议
      when: 工作日 9:00 到 17:00 每小时一次
      default: 关
      quiet: 不打扰
    - what: CRM 里进入商谈的人，暂停对应的跟进
      when: 工作日 18:00
      default: 关
      quiet: 不打扰
  fit: 靠冷邮件和 LinkedIn 找客户、名单放在表格里的销售
  notFit: 主要靠微信和电话拓客的人，渠道里没有微信
  cnFit: 一般
  cnNote: 贴 3 封邮件、传个 CSV 就能跑；渠道只有邮件、LinkedIn、WhatsApp，没有微信
