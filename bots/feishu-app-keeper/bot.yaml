slug: feishu-app-keeper
name: 飞书应用管家
tagline: 给每个 Bot 配一个专属飞书机器人，在飞书里就能直接找它干活
category: 管家
author:
  name: 铁柱AGI
  github: RongleCat
templateUrl: https://x.ai/bot/AJpUlCwa8tyMX7L5UHnuY
templateVersion: 1
addedAt: 2026-11-14
prerequisites:
  - 一个能创建自建应用的飞书账号
quotaCost: 中
permissions:
  - 云电脑文件
  - 外部账号
  - 联网
external: true
pitch:
  - 给你每个 Bot 办张飞书工牌，以后飞书里直接喊。
  - 要你确认的事，飞书卡片上点一下就行。
about:
  intro: 让你在飞书里直接找 Bot 干活。给每个 Grok Bot 配一个专属的飞书机器人：扫码建好飞书自建应用，用长连接把飞书里的消息转给对应的 Bot，要确认的事用卡片按钮点一下就行。各个应用的登记、权限和体检也归它管。
  does:
    - 扫码给每个 Bot 建一个飞书自建应用
    - 把飞书里收到的消息转给对应的 Bot
    - 要你确认的操作做成飞书卡片按钮
    - 登记哪个 Bot 对应哪个应用，管权限、做体检
  trial: |-
    先不连任何应用，也先别让我扫码，只出方案给我看：
    假设我有两个 Bot，一个写周报，一个盯竞品，想各配一个飞书机器人，在飞书群里 @ 它就能派活。告诉我要建几个自建应用、每个要开哪些权限、我总共要扫几次码、要我确认的操作在飞书里长什么样。我看完再决定装不装。
  starters:
    - 帮我给我的写作 Bot 配一个飞书机器人
    - 看看我现在有几个 Bot 接了飞书，权限有没有问题
  fit: 天天泡在飞书里、不想来回切 Grok 页面的人
  notFit: 不用飞书的人，或没权限在飞书建自建应用的人
  cnFit: 好
  cnNote: 本身就是给飞书用户做的，要一个能创建自建应用的飞书账号
