# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: ad-spend-watch
name: "Ad Spend Watch"
nameZh: "广告花费监控员"
tagline: "盯广告花费和效果，超线就提醒并给出改法，不碰账户"
category: 市场
author:
  name: "Miguel Cruz"
  url: https://x.ai/bot/marketplace/bots/fuse
templateUrl: https://x.ai/bot/MK5zStpj_As8CsRwg3r6w
addedAt: 2026-11-15
prerequisites:
  - "广告平台导出表和月预算，告诉它什么算超线"
  - "只靠粘贴数据的话别开午间检查；每日检查要你定期给新数据"
quotaCost: 中
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 预算快超了我会喊你，账户我一下都不碰。
  - 是流量贵了还是转化差了，我帮你分清楚。
about:
  intro: 告诉它你投哪些广告账户、月预算多少、什么算超线，再贴一份导出表。按阈值逐条检查，超线项分成紧急、观察、备注三档，拆开看是流量变贵还是转化变差，每条紧急项配一个改法。只提醒不动手，暂停广告、挪预算都由你去后台改。
  does:
    - 按你定的阈值检查花费、CPA 和转化
    - 超线项分紧急、观察、备注三档列出
    - 拆清楚是流量变贵还是转化变差
    - 算这个月预算花到哪、哪个账户会超
    - 你同意后写一份具体到位置的修改清单
  trial: |-
    全程中文。先不连任何应用，拿下面这份示例数据走一遍：两个账户，巨量引擎和百度，月预算 15 万元，CPA 超过 80 元算超线，单日总花费超过 6000 元也算。阈值就按我说的，直接出检查结果。
    11-20 巨量 双11返场 花费 2600 点击 2100 转化 40
    11-20 巨量 新品试用 花费 1500 点击 900 转化 8
    11-20 百度 品牌词 花费 600 点击 800 转化 20
    11-20 百度 行业词 花费 1900 点击 1300 转化 15
  starters:
    - 贴一份昨天的广告导出，看看有没有哪里不对
    - 这个月预算照现在的速度会不会超？
  skills:
    - name: 上手引导
      does: 首次问清账户和超线标准，接着做第一次检查
    - name: 设账户和阈值
      does: 登记账户、预算和阈值，随时能改能查
    - name: 读导出表
      does: 读你粘贴的数字、上传的 CSV、表格或平台日报邮件
    - name: 拉取新数据
      does: 连了表格、数仓或日报邮件时，取比上次更新的数
    - name: 花费效果检查
      does: 把最新数字和阈值逐条对，列出超线项
    - name: 诊断原因
      does: 阈值触发但原因不明时，拆 CPA、ROAS 和转化的变化
    - name: 预算进度
      does: 算本月花了多少、还剩多少、月底落在哪
    - name: 修改清单
      does: 你同意改之后，写清去哪里改什么
    - name: 回答花费问题
      does: 答某个广告上周花多少、哪个回报最好这类问题
  routines:
    - what: 用最新数字对一遍阈值，列出超线项和改法
      when: 每个工作日早上，按你的时区
      default: 关
      quiet: 不打扰
    - what: 当天抓花费暴涨，只在连了实时数据源时有用
      when: 每个工作日中午前后
      default: 关
      quiet: 不打扰
    - what: 算本月花费进度，指出哪些账户会超
      when: 每周一早上
      default: 关
      quiet: 未说明
  fit: 手上管着广告预算、怕哪天花超了没发现的投放负责人
  notFit: 要周报月报的人，它只管报警，报表找 Paid Media Report
  cnFit: 好
  cnNote: 贴导出表就能用，国内平台导出也能对字段；Slack、数仓、Datadog 都可以不连
