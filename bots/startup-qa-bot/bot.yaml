# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: startup-qa-bot
name: "Startup QA Bot"
nameZh: "产品巡检员"
tagline: "每天用测试账号逛一遍你的产品，报告上了什么、坏了什么"
category: 产品
author:
  name: "Shub Gaur"
  url: https://x.ai/bot/marketplace/bots/startup-qa-bot
templateUrl: https://x.ai/bot/XBauviUoNcdi05-ExoOo4
addedAt: 2026-11-15
prerequisites:
  - "一个浏览器能打开的网页产品，测试环境或线上都行"
  - "一个只给它用的邮箱，别用常用邮箱和密码：测试账号密码会明文存在共享云电脑上"
  - "测线上会注册一个真实测试账号，可能触发欢迎邮件"
  - "早间巡检默认关；每次逛几十个页面很烧额度，可以改成每周一次"
quotaCost: 高
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
  - 外部账号
external: true
pitch:
  - 你们昨天上线的东西，我每天替你逛一遍。
  - 哪个按钮坏了，我比用户先发现。
about:
  intro: 给它一个网页产品，它用专门注册的测试账号，在自己单独的浏览器里逛一遍，先画出 10 到 30 个页面的地图。之后每次对照地图告诉你：新上了什么、什么不见了、什么坏了（附复现步骤和截图），哪些事要你拍板。只看不改，不碰真实数据。
  does:
    - 用测试账号把你的网页产品逐页逛一遍
    - 报告新上线、被撤下和坏掉的功能
    - 坏了的附复现步骤、截图和控制台报错
    - 对照合并的 PR 或更新日志查该上的上没上
    - 记下你拍过板的事，下次不再重复提
  trial: |-
    全程中文。先不注册测试账号，也先不连任何应用，巡检节奏选只在我叫你时跑。先拿 https://excalidraw.com 当示例产品走一遍：不用登录，最多看 5 个页面或功能，只看不提交，告诉我哪里坏了、哪里用着别扭，坏了的附复现步骤和截图。完整巡检等我说了再跑。
  starters:
    - 帮我测一下我们的网站，我先给你测试环境的地址
    - 现在就逛一遍产品，看看昨天上线的功能在不在
  skills:
    - name: 首次设置
      does: 装脚本，问清测哪个产品、用哪个邮箱，建测试账号
    - name: 测试账号
      does: 开自己的浏览器，注册登录测试账号、收验证邮件
    - name: 产品巡查
      does: 首次画页面地图，之后逐页巡查并对照变更线索
    - name: 巡查报告
      does: 按上线、撤下、坏掉、待拍板整理，bug 交给队友
    - name: 辅助脚本
      does: 首次设置时装好的 qa.py 状态脚本，不用你碰
  routines:
    - what: 用测试账号逛一遍产品，报告上了什么、坏了什么
      when: 工作日早上 8 点开跑，9 点前出结果；可改成每周或叫它才跑
      default: 关
      quiet: 照发
  fit: 有网页版产品、想每天知道上了啥坏了啥的产品经理
  notFit: 只有手机或桌面 App 的团队，网页版以外它测不了
  cnFit: 好
  cnNote: 三个连接都能不连，验证码可以手动贴；国内常见的手机验证码和滑块要你接手
