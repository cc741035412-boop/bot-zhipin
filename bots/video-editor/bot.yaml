# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: video-editor
name: "Video Editor"
nameZh: "口播剪辑师"
tagline: "把口播原始素材剪成带字幕和配乐的竖屏短视频"
category: 内容
author:
  name: "Ethan Ng"
  url: https://x.ai/bot/marketplace/bots/video-editor
templateUrl: https://x.ai/bot/14O3EsptD43aAhoAzvfq3
addedAt: 2026-11-15
prerequisites:
  - "原始素材和脚本；素材大就给网盘链接，聊天上传只适合短片段"
  - "交付文件夹里的旧版本会被自动删掉，要留底先自己备份"
  - "第一次剪要在云电脑上装几个剪辑和转写工具，比较慢"
  - "用到的 Remotion 对公司商用可能要付费授权，商用前自己确认"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
external: true
pitch:
  - 口播说了八遍？我挑最顺的那一遍。
  - 先给你看剪辑方案，你点头我才动刀。
about:
  intro: 给它口播的原始素材和脚本，会把每条 take 转写出来，逐句挑说得最好的那条，字幕按你实际说的话走，再配 B-roll、动效和音乐。动刀前先发一份剪辑方案和几首备选配乐，你点头才开剪。成片交付前要查音画同步、跳帧、黑帧和响度。
  does:
    - 从多条 take 里逐句挑出说得最好的
    - 按你实际说的话出字幕，配 B-roll 和动效
    - 开剪前发剪辑方案和配乐选项等你确认
    - 交付前查音画同步、跳帧、黑帧和响度
  trial: |-
    全程中文，设置 just go 全用默认。我还没传素材，先拿下面这段示例口播脚本给我出一份剪辑方案看看，配乐给 2 个方向就行，先不剪：
    「很多人问我，转行 AI 产品经理要不要先学代码。我的答案是不用。先学会把需求写成 Prompt，再学会看模型哪里会出错，最后算清一次调用要花多少钱。今天一条一条讲。」
  starters:
    - 我有一段口播素材和脚本，帮我剪成一条竖屏短视频
    - 上一条的字幕颜色换成黄色，片尾音乐收短一点
  skills:
    - name: 上手设置
      does: 导入后一次一问，定好风格、文件夹和绝不用的东西
    - name: 剪辑方案
      does: 每次新剪前挑好 take 和 B-roll，发方案等你批
    - name: 剪辑和渲染
      does: 方案批了再剪、对齐、加字幕、混音、出片，改版也走这步
    - name: 交付检查
      does: 交片前查同步、画面毛刺和响度
    - name: 剪辑工具准备
      does: 把素材弄上云电脑，检查或安装转写和动效工具
  fit: 常拍口播短视频、想把粗剪交出去的自媒体人
  notFit: 只想从长视频里切片段，或要它直接帮你发布的人
  cnFit: 好
  cnNote: 不连应用也能用，聊天上传素材、聊天里下载成片；竖屏规格直接适用抖音、视频号
