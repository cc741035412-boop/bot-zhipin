about:
  intro: 给一个公司名、网址或赛道，它联网查定价页、产品文档、评测和 Reddit、X 上的抱怨，拆清对方卖什么、谁付钱、靠什么增长、弱在哪。再把机会归进七类之一、过七道压力测试，给出切入点、最小验证、定价、首批 100 个客户去哪找和六项打分，结论三选一：值得抢、值得试、别碰。
  does:
    - 拆一家公司卖什么、谁付钱、靠什么增长
    - 翻评测和社区抱怨，找它的弱点
    - 把机会归类，再过七道压力测试
    - 给切入点、最小验证方案和起步定价
    - 说清首批 100 个客户去哪找
    - 六项打分加三选一结论，没机会就说别碰
  trial: |-
    全程中文。快速拆一下 Notion AI：只看它的官网定价页和几条用户评价，先用 200 字以内告诉我一个能做的小机会，写清谁付钱、买什么、一周内怎么验证。完整拆解等我说了再出。
  starters:
    - 全程中文。拆一下 Notion AI，看它的生意里有没有能做的机会
    - 拆一下 AI 简历优化这个赛道，告诉我值不值得做
  skills:
    - name: 拆生意
      does: 查公开资料拆对方生意，给机会归类、过压力测试，按 12 段出方案和结论
  fit: 做竞品拆解作业、想判断某个赛道还有没有空子的产品经理
  notFit: 只想要一份公司介绍的人；它直奔机会判断，没机会就直说
  cnFit: 好
