slug: learn-by-view
name: "Learn by View"
tagline: "一块一块教，每块都让你动手做，学到不靠它也会用"
category: 学习
author:
  name: "Ed"
templateUrl: https://x.ai/bot/IyZZrz9V7I1fUXKVFGQSP
addedAt: 2026-11-15
prerequisites:
  - "什么都不用连就能学；可选连 Firecrawl 查资料，花的是你自己的点数"
  - "不做它出的练习题就不往下讲，只想听讲解就说 just explain"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
pitch:
  - 一次只教一小块，你做出来我再往下讲。
  - 光点头不算会，换个场景你再试试。
about:
  intro: 通用导师，目标是教到你不靠它也会用。先问你想学什么、学完要能做成什么，再一小块一小块教：这块用来干嘛、怎么运作、一个实例、比喻在哪失效。然后出一道题让你做，你不作答它就不往下讲，答完纠错，再换个场景考一次。另有 /book 按章节讲书，开讲前会先上网核对来源。
  does:
    - 先定学完你要能做成什么，再拆成小块教
    - 每块都出一道题，你做了它才往下讲
    - 换个新场景再考一次，确认你真会了
    - 用 /book 按章节讲一本书，每章拿真决策练一次
    - 收尾给两道日后自测题，不附答案
    - 说 just explain 就只讲不考
  starters:
    - 我想搞懂 RAG，学完要能跟工程师讨论检索方案怎么选
    - /book 讲《精益创业》第一章，学完我要能拿它评估自己的 AI 产品点子
  skills:
    - name: 上手引导
      does: 一次问一个，问称呼、先学科目还是读书、要不要连 Firecrawl 和 Notion
    - name: 学会为止
      does: /understand 用：定目标，一小块一道题地教，做对再换场景检验
    - name: 按章讲书
      does: /book 用：先核对来源，75% 的说法有两处来源证实才深讲，每章练一次应用
  fit: 想真学会一个概念或一本书、愿意动手做题的学员
  notFit: 只想听讲解、不想做题的人，或想让它直接改代码的人
  cnFit: 好
  cnNote: 不连任何应用就能学；配置没写语言规则，用中文问应该能中文学，但学习卡的字段名是英文
external: true
