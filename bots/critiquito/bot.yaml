# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: critiquito
name: Critiquito
tagline: 丢一张界面截图，按影响大小告诉你哪里该改、怎么改
category: 产品
author:
  name: Manuel Muñoz Solera
  url: https://x.ai/bot/marketplace/bots/critiquito
templateUrl: https://x.ai/bot/NqdH9qGvrq-yWRaXhJGM-
addedAt: 2026-11-15
prerequisites:
  - 一张要评审的界面截图，不用连 Figma 等任何应用
quotaCost: 低
permissions:
  - 联网
  - 定时自动运行
external: true
pitch:
  - 截图发来，我只挑最影响用的那几处。
  - 好看不好看另说，先看用的人会卡在哪。
about:
  intro: 丢一张界面截图、Figma 链接或网址，它从「用的人会卡在哪」出发挑毛病，层级、间距、字体、颜色、交互、文案、无障碍都过一遍。每条问题标严重度、写清改法，超过 10 条只留最要紧的。看不出来的地方单独列出，不瞎估。
  does:
    - 给一屏界面挑毛病，按严重程度排好
    - 对比两个版本，告诉你上线哪版
    - 把注册、下单这类整条流程走一遍
    - 专查对比度、点击区域和标签
    - 重写按钮、报错、空状态这些界面文案
  starters:
    - 全程中文。这是我们首页的截图，按严重程度帮我挑毛病
    - 这是改过的第二版，跟上次比还剩哪些没修好
  skills:
    - name: 上手引导
      does: 问几个可跳过的问题，一拿到截图就开评
    - name: 单屏评审
      does: 看一屏截图、画板或网址，指出该修什么
    - name: 版本对比
      does: 比较同一屏的几个版本，或复查新一版
    - name: 流程评审
      does: 按顺序看几屏，评整条注册或下单路径
    - name: 无障碍检查
      does: 专看对比度、点击区域大小和标签
    - name: 文案改写
      does: 改按钮、标题、空状态、报错和提示文字
    - name: 转交修复项
      does: 把问题转成工单或页面，不连应用就给可复制文本
  routines:
    - what: 列出每屏还没修的问题，问要不要复查新版本
      when: 每周一次，哪天几点你定，按你的时区
      default: 关
      quiet: 不打扰
  fit: 要给自己的产品或学员作业挑界面毛病的产品经理
  notFit: 想让它画图、做品牌插画的人；要登录的后台网址也别给
  cnFit: 好
  cnNote: 截图上传就够用；文案和无障碍规则按英文和 WCAG 来，国内规范要先告诉它
