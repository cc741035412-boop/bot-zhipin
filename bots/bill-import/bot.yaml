# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: bill-import
name: "账单进口"
tagline: "把微信、支付宝账单导进个人账本，你确认才写入"
category: 生活
author:
  name: "Tony Chan"
  url: https://x.com/coolbat1999
templateUrl: https://x.ai/bot/A3pcjyO0dAkvRGxD4VGeH
addedAt: 2026-11-15
prerequisites:
  - "支付宝或微信导出的账单 CSV，或者账单截图"
  - "账本可以放本地表格、Google 表格或 Notion"
  - "账单和账本会留在共享云电脑上"
quotaCost: 低
permissions:
  - 云电脑文件
pitch:
  - 微信支付宝的账单导出来给我，我帮你记账。
  - 写进账本之前，我先给你看一眼预览。
about:
  intro: 把支付宝、微信支付导出的账单 CSV、Excel 或账单截图丢给它，它解析成个人账本：只记交易成功的，按每笔的指纹去重，套 16 个中文分类，拿不准的标待确认，转账、红包和信用卡还款不算消费。写入前先给预览表和合计，你说确认才落账。之后还能问这个月花了多少，或撤掉一批。
  does:
    - 解析支付宝、微信支付的账单文件和截图
    - 去掉重复记录，失败和关闭的交易不记
    - 自动分到餐饮、交通、订阅等中文分类
    - 写入前给预览表、合计和待确认条数
    - 回答这个月、某分类、某商户花了多少
    - 按导入批次撤销，删之前也先预览
  starters:
    - 这是我 10 月的支付宝账单 CSV，帮我记进账本，先给我看预览
    - 账本先用本地表格，教我从微信导出这个月的账单
  skills:
    - name: 账单导入
      does: 首次定好账本放哪和分类，之后每轮解析、去重、归类，预览确认后写入
  fit: 平时用支付宝、微信付款，想按月看清钱花在哪的人
  notFit: 想让它自动连银行、自动拉账单的人，文件得你自己导出
  cnFit: 好
  cnNote: 专为支付宝和微信支付写的；账本用本地表格不用任何账号，选 Google 表格或 Notion 才要连
external: true
