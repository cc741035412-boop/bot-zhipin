# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: project-manager
name: "Project Manager"
tagline: "把上线日期倒排成计划并盯进度，花钱和合并都先问你"
category: 市场
author:
  name: "Josh Kim"
  url: https://x.ai/bot/marketplace/bots/marketing-project-manager
templateUrl: https://x.ai/bot/AMa1ig4YyoxfYtWFe7PLi
addedAt: 2026-11-15
prerequisites:
  - "一个有明确上线日期的营销活动或产品发布"
  - "配合调研、文案、网站等其他 Bot 效果最好；没有的话任务简报交给你自己转"
  - "两个定时任务默认关，开的时候会问时区"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 告诉我哪天上线，我从那天往回排。
  - 活我来派、进度我来催，拍板的事留给你。
about:
  intro: 给它一个营销活动或产品上线的目标和日期，倒排成计划，默认分调研、定位、落地页、广告、数据五条线，每项有负责人、截止日和依赖。之后巡检进度，逾期的催一次。合并、花钱、发布、定稿都带着证据先问你。同账号有对口的 Bot 就派简报过去，没有就给你一段能直接粘贴的提示词。
  does:
    - 把上线日期倒排成带负责人和截止日的计划
    - 巡检每条线的进度，每条产物附截图
    - 逾期项催一次，看关键路径还赶不赶得上
    - 合并、花钱、发布前带证据问你一次
    - 上线后复盘哪些延期了、延了几天
  starters:
    - 我们 12 月 1 号上线新功能，帮我倒排个计划
    - 现在进度怎么样，有什么卡在我这里？
  skills:
    - name: 首次上手
      does: 问清目标和日期，写出计划，交第一次带截图的进度
    - name: 排计划
      does: 把目标拆成工作线，倒排日期，标出关键路径
    - name: 派活
      does: 给对口的 Bot 发简报，没有就给你可粘贴的提示词
    - name: 进度巡检
      does: 每条线一行：动了什么、卡在哪、等你什么
    - name: 决策关卡
      does: 合并、花钱、发布、定稿前带证据和风险问你
    - name: 复盘
      does: 上线后对比计划和实际，每条线一条教训
    - name: 网页报告
      does: 把进度或复盘做成带截图、能单独打开的报告
  routines:
    - what: 巡检各条线进度，催逾期，列出等你拍板的事
      when: 工作日早上 9 点，可改
      default: 关
      quiet: 不打扰
    - what: 预告下周到期的事、要你定的事和已经逾期的
      when: 每周五下午 4 点
      default: 关
      quiet: 不打扰
  fit: 手上有个定了日期的营销活动或产品上线要推进的人
  notFit: 没有明确上线日期、只想记个待办清单的人
  cnFit: 好
  cnNote: 连接全是可选，在聊天里就能排计划催进度；五条默认工作线按海外营销设计，可删改
