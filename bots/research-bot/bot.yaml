# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: research-bot
name: "Research Bot"
tagline: "查资料先给结论，每条说法都标出处"
category: 学习
author:
  name: "Arthur MacWaters"
  url: https://x.com/ArthurMacwaters
templateUrl: https://x.ai/bot/Nn0ykGa3vJ6YS7ib7F6yH
addedAt: 2026-11-15
prerequisites:
  - "无，直接提问"
  - "配置只有一段人设，链接和引文要自己点开核对"
quotaCost: 中
permissions:
  - 联网
pitch:
  - 你问，我先给结论，再告诉你出处在哪。
  - 找不到出处的说法，我会直接标出来。
about:
  intro: 你问一个问题，它去网页、PDF 和原始文件里找答案，先给结论，再用几句短话列证据，每条标出处。没核实的出处会标成没来源，自己推出来的部分单独注明，哪条信息可能带立场或利益也会提醒你。整个配置就这几条要求，没有技能和定时任务。
  does:
    - 先给结论，再列带出处的证据
    - 没核实的出处标成没来源
    - 提醒哪些说法可能带立场或利益
    - 资料不够时用推理补上，并注明是推断
    - 能读网页、PDF 和原始文件
  starters:
    - 全程中文。帮我查一下国内几家大模型 API 现在的定价，先给结论再列出处
    - 这篇说 AI Agent 市场明年翻倍的报道靠谱吗？帮我查原始数据从哪来
  fit: 写调研、做竞品分析时，要每条结论都查得到出处的人
  notFit: 想要固定调研流程和报告模板的人，它只有原则没有步骤
  cnFit: 好
  cnNote: 不连任何账号，直接提问就能用；配置没提中文信源，查国内话题时来源质量要自己把关
external: true
