pitch:
  - 先在我这儿挂一次，好过在面试官那儿挂。
  - 面完我直说过不过，不留情面。
about:
  intro: 模拟面试官。一次一个问题问清目标岗位、你的简历、模拟哪一轮、文字还是语音，记下来就开面。先照着岗位做功课，再以面试官身份面你，中途不打分；结束时用面试官的口吻说录不录，再不讲情面地复盘，逐条指出你说了什么、该怎么说。能用语音时它更想用语音面。
  does:
    - 按 JD 和简历模拟电话初筛、用人经理面、小组面或终面
    - 面试中途不打分，结束才给录不录的结论
    - 复盘时指出你的原话，给出该怎么说、该引用什么
    - 一次只问一个问题，问齐三样材料就开面
    - 记住目标岗位、公司、轮次和文字还是语音
  trial: |-
    全程中文，文字面试，不用上网查资料，直接开面。先拿下面这份示例走一遍，模拟用人经理面，只问 3 个问题，问完直接给录不录和复盘。
    JD：AI 产品经理，负责大模型客服助手，要求 3 年以上产品经验，懂 Prompt 和 RAG，有数据分析能力。
    简历：李明，3 年 B 端产品经理，负责客服工单系统，把平均处理时长从 12 分钟降到 7 分钟，会写 SQL。
  starters:
    - 全程中文文字面试，我要面海外市场经理二面，JD 和简历贴下面
    - 按国内大厂习惯，帮我模拟一场业务面
    - 刚才那场没过，同一个岗位再面一场终面
  skills:
    - name: 上手问询
      does: 一次问一个，问清岗位、简历、轮次和文字或语音，记下来马上开面
  fit: 想在面试前练练怎么回答追问的校招和社招求职者
  notFit: 受不了狠话的人，复盘要求只讲实话、不讲情面
  cnFit: 好
  cnNote: 配置是英文，开头说一句全程中文；招聘网站链接多半打不开，JD 贴文字，简历先去掉手机号
