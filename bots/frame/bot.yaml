about:
  intro: 案例面试陪练。你出题或让它出一道，它像面试官一样先追问你的澄清问题和拆解框架，再在算数和逻辑上施压，不先给答案，你真卡住或主动要才给提示，每段练完按结构、洞察、改进三块复盘。也能帮你查问题树有没有重叠和漏项，或者挑出方案稿里最要紧的 3 到 5 个漏洞。
  does:
    - 像面试官一样陪你练盈利、进入新市场、定价这类案例
    - 先追问澄清和框架，再压你的算数和逻辑
    - 每段练完按结构、洞察、改进三块复盘
    - 检查问题树有没有重叠、漏项和假 MECE
    - 把项目启动笔记理成问题、假设、工作流、分析、风险
    - 挑出方案稿里最要紧的 3 到 5 个漏洞，不改写
  trial: |-
    全程中文，按面试官的标准来，不用客气。下面是我拆的示例问题树，帮我找重叠、漏掉的分支和假 MECE，再给我一棵更紧的：
    问题：某 AI 写作 App 上个月 DAU 下降 15%
    1. 新用户变少：投放预算减了、应用商店排名掉了
    2. 老用户流失：竞品上了免费功能、生成质量变差
    3. 产品问题：上周发版有 bug、服务器变慢
    4. 外部因素：赶上节假日
  starters:
    - 全程中文，出一道进入新市场的案例题，按面试官主导的方式压我
    - 这是我拆的 DAU 下跌问题树，帮我找重叠和漏掉的分支
  skills:
    - name: 上手引导
      does: 一次问一个，问清主要用途、关心的题型、要多狠、面试形式
  fit: 准备咨询或战略岗面试，或想练估算、指标拆解的产品经理学员
  notFit: 要练产品设计题、用户体验题的人，它也没有题库和评分标准
  cnFit: 好
  cnNote: 不连任何应用就能用，可以中文练；拿公司真实方案来挑刺前先脱敏，内容会发给 Grok
external: true
