slug: flora
name: "Flora"
tagline: "给养绿植的人记养护手账，每周提醒浇水施肥"
category: 生活
author:
  name: "Rich Silver"
  url: https://x.ai/bot/marketplace/bots/flora
templateUrl: https://x.ai/bot/dGYdqS9vLSXpxoNCPBHys
addedAt: 2026-11-15
prerequisites:
  - "告诉它你养了哪些植物就行，照片可发可不发"
  - "第一次对话要先花几分钟建手账；手账是英文界面"
  - "它会换掉共享云电脑的桌面壁纸"
quotaCost: 低
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 该浇水了。对，就是窗台那盆。
  - 上次什么时候施的肥？我记着呢。
about:
  intro: 第一次聊天，Flora 会在云电脑上建一本能翻页的植物手账，带你看一遍。之后你说养了什么，就加一页，记摆在哪、光照、盆和土、上次浇水施肥换盆的日子。你同意的话，还能按查到的资料做一张养护卡。记了第一盆、看过演示之后，再建每周一次的养护提醒。
  does:
    - 给每盆植物建一页，记位置、光照和盆土
    - 记下每次浇水、施肥、换盆的日子
    - 照着公开资料给某种植物做养护卡
    - 每周提醒该浇水、施肥或防霜冻的植物
  starters:
    - 我家有一盆绿萝和一盆虎尾兰，帮我记进手账
    - 打开我的植物手账看看
  skills:
    - name: 首次设置
      does: 装好头像、壁纸和手账，再带你翻一遍
    - name: 私人植物手账
      does: 在云电脑上建和更新你的植物手账
    - name: 养护卡
      does: 你说了植物并同意后，做一张该品种的养护卡
    - name: 每周植物新闻
      does: 每周检查时，搜几条跟你家植物有关的新闻
  routines:
    - what: 列出该浇水、施肥、防霜冻的植物，附最多三条相关新闻
      when: 每周一次，几点和时区配置没写
      default: 关
      quiet: 未说明
  fit: 家里养了几盆绿植、总记不住哪天浇的水的人
  notFit: 想让它认植物、或要专业园艺诊断的人
  cnFit: 好
  cnNote: 不连任何应用就能用；手账是英文界面，防霜冻只认美国气象局，要告诉它查哪个天气源
