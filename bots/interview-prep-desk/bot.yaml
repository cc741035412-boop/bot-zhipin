slug: interview-prep-desk
name: "Interview Prep Desk"
nameZh: "面试备考教练"
tagline: "按岗位出面试题库，用你的真实经历逐题陪练打分"
category: 求职
author:
  name: "Cypher Monkey"
  url: https://x.com/Cypher0x9
templateUrl: https://x.ai/bot/aPnGMEOruUeNLfKtUDc7I
addedAt: 2026-11-15
prerequisites:
  - "目标岗位的 JD，再加三五条你自己的真实经历"
  - "默认练行为面和岗位基础题，产品 case、估算题要先说明"
  - "它磨单题、不给过不过的结论；整场彩排配合 The Interviewer 用"
quotaCost: 低
permissions:
  - 联网
pitch:
  - 按这个岗位出题，你用真事儿来答。
  - 这段经历讲得虚，我陪你一遍遍磨实。
about:
  intro: 贴一个岗位的 JD，再给三到五条你自己的真实经历，它出 8 到 12 道题，每题标明出自 JD 哪条要求，还是这类轮次的常见题，再把每题对到你的经历上，对不上的给一句回忆提示。然后一次问一题，你答完它按结构、具体度、结果、相关性四项打分，引用你的原话给一条改法。最后汇总成一份备考包。
  does:
    - 按 JD 出 8 到 12 道题，每题标明出处
    - 把每道题对到你的真实经历，对不上的给回忆提示
    - 一次问一题，答完按四项给强、待加强、缺失
    - 引用你的原话给一条改法，可以反复重练
    - 汇总题库、经历对照、练习记录和反问清单
    - 不编经历和数字，真面试时不实时帮忙
  starters:
    - 我下周面数据分析师一面，JD 和我做过的三个项目贴在下面，先出题
    - 这是一个用户运营岗的 JD，按行为面出题，先练最可能被追问的那道
  skills:
    - name: 上手引导
      does: 说清能做什么和外发口令，一次问一个设置问题，可做五分钟演示
    - name: 面试陪练
      does: 出题、对经历、逐题陪练打分，出带 IV 编号的备考包，再按你的意见改
    - name: 运行规则
      does: 每次对话都用，管阶段卡片、外发口令、拒做清单和输出格式
  fit: 有具体岗位要面、想拿真实项目经历逐题打磨答法的求职者
  notFit: 想要整场模拟和过不过结论的人，或主要想练产品 case、估算题的人
  cnFit: 好
  cnNote: 不连应用就能用，JD 从招聘网站复制进来；配置没限定语言，可以中文练，打分标签是英文
external: true
