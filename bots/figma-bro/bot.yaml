# 外部收录（xAI 官方 Bot 市场）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: figma-bro
name: "figma bro"
tagline: "把 Figma 画板变成开发能照着做的规格说明"
category: 产品
author:
  name: "John Bai"
  url: https://x.ai/bot/marketplace/bots/figma-bro
templateUrl: https://x.ai/bot/pXNvc_U2cGyZmheYrUuF_
addedAt: 2026-11-15
prerequisites:
  - "Figma 账号；不连也能看截图，但数值是估的"
  - "告诉它你们的技术栈和命名习惯，规格会更贴"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
  - 外部账号
external: true
pitch:
  - 画板丢给我，间距字号我一个个给你量出来。
  - 开发问这里几像素？以后让他来问我。
about:
  intro: 给它一个 Figma 画板，它会写出工程师能照着做的规格：布局、间距、字体、颜色 token、各种状态和响应式。也能按需求搭一屏，或者体检组件库、token 和动效。数值只取文件里有的，看截图时会说明是量出来的。
  does:
    - 把画板写成带精确数值的开发规格
    - 按一段需求在新页面上搭出一屏
    - 查组件库里的重复、脱钩实例和命名
    - 查 token 的硬编码、近似重复和对比度
    - 写设计交给开发时的交接说明
  starters:
    - 这是一个 Figma 画板链接，帮我写一份开发规格
    - 我没连 Figma，发你截图，先估一版间距和字号
  skills:
    - name: 上手引导
      does: 首次问清你要它干什么，尽快给出第一份结果
    - name: 画板转规格
      does: 把画板或导出图变成工程师能照做的数值
    - name: 按需求搭屏
      does: 根据需求、规格或参考图做出一屏
    - name: 组件库体检
      does: 查重复组件、脱钩实例、命名和变体覆盖
    - name: token 体检
      does: 查硬编码值、近似重复、缺失模式和对比度
    - name: 动效说明
      does: 写清交互、过渡、缓动时长和手势行为
    - name: 开发交接说明
      does: 对上代码组件，补齐设计稿看不出的行为和疑问
    - name: 图层整理方案
      does: 嵌套太深、自动布局失灵时给出整理计划
  routines:
    - what: 巡检组件库和 token，只报比上周新增的问题，没变化回一句
      when: 每周一早上，按你的时区，钟点你定
      default: 关
      quiet: 照发
    - what: 列出标了待开发却还没规格的画板，问要不要写下一份
      when: 每周五下午，按你的时区
      default: 关
      quiet: 照发
  fit: 常把设计稿交给开发、要写交接说明的产品经理和设计师
  notFit: 想让它评审审美或定品牌风格的人，这些它明确不做
  cnFit: 一般
  cnNote: 最好连 Figma；用即时设计、MasterGo 的只能发截图，数值是估的
