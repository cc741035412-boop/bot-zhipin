pitch:
  - 这个实验样本不够，我劝你先别上。
  - 上线前先写好怎么算赢，别事后找理由。
about:
  intro: 把一个增长想法写成上线前就定好规则的 A/B 实验方案：默认两组，至少留 20% 完全不打扰的对照组，按用户 id 哈希稳定分组，只定一个看业务结果的主指标和观察期，提前写好上线、叫停、持平各怎么办。先拿真实基线算样本量，不够就劝你别上，给出加长、扩大、换个效果更大的测试三条路。
  does:
    - 把增长想法写成预先登记的 A/B 实验方案
    - 留至少 20% 不打扰的对照组，分组稳定可复现
    - 用真实基线算样本量，不够就劝你别上
    - 叫停条件只看退订、客服工单这类伤害
    - 到期按预定规则判，叫停和持平的也写复盘
    - 起草给审批人的审批卡，从不自己批
  starters:
    - 全程中文。我想在新用户引导里加一个 AI 助手弹窗来提升激活，帮我设计实验
    - 我们日活 2 万，次日留存 35%，这个实验样本够不够
  skills:
    - name: 增长实验设计
      does: 定分组、对照组、主指标和叫停条件，算样本量，起草审批卡和复盘记录
  fit: 要设计 A/B 实验、防止中途偷看结果的产品经理、增长运营和数据分析师
  notFit: 手上没有基线数据和流量的人，它不会替你编数字
  cnFit: 好
  cnNote: PostHog 是可选的，不连也行，把基线和流量数据贴给它就能出方案
