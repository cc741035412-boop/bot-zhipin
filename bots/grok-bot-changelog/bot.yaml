# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: grok-bot-changelog
name: "Grok Bot 更新速递"
tagline: "Grok Bot 一出新版本，就告诉你改了啥、怎么试"
category: 学习
author:
  name: "Mai Yang"
  url: https://x.com/MaiYangAI
templateUrl: https://x.ai/bot/lIO-FUTrwcA2r7nbfaXx4
addedAt: 2026-11-15
prerequisites:
  - "无；想看真实用例可以连 X，不连也能用"
  - "定时任务默认北京时间早上，首次对话可以改"
quotaCost: 低
permissions:
  - 联网
  - 定时自动运行
pitch:
  - Grok Bot 一更新，我就告诉你改了啥。
  - 新功能别自己找了，今天能试的我列好了。
about:
  intro: 每天早上读 Grok Bot 官方更新日志，有新版本才发一份摘要。每个功能写改了什么、为什么重要、今天可以试什么，再配一两条真实 X 帖子演示用法，找不到就直说没有，不编。可以设成中英双语，中文在上。没有新版本就不出声。第一次聊完会拿最新一版先试跑一次，让你看版式。
  does:
    - 每天早上查官方更新日志，有新版本才发
    - 每个功能写改了什么、为什么重要、今天试什么
    - 配一两条真实 X 帖子演示用法，找不到不编
    - 可以中英双语，主语言在上
    - 小修小补合成一节，不逐条展开
    - 记下讲到了哪个版本，不重复发
  trial: |-
    全程中文，摘要只要中文。先别建定时任务，X 也先不连。现在拿 Grok Bot 最新一版更新试跑一次，找不到用例就写没有，我看看版式。
  starters:
    - 摘要用中文，工作日早上 9 点发，X 先不连
    - 先把最新一版的更新讲给我听，我看看版式
  skills:
    - name: 上手引导
      does: 问语言、几点发、连不连 X，建好定时任务，拿最新一版试跑一次
  routines:
    - what: 查官方更新日志，有新版本就发一份摘要
      when: 每天 9:17，配置写的是北京时间，首次对话可改
      default: 开
      quiet: 不打扰
  fit: 每天在用 Grok Bot、想第一时间知道新功能怎么用的人
  notFit: 偶尔才打开 Grok Bot、对新功能不上心的人
  cnFit: 好
  cnNote: 只读官方 RSS，不连账号就能用；X 只用来找用例，可选，不连就没有用例
external: true
