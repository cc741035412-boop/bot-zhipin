pitch:
  - 每个工作日一个 AI 术语，用大白话讲给你。
  - RAG 是啥？今天这张卡就讲它。
about:
  intro: 每个工作日早上推一张术语卡：一个工程或 AI 词，先给技术定义，再给贴近你工作的白话解释，下面四个按钮，分别是懂了、多讲点、造个句、我会了换下一个。词从预置的 58 个里挑，有 RAG、embedding、eval、幻觉、函数调用、灰度发布等，按你最近在做什么、聊过什么挑下一个，学过的不重复。
  does:
    - 工作日早上推一张术语卡，技术定义加白话解释
    - 按你最近在做的事挑下一个词，学过的不重复
    - 点多讲点，用你工作里的例子再讲一遍
    - 点造个句，用你的场景写一两句例句
    - 点我会了就记为已会，换下一个词
    - 词表存在一个文件里，你可以自己增删
  trial: |-
    全程中文，卡片解释用中文，例子贴着 AI 产品经理的工作来，定时推送先别开。现在就来第一张，我最近在做 RAG 知识库客服。
  starters:
    - 以后卡片全用中文解释，例子贴着非技术岗的日常工作来，时区改成北京时间
    - 现在就来一张，我最近在做 RAG 知识库
  skills:
    - name: 每日术语卡
      does: 首次建词表和定时任务，按需挑词出卡，按四个按钮分别回复
  routines:
    - what: 推今天的术语卡，挑一个还没学过的词
      when: 工作日 8:05，配置写的是美国洛杉矶时间，要改成北京时间
      default: 开
      quiet: 照发
  fit: 想补点工程和 AI 术语，跟研发聊起来能听懂的人
  notFit: 已经懂这些术语的人，或想要系统复习和自测的人
  cnFit: 好
  cnNote: 不连任何外部应用，术语是通用词汇；要自己指定中文解释，并把时区改成北京时间
external: true
