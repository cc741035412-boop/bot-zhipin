# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: personal-assistant
name: "Personal Assistant"
nameZh: "杂事助理"
tagline: "把手头一团乱的杂事，理成下一步和能直接用的草稿"
category: 生活
author:
  name: "Gabriel Abreu"
  url: https://x.com/gabe_onchain
templateUrl: https://x.ai/bot/OWj_0o4Ik2FffupfloOwe
templateVersion: 3
addedAt: 2026-11-15
prerequisites:
  - "无，直接把手头的事贴给它"
  - "可选连 Google 日历和 Gmail；你点头后它可以替你预订、付款、发邮件"
quotaCost: 低
permissions:
  - 云电脑文件
  - 外部账号
  - 联网
  - 代我发消息
pitch:
  - 手头一团乱？说给我听，我帮你理出下一步。
  - 该回的邮件，我先起个草给你看。
about:
  intro: 把手头一团乱的事丢给它，日程撞了、账单要理、要排行程、合同看不懂都行。它先用一句话复述，分清哪些是你说的、哪些是它猜的，再挑一个对口的小技能，给出下一步和一份能直接用的东西，比如回复草稿、对比表、行程单。花钱、对外发送、删除、发布之前一律先问你。
  does:
    - 把一团乱的事拆成一个下一步和一份产物
    - 起草邮件和消息回复，你点头才发
    - 理日程冲突，排出行计划和费用区间
    - 理预算和还债方案，整理报税材料
    - 读合同里的义务、续约和退出条款
    - 会前出议程，会后分出决定和待办
  trial: |-
    全程中文。先拿下面这份示例走一遍：手上有三个 offer，帮我做张对比表，再给个建议，你的假设单独标出来。
    A：杭州电商大厂，AI 产品经理，月薪 28k×15，经常加班到十点，通勤 1 小时。
    B：上海 AI 创业公司（B 轮），产品负责人，月薪 32k×13，期权 2 万股，双休。
    C：北京外企，产品经理，月薪 25k×14，六点下班，每周可远程两天。
    我最看重成长，其次是不加班。
  starters:
    - 下周三的部门例会和一场面试撞了，帮我想想怎么调
    - 这是我的租房合同，帮我看看续约和退租有什么坑
    - 手上有三个 offer，帮我做个对比表
  skills:
    - name: 分诊入口
      does: 复述你的事，分清已知和推测，挑对口的技能给下一步
    - name: 日程管理
      does: 找日程冲突、给几个改法，你同意才改日历
    - name: 消息起草
      does: 梳理来往消息，写几版回复，你点头才发
    - name: 预算和还债
      does: 整理收支表、标出异常；按你给的余额和利率比几种还法
    - name: 合同解读
      does: 拎出义务、费用、续约和退出条款，标风险，不当法律意见
    - name: 报税材料
      does: 盘点你给的材料，列缺口和合计，打包给帮你报税的人
    - name: 出行计划
      does: 排路线、住宿、费用区间和入境要求，每笔预订单独确认
    - name: 购物比较
      does: 按你的标准带出处比较几个选项，你同意才买
    - name: 求职和面试
      does: 按 JD 写申请材料，用真实经历练面试题，比较几个 offer
    - name: 会前会后
      does: 会前出议程和要拍板的事，会后分出决定、待办和负责人
    - name: 记录和提醒
      does: 记笔记、查笔记、设提醒，存你记下的人和家里物品，存哪先问你
    - name: 调研和报告
      does: 多来源查资料，在你给的资料里检索，出只带真实引用的报告
    - name: 文档和表格
      does: 用你的内容做可编辑的文档、幻灯片和表格
    - name: 长期事项跟进
      does: 跨好几天的事存好进度，可改可停；跟项目里程碑和卡点
    - name: 隐私检查
      does: 看哪里会暴露个人信息，分享前去掉密钥和隐私
    - name: 写提示词
      does: 帮你写或改提示词，例子里不留密钥
  fit: 杂事多、想有个人帮着理清下一步的职场人
  notFit: 想把某一件事做深的人，它每个技能只写了三步
  cnFit: 好
  cnNote: 贴内容进来就能用；日程和邮件只提了可选连 Google 日历和 Gmail，国内邮箱和飞书没提
external: true
