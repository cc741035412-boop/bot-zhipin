slug: search-ads-review
name: "Search Ads Review"
tagline: "按目标安装成本复盘苹果搜索广告，列出该改的词和出价"
category: 市场
author:
  name: "Chris Everett"
  url: https://x.ai/bot/marketplace/bots/apple-search-ads-review
templateUrl: https://x.ai/bot/gadc3bVOsg9iIwmzAGRve
addedAt: 2026-11-15
prerequisites:
  - "Apple Search Ads 账户，能导出 14 到 30 天的报表"
  - "先想好目标单次安装成本"
  - "苹果搜索广告不覆盖中国大陆应用商店，适合出海 App"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 哪些搜索词在白花钱，我列给你。
  - 报个目标安装成本，我逐个词对一遍。
about:
  intro: 专看苹果搜索广告。把 Apple Search Ads 导出的广告系列、关键词、搜索词报表贴给它，再报一个目标单次安装成本，就会逐组对照，找出超标的花费和没带来安装的词。交回一份带日期的复盘、加词减词和调价调预算的建议，外加一份能导入后台的批量改动表，执行由你来。
  does:
    - 按目标安装成本逐组对照花费
    - 找出花了钱却没安装的搜索词，列成否定词
    - 从搜索词里挑出值得加的新关键词
    - 算出价该调多少、预算该往哪挪
    - 把你批准的改动做成可导入的批量表
  starters:
    - 贴一份近 30 天的关键词报表，目标安装成本 2 美元
    - 哪些搜索词在白花钱？
  skills:
    - name: 上手引导
      does: 首次问清 App、账户和目标，尽快给出第一份复盘
    - name: 设成本目标
      does: 登记或修改目标安装成本，随时能查
    - name: 花费复盘
      does: 拿到新导出就对照目标，看花费跑得怎样
    - name: 搜索词和否定词
      does: 砍掉浪费的搜索词，挖新词，建否定词清单
    - name: 出价和预算
      does: 算出价和调价幅度，看预算往哪挪、为什么被限额
    - name: 每周复盘
      does: 出上周花费对比目标的周报
    - name: 改动表
      does: 把你批准的建议做成能在后台执行的表
  routines:
    - what: 复盘上周花费对比目标，先列最值得改的
      when: 每周一次，你选的那天早上
      default: 关
      quiet: 照发
    - what: 看有没有新导出，只报超标或没产出的广告组
      when: 每个工作日早上
      default: 关
      quiet: 不打扰
  fit: 投苹果搜索广告、有目标安装成本的出海 App 团队
  notFit: App 只上中国区商店的团队，苹果搜索广告不覆盖大陆
  cnFit: 好
  cnNote: 粘贴 CSV 就能用，不用连任何应用；但苹果搜索广告不覆盖中国大陆 App Store
