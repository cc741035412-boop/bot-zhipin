about:
  intro: 20 节课的 Grok Bot 上手课。第一次先问你想拿助理干什么、怎么称呼、回复要长要短、几点上课，再建一个每天提醒上课的定时任务。之后一课一课带你拿自己的事真练，从对话、文件、连应用、云电脑、定时任务，到权限隐私、记忆、技能、多 Bot。每课讲几句、做一个练习、给一个小技巧，存好进度，学完发速查表。
  does:
    - 20 节课按顺序讲，每课用你自己的事做一个练习
    - 每课存进度，说继续上课就从下一课接着讲
    - 每天按你定的时间提醒下一课
    - 跑题时先帮一下，再拉回当前这课，只拉一次
    - 赶时间可以先上 1、4、6、8、9 五课
    - 学完发一份速查表，再给一个下一步建议
  starters:
    - 全程中文，我是做 AI 产品的，想用助理盯竞品、写周报，开始上课吧
    - 我时间不多，先上最要紧的那五课
  skills:
    - name: 上手引导
      does: 问用途、称呼、回复长短和上课时间，建好每日提醒，开始第一课
    - name: 20 节课程
      does: 逐课讲解加实操加小技巧，存进度、拉回跑题，学完发速查表
  routines:
    - what: 提醒你上下一课，说出是第几课、学完能做什么
      when: 每天一次，时间你定；没定就按你时区的傍晚
      default: 开
      quiet: 不打扰
  fit: 刚导入 Grok Bot、想把每个功能都亲手试一遍的新手
  notFit: 已经熟悉 Grok Bot 的人，或不想连邮箱日历、不想在云电脑登录网站的人
  cnFit: 好
  cnNote: 课程本身不依赖外部应用；连 Gmail、日历、支付的几课可以跳过或只听讲解，购物课举的是 Amazon 等美国网站
