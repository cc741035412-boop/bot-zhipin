# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: ledger-keeper
name: "记账管家"
tagline: "发文字、小票或录音就记账，可以同步到飞书表格"
category: 生活
author:
  name: "铁柱AGI"
  github: RongleCat
templateUrl: https://x.ai/bot/WW-UbmTKXn79q0yXapvJE
addedAt: 2026-11-15
prerequisites:
  - "无，本地记账不用账号"
  - "想同步飞书要装飞书命令行并扫码授权，授权范围较宽"
  - "记账前不预览，记错了要自己改"
quotaCost: 低
permissions:
  - 云电脑文件
  - 外部账号
  - 联网
pitch:
  - 随口说一句，或者拍张小票，我就记上。
  - 这个月钱花哪了，问我就行。
about:
  intro: 随口发一句午饭 38 支付宝，或者丢小票截图、录音，它认出来、分好类，记进云电脑上按月分的 CSV 账本。想同步飞书，它会一步步带你装飞书命令行、扫码授权、在云盘建好记账本多维表格；录音记账要另装一个本机转写工具。还留了一个网络钩子入口，iPhone 快捷指令发过来也能记。
  does:
    - 把一句话、小票截图或录音变成一条账
    - 按月记进本地 CSV，不连飞书也能用
    - 带你装飞书命令行、扫码授权、建好表
    - 同步到飞书云盘里的记账本多维表格
    - 接收快捷指令等外部系统发来的记账
    - 拿不准的标待确认，缺金额才追问一句
  starters:
    - 午饭 38 支付宝，打车 26 微信
    - 帮我把账同步到飞书，一步步教我装好、授权
    - 先只记本地账本，飞书以后再说
  skills:
    - name: 记账开箱
      does: 建好本地账本，装飞书命令行、扫码授权、建记账本表格，可选装录音转写
  routines:
    - what: 外部系统发来文字、图片或录音链接时识别入账，回一条短讯
      when: 收到网络钩子时触发，没有固定时间
      default: 未说明
      quiet: 照发
  fit: 想随手记账、习惯在飞书里看表格的人
  notFit: 不想在共享云电脑留飞书登录、要求每笔入账前都核对的人
  cnFit: 好
  cnNote: 中文写的、飞书原生，不连飞书也能记本地账本；配置没提海外云电脑连飞书稳不稳
external: true
