pitch:
  - 每天早上一份 AI 动态，谁自称、谁测过，我标清楚。
  - 你用的那几个模型有新消息，我放最前面。
about:
  intro: 每天早上发一份 AI 简报：过去 24 小时模型、Agent、开发工具、价格和 AI 法律监管的变化，按你上手时说的用途和工具筛，最多 7 条。每条带一手来源链接和一个证据标签：已上线、已宣布、厂商自称、独立测过或传闻（传闻默认不收），结尾给一个 10 分钟能试的动作。周五加一周五句话和一条可以忽略的。
  does:
    - 每天挑过去 24 小时和你相关的 AI 变化，最多 7 条
    - 每条只贴一个证据标签，厂商数字不当事实
    - 没有一手来源的消息直接丢掉
    - 记着报过的不重复，有实质更新才再报
    - 按你的点赞点踩调整话题权重
    - 周五加本周五句话和一条可以忽略的
  trial: |-
    全程中文。我做 AI 产品原型，主要用 Claude、Cursor 和 DeepSeek，以后北京时间早上 8 点发，用简版。定时任务等我说了再开，现在直接给我一份过去 24 小时的样刊：最多 3 条，只看厂商官方博客和更新日志，每条带证据标签和链接。完整版等我说了再出。
  starters:
    - 我平时用 Claude 和 Cursor 写代码、查资料，北京时间早上 8 点发，用中文
    - 先给我一份过去 24 小时的样刊，国产模型 DeepSeek、Qwen 也要看
  skills:
    - name: 上手设置
      does: 一个一个问用途、工具、几点发和时区、简版还是完整版，再问要不要开定时
    - name: 证据标签
      does: 按顺序判定，每条只贴一个标签，拿不准就选弱的并写明不确定
    - name: 新闻去重
      does: 记一本报过的台账，同一件事只报一次，有实质变化才标更新
    - name: 简报排版
      does: 按简版或完整版写，周五加周总结，按点赞点踩调话题权重
  routines:
    - what: 发当天的 AI 简报，周五附一周总结
      when: 每天 7:02，配置按美国纽约时间写，要改成北京时间
      default: 关
      quiet: 照发
    - what: 回顾你的工具和关注点，问要不要调整
      when: 每周一 9:02 触发，只在每月 1 到 7 号干活，按纽约时间
      default: 关
      quiet: 不打扰
  fit: 需要每天盯海外模型和 AI 工具更新的人
  notFit: 想看国内 AI 圈的人；要深查某条说法得另装 AI Claim Checker
  cnFit: 好
  cnNote: 不连账号也能靠网页搜索出简报，X 是可选的；来源偏英文，国产模型要在上手时点名
external: true
