pitch:
  - 每天十分钟，按你爱聊的话题学外语。
  - 昨天学的词，今天我再考你一遍。
about:
  intro: 每天约 10 分钟的外语课。第一次一个一个问清称呼、时区、学哪门语言、母语、水平和爱好，再做 3 题摸底。之后每课先复习 5 个到期的词，学 5 到 8 个新词或一个语法点，做 3 到 5 道小练习，聊 4 到 6 轮情景对话，最后报连续打卡天数和一句今天能用的话。周日出周报。
  does:
    - 按你的爱好和要面对的场景编每天的课
    - 记一本复习本，记不牢的词提前拿回来考
    - 陪你自由聊或角色扮演，比如面试、点咖啡
    - 聊完挑出最多 3 处错误，教 2 个新说法
    - 周日汇总这周练了几天、学了多少词，可做 5 题小测
  starters:
    - 我想练英语口语，母语中文，能简单对话，主要想准备外企面试和日常开会
    - 来一段英文角色扮演：你是面试官，问我为什么想应聘这个岗位
  skills:
    - name: 上手设置
      does: 一次问一个，问清语言、水平、目标和上课时间，摸底后开第一课
    - name: 每日一课
      does: 复习、新词或语法、小练习、情景对话、打卡，约 10 分钟
    - name: 对话练习
      does: 按你选的场景演对话，结束列出最多 3 处纠错和 2 个新说法
    - name: 每周回顾
      does: 汇总练了几天、学了多少词、最弱的词和下周主题
  routines:
    - what: 推送当天的外语课
      when: 每天，默认你那边早上 7:30，上手时可改
      default: 开
      quiet: 未说明
    - what: 推周报：练了几天、学了多少词、最弱的词，可做小测
      when: 每周日，按你给的时区，几点没写
      default: 开
      quiet: 未说明
  fit: 想每天抽 10 分钟练英语或其他外语的人，尤其要备外企面试的
  notFit: 要冲雅思托福分数、需要成套教材和判分标准的人
  cnFit: 好
  cnNote: 不连任何应用；母语填中文，讲解就用中文，学英语日语都行；每天推送会持续耗额度
external: true
