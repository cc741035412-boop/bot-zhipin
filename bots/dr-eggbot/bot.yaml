slug: dr-eggbot
name: dr eggbot
tagline: Grok Bot 团队出品的 Bot 设计师，问几个问题就帮你造好 Bot
category: 管家
author:
  name: Lauren Tan
  url: https://x.ai/bot/marketplace/bots/dr-eggbot-v2
templateUrl: https://x.ai/bot/_jOdbfkB16zxu7MRcmReE
addedAt: 2026-11-15
prerequisites:
  - 自带两个定时体检，其中每个工作日读全部 Bot 对话的那个比较烧额度，用不上可以暂停
quotaCost: 高
permissions:
  - 定时自动运行
external: true
pitch:
  - 想要个什么样的 Bot？说两句，我给你捏一个。
  - 谁的定时任务在偷偷烧额度，我去查。
about:
  intro: 想要一个新 Bot，跟它说要干什么。问几个偏好问题后，会按一个职责、明确不做什么、口吻、什么时候醒这四块写好设定，直接创建，再读回配置核对。还自带两个体检：一个扫所有 Bot 的对话找你反复纠正的地方，一个查定时任务哪里在浪费额度。
  does:
    - 问几个问题后写好新 Bot 的设定并创建
    - 建完读回配置，确认和设计一致
    - 扫各个 Bot 的对话，找你反复纠正的地方
    - 查所有定时任务，指出白烧额度的
    - 做能用网页按钮唤醒 Bot 的小界面
  starters:
    - 先别创建，帮我设计一个每周一汇总学员作业的 Bot
    - 帮我查查现在的定时任务哪些在白烧额度
  skills:
    - name: 设计 Bot
      does: 问几个偏好问题，写设定、创建、再核对
    - name: 做 Bot 界面
      does: 做网页按钮，通过 webhook 唤醒 Bot
    - name: 定时任务体检
      does: 查定时任务的额度浪费，定合适的频率
    - name: 对话体检
      does: 从各 Bot 对话里找摩擦，提议新技能或 Bot
  routines:
    - what: 扫最近的 Bot 对话，找反复纠正的地方
      when: 工作日 8:44，时区导入后要确认
      default: 未说明
      quiet: 不打扰
    - what: 查所有定时任务的额度浪费
      when: 每周一 8:49，时区导入后要确认
      default: 未说明
      quiet: 不打扰
  fit: 想自己造几个专职 Bot、又怕设定写不好的人
  notFit: 想先看设计再决定建不建的人，要提前说清别直接建
  cnFit: 好
  cnNote: 不依赖海外应用；默认是英文小写短句，让它说中文就行；设计飞书类 Bot 未必落得了地
