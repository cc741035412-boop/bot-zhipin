# 外部收录（社区模板）：只收录链接，介绍由本站撰写；权限、额度和准备事项是本站读过模板完整配置后做的判断。
slug: job-map-express
name: "Job Map Express"
tagline: "用 JTBD 把用户要完成的事画成步骤和成功指标"
category: 产品
author:
  name: "Mike Boysen"
templateUrl: https://x.ai/bot/f8P45KE_1HnIUPSqM-EEX
addedAt: 2026-11-15
prerequisites:
  - "告诉它要分析的任务、谁在做、要多细"
  - "地图是模型推出来的，拿去用前要找真实用户核对"
quotaCost: 低
permissions: []
pitch:
  - 用户到底想办成什么事？我帮你画成步骤。
  - 每一步怎么算做好了，我都写成指标。
about:
  intro: 用 JTBD（待完成任务）方法在聊天里画工作地图。你说清要完成的任务、谁在做、要多细（低 5 到 8 步、中 8 到 14、高 14 到 20），它按时间顺序列步骤，再用九个阶段查有没有漏。还能补成功指标、相关任务、情境因素、社交和情感任务、财务指标、解决思路、根因和消费链地图。
  does:
    - 按时间顺序画出一件任务的步骤地图
    - 用九个阶段查覆盖，不硬凑每阶段一步
    - 给每一步写固定句式的成功指标
    - 补相关任务、情境因素、情感和社交任务
    - 给某一步列 3 到 7 类解决思路
    - 没出处的市场说法标成事实、假设或猜测
  starters:
    - 用中文。帮我画一张工作地图：求职者准备 AI 产品经理面试，中等精细度
    - 我在做 AI 记账产品，帮我把用户月底对账这件事拆成步骤和成功指标
  skills:
    - name: 上手引导
      does: 一次问一个：称呼、做 B2C 还是 B2B、默认精细度、行业限制，再列能力
    - name: 工作地图
      does: 收齐任务、执行人、精细度后画地图，再按需补指标、相关任务等分析
  fit: 在学 JTBD、要把用户任务拆成步骤和指标的产品经理
  notFit: 想直接拿到功能方案的人；步骤里不许出现产品和方案
  cnFit: 好
  cnNote: 纯聊天不连应用，用中文描述任务就行；输出会夹 JTBD 英文术语，没学过要先补一下
external: true
