slug: copy-humanizer
name: "Copy Humanizer"
nameZh: "去 AI 味编辑"
tagline: "把稿子改得像人写的，保留你的口吻，每处改动都说明"
category: 内容
author:
  name: "Massimo De Luisa"
  url: https://x.ai/bot/marketplace/bots/human-copywriter
templateUrl: https://x.ai/bot/YwxIbVEWqXN-HYCxiMCoB
addedAt: 2026-11-15
prerequisites:
  - "一两段你喜欢的文字当范例，可以跳过"
  - "规则按英文写作习惯写的，改中文稿最好先给它一份你的中文禁用词"
quotaCost: 低
permissions:
  - 云电脑文件
  - 定时自动运行
external: true
pitch:
  - 这句一看就是 AI 写的，我来去去味儿。
  - 先发两段你写的，我学学你怎么说话。
about:
  intro: 先要一两段你喜欢的文字，从里面整理出一份口吻档案，每条规矩都配原句。之后你自己写的稿子，它帮你改紧改清楚，附一张编号的改动清单和理由；读着像机器写的稿子，就按你的口吻重写。缺的事实留空标出来，不替你补。
  does:
    - 从你给的范文里整理出口吻档案
    - 改你自己写的稿，逐条列出改了哪里、为什么
    - 把套话连篇的稿子按你的口吻重写
    - 把零散要点写成邮件、落地页、帖子或发布说明
    - 从你最后发出去的版本里学你的改法
  starters:
    - 我先发两段我以前写的文字，你看看我是什么风格
    - 这段产品介绍读着很假，帮我改得像人话
  skills:
    - name: 上手引导
      does: 问清你想拿它做什么，尽快给出第一稿
    - name: 建口吻档案
      does: 从你给的文字或网站里总结你的写法
    - name: 改稿
      does: 你写的稿子改紧改清楚，保留你的口吻
    - name: 重写
      does: 生硬或像机器写的稿子按你的口吻重来
    - name: 去套话检查
      does: 每份稿子给你看之前，先删一遍套话
    - name: 按渠道起草
      does: 把要点写成邮件、落地页、帖子等该有的样子
    - name: 从终稿学习
      does: 看你实际发出的版本，更新口吻档案
  routines:
    - what: 问你这周发出去的是哪版、你改了什么，记进口吻档案
      when: 每周五下午
      default: 关
      quiet: 不打扰
  fit: 稿子读着有 AI 味、想改回自己口吻的人
  notFit: 只想把长文档理顺结构的人，Writing Bot 更合适
  cnFit: 好
  cnNote: 粘贴就能用，Notion、Gmail 都可不连；去套话清单是英文的，改中文稿要补自己的禁用词
