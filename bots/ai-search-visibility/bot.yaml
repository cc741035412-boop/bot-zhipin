slug: ai-search-visibility
name: "AI Search Visibility"
nameZh: "AI 曝光排查员"
tagline: "查 AI 助手和搜索推不推荐你的产品、推了谁、怎么补"
category: 市场
author:
  name: "Adam Tanguay"
  url: https://x.ai/bot/marketplace/bots/ai-search-visibility
templateUrl: https://x.ai/bot/BFiw9Y7BzTQ-3jFBAro1X
addedAt: 2026-11-15
prerequisites:
  - "你的官网地址或一句话介绍，最好再准备几个竞品名字"
  - "要登录才能用的 AI 助手它不会自己登，要你把那边的回答粘贴给它；国内的助手多半只能这样"
  - "周报和抽查默认关，开之前告诉它你的时区"
quotaCost: 中
permissions:
  - 云电脑文件
  - 联网
  - 定时自动运行
external: true
pitch:
  - 别人问 AI 该买谁，它提没提你？我去问问。
  - 推荐了对手没推荐你，我告诉你差在哪。
about:
  intro: 先读你的官网，写 12 到 20 个买家真会问的问题，拿去谷歌搜索、免登录的 AI 答案引擎和 Grok 自己的回答里问一遍，记下你和对手是被推荐、被引用、被提及还是没出现，每条附原句和链接。要登录的 AI 助手由你去问、把回答贴回来，照样计分。每周一份简报，告诉你下一步补哪里。
  does:
    - 写一份 12 到 20 个买家常问问题的清单
    - 查 AI 回答里你和对手各排在哪一级
    - 审计 AI 回答引用了哪些网站和榜单
    - 做你和对手被推荐次数的记分板
    - 起草要改的页面或榜单资料，不替你提交
  starters:
    - 这是我们官网，竞品是 A 和 B，先查一次 AI 推不推荐我们
    - 我把豆包的回答贴给你，帮我计分
  skills:
    - name: 上手引导
      does: 问清你卖什么、卖给谁，带你跑完第一次检查
    - name: 建问题清单
      does: 写买家会问的问题，增删问题时也用它
    - name: 跑一次检查
      does: 看 AI 助手和搜索结果此刻在推荐谁
    - name: 记录粘贴回答
      does: 你贴来的 AI 回答也按同样标准计分存档
    - name: 每周简报
      does: 汇报哪些回答变了、谁在赢、该做哪一件事
    - name: 引用来源审计
      does: 查回答从哪些网站取材，你为什么没出现
    - name: 推荐占比对比
      does: 比你和对手被提到的频率，做成记分板
    - name: 起草修复
      does: 按待办写要改的页面、榜单资料或答案
  routines:
    - what: 把全部问题跑一遍，出每周可见度简报
      when: 每周一次，你选的那天和钟点
      default: 关
      quiet: 照发
    - what: 只查 5 个重点问题，你掉级或冒出新名字才报
      when: 每周两次，没指定就周二、周四早上
      default: 关
      quiet: 不打扰
  fit: 想知道 AI 助手推不推荐自家产品、想学 GEO 的产品和市场人
  notFit: 主要卖给国内买家的，常用 AI 助手要登录，只能一条条手动贴
  cnFit: 一般
  cnNote: 不连账号就能用；自动查的以谷歌和免登录引擎为主，国内 AI 助手要你手动贴回答
