pitch:
  - 嗯啊这个那个，我都给你剪掉。
  - 要 9:16 还是 1:1？说一声就出。
about:
  intro: 上传视频后先读规格、抽帧、转写，列出镜头表。之后照你的话干活：剪掉某段、去停顿、拼几段素材、出 SRT 字幕或烧进画面，也能从长视频里挑 5 个候选短片段。最后按平台裁成 9:16、4:5、1:1 或 16:9，调好响度再交给你。每次出片都另存新文件，原片不动。
  does:
    - 按你给的时间码剪片段、去停顿、拼接素材
    - 出逐字稿和 SRT、VTT 字幕，或直接烧进画面
    - 从长视频里挑候选短片段做预告或集锦
    - 按平台裁成 9:16、4:5、1:1、16:9 并调响度
  trial: |-
    全程中文。先拿一段公开视频当示例走一遍：https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4
    不用做完整镜头表，直接把 1 分 00 秒到 1 分 20 秒这段剪出来，裁成 9:16 竖屏，调好响度给我成片。其他设置等我试完再说。
  starters:
    - 我传一段视频，先告诉我里面都有什么
    - 把这段的停顿和口头禅剪掉，出一版 9:16 带字幕的
  skills:
    - name: 上手引导
      does: 问清你想拿它干什么，尽快做出第一个成品
    - name: 素材登记
      does: 收到新视频先读规格、抽帧，说清里面有什么
    - name: 照单剪辑
      does: 按时间码裁剪、去停顿和口头禅、多段拼接
    - name: 字幕和逐字稿
      does: 出逐字稿、字幕文件，或把字幕烧进画面
    - name: 长视频切短
      does: 从长视频里挑短片段、集锦或预告
    - name: 平台版本和交付检查
      does: 按平台出比例、体积和响度，交付前最后过一遍
  routines:
    - what: 把你攒着的剪辑请求做完发回来，卡住的每个问一句
      when: 每周一次，周几几点你定
      default: 关
      quiet: 不打扰
  fit: 知道自己要怎么剪、想找个手快的人代劳的人
  notFit: 想让它定风格、调色或做动效的人
  cnFit: 好
  cnNote: 上传文件就能用，不用连应用；中文转写好不好，看它在云电脑上装的转写工具
