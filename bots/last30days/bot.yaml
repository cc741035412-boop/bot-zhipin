  intro: 导入后它先从 GitHub 装一个开源调研工具，再带你配好数据来源。之后丢一个话题过去，会去 Reddit、YouTube、Hacker News、GitHub、Polymarket 和网页上翻最近 30 天的讨论，整理成一份带原话和来源标签的简报。X 和 TikTok 那几路可以跳过，不配钥匙的来源照样能用。
  does:
    - 查一个话题最近 30 天在社区里的真实讨论
    - 简报里引用带来源标签的网友原话
    - 说清这次哪些来源开了、哪些没开
    - 首次带你配来源，每一项都能跳过
