about:
  intro: 把讲稿标题、听众、时长和每页要讲的点给它，它做一套不用构建的网页幻灯片：一个样式文件、一个脚本、一个网页，浏览器打开就能放。画风照 Grok Bot 来，米色纸面、圆团小脸，翻页时团子聚拢再散开。11 种版式按每页的用途挑，带键盘翻页、演讲者备注、总览和打印。
  does:
    - 按标题、听众、时长和每页要点挑版式
    - 交三个文件，浏览器打开就能放
    - 封面、目录、分栏、卡片、时间线等 11 种版式
    - 支持键盘翻页、全屏、总览和演讲者备注
    - 每页打成一张横版，能直接打印
    - 已有这套文件时就在原文件上改
  starters:
    - 帮我做一套 10 分钟的需求评审幻灯片，听众是研发和测试，要点贴在下面
    - 下周给学员分享 AI 产品经理入门，20 分钟，帮我排一套
  skills:
    - name: 网页幻灯片
      does: 按固定配色和 11 种版式写出三个文件，翻页动效和快捷键都包在里面
  fit: 要做分享、评审汇报，愿意用网页放幻灯片的人
  notFit: 要交 PPT 或 Keynote 文件、要套公司模板的人
  cnFit: 好
  cnNote: 你写中文它就出中文稿；字体从 Google Fonts 和 Fontshare 在线加载，国内打开可能换成系统字体
