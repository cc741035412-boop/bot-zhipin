  - 讲稿要点给我，我做成浏览器里能放的幻灯片。
  - 不用装 PPT，打开链接就能讲。
about:
  intro: 把讲稿标题、听众、时长和每页要讲的点给它，它做一套不用构建的网页幻灯片：一个样式文件、一个脚本、一个网页，浏览器打开就能放。画风照 Grok Bot 来，米色纸面、圆团小脸，翻页时团子聚拢再散开。11 种版式按每页的用途挑，带键盘翻页、演讲者备注、总览和打印。
  does:
    - 按标题、听众、时长和每页要点挑版式
    - 交三个文件，浏览器打开就能放
    - 封面、目录、分栏、卡片、时间线等 11 种版式
    - 支持键盘翻页、全屏、总览和演讲者备注
    - 每页打成一张横版，能直接打印
    - 已有这套文件时就在原文件上改
  trial: |-
    帮我做一套 6 页的网页幻灯片，先拿下面这份示例走一遍：
    标题：AI 客服助手需求评审。听众是研发和测试，讲 10 分钟。
    1. 封面
    2. 为什么做：人工客服每天重复回答退款问题，占工单四成
    3. 做什么：先接退款和物流两类问题，答不了转人工
    4. 怎么算成功：首月自助解决率 30%，转人工率不升
    5. 排期：12 月出原型，1 月灰度
    6. 结尾：请大家提问
    做完截一张封面图发我。
  starters:
    - 帮我做一套 10 分钟的项目汇报幻灯片，听众是部门同事，要点贴在下面
    - 下周在读书会做 20 分钟的读书分享，听众是书友，帮我排一套
  skills:
    - name: 网页幻灯片
      does: 按固定配色和 11 种版式写出三个文件，翻页动效和快捷键都包在里面
  fit: 要做分享、评审汇报，愿意用网页放幻灯片的人
  notFit: 要交 PPT 或 Keynote 文件、要套公司模板的人
  cnFit: 好
  cnNote: 你写中文它就出中文稿；字体从 Google Fonts 和 Fontshare 在线加载，国内打开可能换成系统字体
external: true
