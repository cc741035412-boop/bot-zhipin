slug: validate-data
title: 发布数据结论前再核一遍
name: validate-data
category: 数据
purpose: 对外分享数据结论前，它复算数字，查重复统计和样本偏差
scenarios:
- 核对账单汇总，看看合并明细时有没有重复算一笔钱
- 发布读者调查前，检查只在订阅群里取样会漏掉谁
agents:
- Claude Code
summary: 把分析问题、查询过程和待发布的结果交给它，对照交付前核对清单，从取样、计算、口径到结论解释逐项排查，并建议用独立算法做数量级比对。如果拿不到源表，需要标清哪些结论只做了逻辑检查、尚未复算。
install:
- agent: Claude Code
  command: claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install data@knowledge-work-plugins
  note: 在终端运行，装的是整个 data 插件，只需装一次。会登记 8 个第三方连接器，不连接也能直接贴资料。已添加该市场时，只运行安装插件那一步。
source:
  url: https://github.com/anthropics/knowledge-work-plugins/tree/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/validate-data
  name: anthropics/knowledge-work-plugins
author:
  name: Anthropic
  url: https://github.com/anthropics
license: Apache-2.0
licenseUrl: https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/LICENSE
addedAt: '2026-11-20'

examples:
  - caption: 分享分析文档前请它核对计算口径，它指出分母漏算了试用用户，转化率可能被高估约 5 个百分点。
    lang: en
    ask: /validate [shares analysis document]
    reply: |-
      [Reviews methodology] → [Checks for survivorship bias in churn analysis]
             → [Verifies aggregation logic] → [Flags: "Denominator excludes trial users
                which could overstate conversion rate by ~5pp"]
             → [Confidence: "Ready to share with noted caveat"]
    askZh: /validate [附上分析文档]
    replyZh: |-
      [审查分析方法] → [检查流失分析中是否存在幸存者偏差]
             → [核对聚合逻辑] → [指出：“分母不含试用用户，
                可能导致转化率被高估约 5 个百分点”]
             → [可信度判断：“注明上述限制后即可分享”]
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/README.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
  - caption: 比较第三、第四季度的流失率时，指出第四季度的观察期较短，请它检查这样比较是否合理。
    lang: en
    ask: /validate-data Check my churn analysis -- I'm comparing Q4 churn rates to Q3 but Q4 has a shorter measurement window
    askZh: /validate-data 帮我检查一下流失分析：我在比较第四季度和第三季度的流失率，但第四季度的观察期更短。
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/validate-data/SKILL.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
  - caption: 把转化漏斗的 SQL 查询和运行结果一起贴上，请它核对查询逻辑。
    lang: en
    ask: /validate-data Here's a SQL query and its results for our conversion funnel. Does the logic look right? [query + results]
    askZh: /validate-data 这是分析我们转化漏斗的 SQL 查询和运行结果。你看逻辑对吗？[query + results]
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/validate-data/SKILL.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
