slug: humanizer-zh
title: 去掉文章里的 AI 腔
name: humanizer-zh
category: 写作
purpose: 给一段读着像套话的中文稿，它删掉空话，保留事实和你的观点
scenarios:
- 删去更新公告里没信息量的宣传句
- 润色故障通报但保留尚未确认的判断
agents:
- Claude Code
summary: 适合手里已经有一段能读懂、却有点像公关稿的文字时用。它参照编辑清单改句子，不把可能原因写成定论，也不为了换句式删掉有效信息。直接贴文字可拿到改稿；给文件时若只想审阅，要说清不要写回。这是改稿指南，不是作者身份检测器。
install:
- agent: Claude Code
  command: git clone https://github.com/op7418/Humanizer-zh.git ~/.claude/skills/humanizer-zh
  note: 终端执行，需要 Git；适用于尚未安装的用户。
requires: []
source:
  url: https://github.com/op7418/Humanizer-zh/tree/f4518a8eab97b8bfebc66a89d34320a89bef6930
  name: op7418/Humanizer-zh
author:
  name: 歸藏
  url: https://github.com/op7418
license: MIT
licenseUrl: https://github.com/op7418/Humanizer-zh/blob/f4518a8eab97b8bfebc66a89d34320a89bef6930/LICENSE
addedAt: '2026-11-20'

examples:
  - caption: 把方案介绍里堆在一起的四字短语改成日常说法，保留运行稳定、响应快和方便维护三点。
    lang: zh
    ask: 该方案稳定可靠、快速响应、易于维护。
    reply: 这套方案运行稳定、响应快，也方便维护。
    source:
      url: https://raw.githubusercontent.com/op7418/Humanizer-zh/f4518a8eab97b8bfebc66a89d34320a89bef6930/README.md
      name: op7418/Humanizer-zh
    rights: MIT（op7418/Humanizer-zh）
  - caption: 把故障反馈拆成两句，写清是社区多次报告了问题，同时保留内存泄漏只是推测的意思。
    lang: zh
    ask: 该问题被社区多次报告，被认为可能与内存泄漏有关，但原因尚未确认。
    reply: 社区多次报告这个问题。它被认为可能与内存泄漏有关，但原因尚未确认。
    source:
      url: https://raw.githubusercontent.com/op7418/Humanizer-zh/f4518a8eab97b8bfebc66a89d34320a89bef6930/README.md
      name: op7418/Humanizer-zh
    rights: MIT（op7418/Humanizer-zh）
  - caption: 贴上文章请 humanizer-zh 润色，特别交代要保留技术评论的语气。
    lang: zh
    ask: |-
      请用 humanizer-zh 润色下面的文章，保留技术评论的语气：
      [原文]
    excerpt: true
    source:
      url: https://raw.githubusercontent.com/op7418/Humanizer-zh/f4518a8eab97b8bfebc66a89d34320a89bef6930/README.md
      name: op7418/Humanizer-zh
    rights: MIT（op7418/Humanizer-zh）
