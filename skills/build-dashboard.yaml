slug: build-dashboard
title: 做一个能筛选的数据看板
name: build-dashboard
category: 数据
purpose: 给整理好的数据，它做成浏览器能打开、能筛选的网页看板
scenarios:
- 把社团收支做成一页看板，开会时按活动筛选
- 用书店的销售汇总做张图，切换月份看各类书卖了多少
agents:
- Claude Code
summary: 技能内有指标卡、图表和筛选器的页面范例，可从查询结果做出浏览器能打开的看板。模板会从 jsDelivr 加载 Chart.js；要离线演示请先断网试一遍。分享 HTML 前也应确认嵌入的明细允许外发。
install:
- agent: Claude Code
  command: claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install data@knowledge-work-plugins
  note: 在终端运行，装的是整个 data 插件，只需装一次。会登记 8 个第三方连接器，不连接也能直接贴资料。已添加该市场时，只运行安装插件那一步。
