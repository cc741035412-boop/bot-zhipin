slug: build-dashboard
title: 做一个能筛选的数据看板
name: build-dashboard
category: 数据
purpose: 给整理好的数据，它做成浏览器能打开、能筛选的网页看板
scenarios:
- 把社团收支做成一页看板，开会时按活动筛选
- 用书店的销售汇总做张图，切换月份看各类书卖了多少
agents:
- Claude Code
summary: 技能内有指标卡、图表和筛选器的页面范例，可从查询结果做出浏览器能打开的看板。模板会从 jsDelivr 加载 Chart.js；要离线演示请先断网试一遍。分享 HTML 前也应确认嵌入的明细允许外发。
install:
- agent: Claude Code
  command: claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install data@knowledge-work-plugins
  note: 在终端运行，装的是整个 data 插件，只需装一次。会登记 8 个第三方连接器，不连接也能直接贴资料。已添加该市场时，只运行安装插件那一步。
source:
  url: https://github.com/anthropics/knowledge-work-plugins/tree/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/build-dashboard
  name: anthropics/knowledge-work-plugins
author:
  name: Anthropic
  url: https://github.com/anthropics
license: Apache-2.0
licenseUrl: https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/LICENSE
addedAt: '2026-11-20'

examples:
  - caption: 贴入销售数据，得到一份能按地区和时段筛选的 HTML 看板，可在浏览器里查看月收入和热销产品。
    lang: en
    ask: |-
      /build-dashboard Create a sales dashboard with monthly revenue, top products,
           and regional breakdown. Here's the data: [pastes CSV]
    reply: |-
      [Generates self-contained HTML file]
             → [Includes interactive Chart.js visualizations]
             → [Adds dropdown filters for region and time period]
             → [Opens in browser for review]
    askZh: |-
      /build-dashboard 做一份销售看板，展示月收入、热销产品
           和各地区的销售情况。数据在这里：[pastes CSV]
    replyZh: |-
      [生成可独立使用的 HTML 文件]
             → [包含用 Chart.js 绘制的交互式图表]
             → [添加地区和时段下拉筛选框]
             → [在浏览器中打开以供查看]
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/README.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
  - caption: 贴入客服工单数据，请它做一份看板，按优先级统计工单量，并展示响应时长趋势和解决率。
    lang: en
    ask: /build-dashboard Here's our support ticket data [pastes CSV]. Build a dashboard showing volume by priority, response time trends, and resolution rates.
    askZh: /build-dashboard 这是我们的客服工单数据 [pastes CSV]。请做一份看板，展示各优先级的工单量、响应时长的变化趋势和工单解决率。
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/build-dashboard/SKILL.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
  - caption: 请它用样例数据做一份 SaaS 高管看板模板，把收入、客户流失、新客和净推荐值放在一起看。
    lang: en
    ask: /build-dashboard Create a template executive dashboard for a SaaS company showing MRR, churn, new customers, and NPS. Use sample data.
    askZh: /build-dashboard 为一家 SaaS 公司的管理层做一份看板模板，展示月度经常性收入（MRR）、客户流失情况、新增客户和净推荐值（NPS）。用样例数据。
    source:
      url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/build-dashboard/SKILL.md
      name: anthropics/knowledge-work-plugins
    rights: Apache-2.0（anthropics/knowledge-work-plugins）
