examples:
  - caption: 针对邮箱留空也能提交的问题，先写测试确认它会失败，再补上必填校验，让同一个测试通过。
    lang: en
    ask: Empty email accepted
    reply: |-
      **RED**
      ```typescript
      test('rejects empty email', async () => {
        const result = await submitForm({ email: '' });
        expect(result.error).toBe('Email required');
      });
      ```

      **Verify RED**
      ```bash
      $ npm test
      FAIL: expected 'Email required', got undefined
      ```

      **GREEN**
      ```typescript
      function submitForm(data: FormData) {
        if (!data.email?.trim()) {
          return { error: 'Email required' };
        }
        // ...
      }
      ```

      **Verify GREEN**
      ```bash
      $ npm test
      PASS
      ```

      **REFACTOR**
      Extract validation for multiple fields if needed.
    askZh: 邮箱留空也能提交。
    replyZh: |-
      **红灯：写一个应当失败的测试**
      ```typescript
      test('rejects empty email', async () => {
        const result = await submitForm({ email: '' });
        expect(result.error).toBe('Email required');
      });
      ```

      **验证红灯：运行测试，确认它确实失败**
      ```bash
      $ npm test
      FAIL: expected 'Email required', got undefined
      ```

      **绿灯：写代码让这个测试通过**
      ```typescript
      function submitForm(data: FormData) {
        if (!data.email?.trim()) {
          return { error: 'Email required' };
        }
        // ...
      }
      ```

      **验证绿灯：再次运行测试，确认它已经通过**
      ```bash
      $ npm test
      PASS
      ```

      **重构**
      如果有多个字段需要校验，可以把校验逻辑提取出来。
