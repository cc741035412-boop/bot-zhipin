slug: pdf
title: 读取、拆合和填写 PDF
name: pdf
category: 文档
purpose: 从 PDF 里取出文字和表格，也能拆分合并、填写表单、识别扫描件
scenarios:
- 把供应商报价表提取出来逐项比较
- 把申请表填好后核对文字有没有落错格
agents:
- Claude Code
- Claude.ai
summary: 先分清文件里是文字、可填写的字段，还是一整页扫描图。普通页面用 Python 的 pypdf 拆合，用 pdfplumber 读表格；填表附有查字段和核对位置的脚本，会另存结果。扫描件需要 Poppler 和 Tesseract，中文材料还要相应语言包。只拆页不必装 OCR。
install:
- agent: Claude Code
  command: /plugin marketplace add anthropics/skills
  note: 第 1 步，在 Claude Code 中添加市场。已添加可跳过。
- agent: Claude Code
  command: /plugin install document-skills@anthropic-agent-skills
  note: 第 2 步，安装文档四件套，只需装一次。
requires:
- Python 3：pypdf、pdfplumber；制表或新建 PDF 用 pandas、openpyxl、reportlab
- 表单图像：Pillow、pdf2image、Poppler
- 扫描识别：Tesseract、对应语言包、pytesseract
- 命令行替代：qpdf 或 pdftk
- 进阶示例按需：pypdfium2、numpy；JS 方案用 Node.js、pdf-lib 或 pdfjs-dist
source:
  url: https://github.com/anthropics/skills/tree/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/pdf
  name: anthropics/skills
author:
  name: Anthropic
  url: https://github.com/anthropics
license: Apache-2.0
licenseUrl: https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/pdf/LICENSE.txt
addedAt: '2026-11-20'

examples:
  - caption: 想知道餐车哪些菜卖得好、利润如何，拿到一份用图表分析经营状况的 PDF 报告。
    lang: en
    ask: I need a business report for my food truck. Create a PDF with charts - best sellers, margin, etc- whatever you think is useful. Make it look great and help me make decisions!
    askZh: 我需要一份餐车经营报告。做成带图表的 PDF，看看哪些菜最畅销、利润率怎么样，其他你觉得有用的内容也可以放进去。排版要好看，还得能帮我做决策！
    images:
      - file: pdf-1-1.jpg
        alt: 图中央是餐车经营报告的 PDF 预览，第 2 页用趋势图、横向条形图和按星期几汇总的表格分析经营表现。
    source:
      url: https://claude.com/resources/articles/create-files
      name: Anthropic 官网
    rights: © 2026 Anthropic PBC
  - caption: 上传 PDF 订单表，让 Claude 用它已经知道的个人信息填表。
    lang: en
    ask: |-
      Fill out this PDF based on what you know about me
      Attached: /mnt/uploads/order_form.pdf
    reply: Certainly! I’ll use the PDF Skill to help
    askZh: |-
      根据你对我的了解，帮我填好这份 PDF。
      附件：/mnt/uploads/order_form.pdf
    replyZh: 当然！我会用 PDF 技能来帮你填。
    images:
      - file: pdf-2-1.jpg
        alt: 上下文示意图中，用户附上 PDF 订单表后，Claude 先读取 PDF 技能的 SKILL.md，再按其中的引用读取 forms.md。
    source:
      url: https://www.anthropic.com/research/equipping-agents-for-the-real-world-with-agent-skills
      name: Anthropic 官网
    rights: © 2026 Anthropic PBC
  - caption: 给出 PDF 文件路径，让 Claude 提取其中的表单字段。
    lang: en
    ask: Use the PDF skill to extract the form fields from `path/to/some-file.pdf`
    askZh: 用 PDF 技能从 `path/to/some-file.pdf` 中提取表单字段。
    source:
      url: https://raw.githubusercontent.com/anthropics/skills/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/README.md
