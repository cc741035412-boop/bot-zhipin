  - caption: 把生产环境部署讨论整理成操作指南，从打发布标签的命令写到上线后的验证清单和回滚办法。
    lang: en
    ask: Save our discussion about deploying to production as a how-to guide
    reply: |-
      # How to Deploy to Production

      ## Overview
      Production deployment using GitHub Actions with zero-downtime rolling updates.
      **Time Required**: 15-20 minutes | **Complexity**: Intermediate

      ## Prerequisites
      - [ ] PR approved and merged to main
      - [ ] All CI tests passing
      - [ ] Database migrations reviewed
      - [ ] Feature flags configured

      ## Deployment Steps

      1. **Verify main branch is ready**
         ```bash
         git checkout main && git pull
         ```

      2. **Tag release**
         ```bash
         git tag -a v1.2.3 -m "Release v1.2.3"
         git push origin v1.2.3
         ```

      3. **Trigger deployment**
         - GitHub Actions auto-starts from tag push
         - Monitor: https://github.com/org/repo/actions

      4. **Database migrations** (if needed)
         - Auto-run in GitHub Actions
         - Check logs for completion

      5. **Verify deployment**
         - Wait for health checks (2-3 min)
         - Test key endpoints
         - Check error rates in Datadog

      ## Verification Checklist
      - [ ] All pods healthy in k8s dashboard
      - [ ] Error rate < 0.1% in last 10 min
      - [ ] Response time p95 < 500ms
      - [ ] Test login flow
      - [ ] Check Slack #alerts channel

      ## Troubleshooting

      **Health checks failing**
      → Check pod logs: `kubectl logs -f deployment/api -n production`

      **Migration errors**
      → Rollback: Revert tag, migrations auto-rollback

      **High error rate**
      → Emergency rollback: Previous tag auto-deploys via GitHub Actions

      ## Best Practices
      - Deploy during low-traffic hours (2-4am PST)
      - Have 2 engineers available
      - Monitor for 30 min post-deploy
      - Update #engineering Slack with deploy notice

      ## Related Docs
      - <mention-page url="...">Rollback Procedure</mention-page>
      - <mention-page url="...">Database Migration Guide</mention-page>
    askZh: 把我们关于如何部署到生产环境的讨论整理成一份操作指南并保存下来。
    replyZh: |-
      # 如何部署到生产环境

      ## 概述
      使用 GitHub Actions 部署到生产环境，通过滚动更新实现零停机。
      **所需时间**：15 至 20 分钟 | **难度**：中等

      ## 前置条件
      - [ ] PR 已获批准并合并到 main 分支
      - [ ] 所有 CI 测试均已通过
      - [ ] 数据库迁移已通过审查
      - [ ] 功能开关已配置

      ## 部署步骤

      1. **确认 main 分支已准备好**
         ```bash
         git checkout main && git pull
         ```

      2. **给发布版本打标签**
         ```bash
         git tag -a v1.2.3 -m "Release v1.2.3"
         git push origin v1.2.3
         ```

      3. **触发部署**
         - 推送标签后，GitHub Actions 会自动启动
         - 在此查看进度：https://github.com/org/repo/actions

      4. **数据库迁移**（如有需要）
         - 迁移会在 GitHub Actions 中自动执行
         - 查看日志，确认迁移完成

      5. **验证部署**
         - 等待健康检查完成（2 至 3 分钟）
         - 测试关键端点
         - 在 Datadog 中查看错误率

      ## 验证清单
      - [ ] k8s 控制面板上所有 Pod 均为健康状态
      - [ ] 过去 10 分钟的错误率 < 0.1%
      - [ ] 响应时间 p95 < 500ms
      - [ ] 测试登录流程
      - [ ] 查看 Slack 的 #alerts 频道

      ## 故障排查

      **健康检查失败**
      → 查看 Pod 日志：`kubectl logs -f deployment/api -n production`

      **迁移出错**
      → 回滚：撤销标签，数据库迁移会自动回滚

      **错误率过高**
      → 紧急回滚：GitHub Actions 会自动部署上一个标签对应的版本

      ## 最佳实践
      - 在流量较低的时段部署（太平洋标准时间凌晨 2 点至 4 点）
      - 确保有 2 名工程师可随时处理问题
      - 部署后持续监控 30 分钟
      - 在 Slack 的 #engineering 频道发布部署通知

      ## 相关文档
      - <mention-page url="...">回滚流程</mention-page>
      - <mention-page url="...">数据库迁移指南</mention-page>
