  - caption: 想改进视频转成的网页，先在终端选出对外观、导航和阅读体验的不满，再到浏览器里比较三种版式。
    lang: en
    ask: A,B,C
    reply: |-
      Before diving in — when you say "improve the generated UX," what's the main thing that bothers you about the current output? For example:

      - A) The visual design/aesthetics feel dated or generic
      - B) Navigation/usability — hard to find things, no search, no table of contents
      - C) Reading experience — typography, spacing, how text flows with images
      - D) Interactivity — want features like embedded video playback, keyboard shortcuts
      - E) Something else entirely

      What resonates most?
    askZh: 我选ABC
    replyZh: |-
      动手之前先问一句：你说想“改善生成页面的用户体验”，现在生成的页面最让你不满意的是哪一点？比如：

      - A) 视觉设计或整体风格显得过时，或者没什么特色
      - B) 导航或易用性：东西不好找，没有搜索，也没有目录
      - C) 阅读体验：文字排版、间距，以及图文怎么搭配
      - D) 交互：希望能在页面里播放视频、使用键盘快捷键等
      - E) 完全是别的问题

      哪些最符合你的感受？
