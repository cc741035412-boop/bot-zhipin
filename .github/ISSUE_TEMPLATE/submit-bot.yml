name: 投稿 Bot
description: 让你的 AI 生成投稿链接，勾选授权，其余自动完成。
title: "投稿："
labels: [投稿]
body:
  - type: textarea
    id: bundle
    attributes:
      label: 投稿包（由你的 AI 生成，不用改）
      description: 保留 AI 预填的内容；也可以粘贴完整明文投稿包或 BZB1 压缩令牌。
      render: text
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: 授权
      options:
        - label: 我同意以 CC BY 4.0 授权这次投稿，并确认内容是我有权公开的
          required: true
