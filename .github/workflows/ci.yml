# 提 PR 时检查：校验所有 Bot、跑测试、构建网站。
# PR 或手动派发触发；只读权限，不需要任何密钥。
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: 打印 PR 作者关联（联调用）
        if: github.event_name == 'pull_request'
        env:
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: echo "author_association=$ASSOCIATION pr_author=$PR_AUTHOR"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 检查投稿范围与上架日期
        run: node scripts/check-pr-scope.mjs --base HEAD^1 --head HEAD --association "${{ github.event_name == 'pull_request' && github.event.pull_request.author_association || 'CONTRIBUTOR' }}"
      - name: 校验所有 Bot
        run: npm run validate
      - name: 单元测试
        run: npm test
      - name: 构建网站
        run: npm run build
